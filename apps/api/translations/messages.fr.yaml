api:
  problem:
    not_found:
      title: 'Ressource introuvable'
      detail: "La ressource d'API demandée est introuvable."
    method_not_allowed:
      title: 'Méthode non autorisée'
      detail: "La méthode HTTP n'est pas autorisée pour cette ressource d'API."
    internal_error:
      title: 'Erreur interne du serveur'
      detail: "L'API n'a pas pu traiter la requête."
    invalid_request:
      title: 'Requête invalide'
      detail: 'Le corps de la requête est absent ou mal formé.'
    unsupported_media_type:
      title: 'Type de média non supporté'
      detail: 'Cette ressource attend un corps « application/json ».'
    unauthorized:
      title: 'Authentification requise'
      detail: 'Cette ressource nécessite une session authentifiée.'
    invalid_credentials:
      title: 'Identifiants invalides'
      detail: "L'adresse e-mail ou le mot de passe est incorrect."
    too_many_attempts:
      title: 'Trop de tentatives'
      detail: 'Trop de tentatives de connexion. Réessayez dans quelques minutes.'
    csrf:
      title: 'Jeton anti-CSRF absent ou invalide'
      detail: "La requête doit présenter un jeton anti-CSRF valide dans l'en-tête « X-CSRF-TOKEN »."
    account_disabled:
      title: 'Compte désactivé'
      detail: "Ce compte est désactivé. Contactez l'administrateur du serveur."
    weak_password:
      title: 'Mot de passe trop court'
      detail: 'Le mot de passe doit comporter entre 12 et 128 caractères.'
    password_already_set:
      title: 'Mot de passe déjà défini'
      detail: 'Le mot de passe du compte a déjà été défini.'
    owner_not_provisioned:
      title: 'Compte propriétaire absent'
      detail: "Aucun compte propriétaire n'a été initialisé sur ce serveur."
    invalid_audit_query:
      title: "Requête d'audit invalide"
      detail: 'La taille de page doit être comprise entre 1 et 100 et le curseur doit provenir de la page précédente.'
    audit_trail_forbidden:
      title: "Journal d'audit inaccessible"
      detail: "Cette session n'est rattachée à aucun espace de travail."
    audit_event_not_found:
      title: "Événement d'audit introuvable"
      detail: "Aucun événement d'audit ne porte cet identifiant dans cet espace de travail."
    invalid_asset_query:
      title: 'Requête de référentiel invalide'
      detail: 'Le numéro de page doit être compris entre 1 et 1000 et la taille de page entre 1 et 100.'
    asset_not_found:
      title: 'Actif introuvable'
      detail: 'Aucun actif du référentiel ne porte ce code.'
    invalid_product_query:
      title: 'Requête de catalogue invalide'
      detail: 'Le numéro de page doit être compris entre 1 et 1000, la taille de page entre 1 et 100 et la date métier doit être un jour calendaire ISO 8601 compris entre 1900-01-01 et 2100-12-31.'
    product_not_found:
      title: 'Produit introuvable'
      detail: 'Aucun produit du catalogue ne porte ce code.'
    invalid_category_query:
      title: 'Requête de catégories invalide'
      detail: 'Le numéro de page doit être compris entre 1 et 1000 et la taille de page entre 1 et 100.'
    invalid_category:
      title: 'Catégorie invalide'
      detail: 'Vérifiez le type, le libellé, le parent, les axes et les métadonnées de la catégorie.'
    category_payload_too_large:
      title: 'Corps de catégorie trop volumineux'
      detail: 'Le corps JSON dépasse la taille maximale autorisée.'
    category_conflict:
      title: 'Conflit de catégorie'
      detail: 'Une catégorie sœur active porte déjà ce libellé ou la catégorie a été modifiée entre-temps.'
    category_not_found:
      title: 'Catégorie introuvable'
      detail: 'Aucune catégorie ne porte cet identifiant dans cet espace de travail.'
    category_forbidden:
      title: 'Catégories inaccessibles'
      detail: "Cette session n'est rattachée à aucun espace de travail."
    invalid_account_query:
      title: 'Requête de comptes invalide'
      detail: 'Le numéro de page doit être compris entre 1 et 1000 et la taille de page entre 1 et 100.'
    invalid_account_rules_query:
      title: 'Date de lecture invalide'
      detail: "La date d'application doit être un jour calendaire ISO 8601, compris entre 1900-01-01 et 2100-12-31."
    invalid_account:
      title: 'Compte invalide'
      detail: "Vérifiez le libellé, la devise, la nature, le mode de valorisation et les dates d'ouverture et de clôture du compte."
    account_payload_too_large:
      title: 'Corps de compte trop volumineux'
      detail: 'Le corps JSON dépasse la taille maximale autorisée.'
    account_label_taken:
      title: 'Libellé de compte déjà utilisé'
      detail: 'Un compte actif de cet espace porte déjà ce libellé. Choisissez un autre libellé.'
    account_stale_version:
      title: 'Compte modifié entre-temps'
      detail: 'Le compte a été modifié par une autre requête. Rechargez le compte puis réappliquez la modification.'
    account_archived:
      title: 'Compte archivé'
      detail: "Un compte archivé est en lecture seule et n'accepte plus de modification."
    account_not_found:
      title: 'Compte introuvable'
      detail: 'Aucun compte ne porte cet identifiant dans cet espace de travail.'
    account_forbidden:
      title: 'Comptes inaccessibles'
      detail: "Cette session n'est rattachée à aucun espace de travail."
    invalid_account_rule_override:
      title: 'Dérogation de règle invalide'
      detail: "Vérifiez la règle visée, sa valeur, ses dates d'effet et le motif. Une dérogation ne peut énoncer que ce que le produit ou le modèle suivi par le compte pourrait énoncer lui-même, et un montant est libellé dans la devise du compte."
    account_rule_override_conflict:
      title: 'Dérogation déjà en place'
      detail: "Une dérogation en vigueur couvre déjà ces dates pour cette règle, ou vient d'être retirée par une autre requête. Rechargez les dérogations du compte puis réappliquez la modification."
    account_rule_override_not_found:
      title: 'Dérogation introuvable'
      detail: 'Aucune dérogation ne porte cet identifiant sur ce compte.'
    invalid_product_model_query:
      title: 'Requête de modèles invalide'
      detail: 'Le numéro de page doit être compris entre 1 et 1000 et la taille de page entre 1 et 100.'
    invalid_product_model:
      title: 'Modèle de produit invalide'
      detail: "Vérifiez le nom, la famille, l'enveloppe, le rendement, les capacités et les périodes datées du modèle. Un barème par tranches part de zéro, ses tranches se suivent sans trou ni recouvrement et la dernière reste sans plafond."
    product_model_payload_too_large:
      title: 'Corps de modèle trop volumineux'
      detail: 'Le corps JSON dépasse la taille maximale autorisée.'
    product_model_name_taken:
      title: 'Nom de modèle déjà utilisé'
      detail: 'Un modèle actif de cet espace porte déjà ce nom. Choisissez un autre nom.'
    product_model_stale_version:
      title: 'Modèle modifié entre-temps'
      detail: 'Le modèle a été modifié par une autre requête. Rechargez le modèle puis réappliquez la modification.'
    product_model_archived:
      title: 'Modèle archivé'
      detail: "Un modèle archivé est en lecture seule : il n'accepte plus de période et ne peut plus servir de point de départ."
    product_model_not_found:
      title: 'Modèle introuvable'
      detail: 'Aucun modèle de produit ne porte cet identifiant dans cet espace de travail.'
    product_model_forbidden:
      title: 'Modèles inaccessibles'
      detail: "Cette session n'est rattachée à aucun espace de travail."
