# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'

  App\Module\Foundation\Application\CallerWorkspaceContext:
    alias: App\Module\Identity\Infrastructure\Workspace\MembershipCallerWorkspace

  App\Module\Foundation\Application\TransactionBoundary:
    alias: App\Module\Identity\Infrastructure\Persistence\DbalTransactionManager

  # Replaces the security bundle's fixed-window login limiter (see ADR-0016).
  security.login_throttling.limiter:
    class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
    arguments:
      - '@limiter.login_global'
      - '@limiter.login_local'
      - '%env(APP_SECRET)%'
