doctrine:
  dbal:
    url: '%env(DATABASE_URL)%'
    server_version: '18'
    profiling_collect_backtrace: '%kernel.debug%'
    # The SQL logger writes bound parameters (e-mails, labels, amounts) to the logs in debug.
    logging: false

when@test:
  doctrine:
    dbal:
      dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@sessiondb:
  doctrine:
    dbal:
      dbname_suffix: '_test%env(default::TEST_TOKEN)%'
