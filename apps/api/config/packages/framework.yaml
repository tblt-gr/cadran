# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'
  default_locale: fr
  translator:
    default_path: '%kernel.project_dir%/translations'
    fallbacks:
      - fr

  # The session will be started ONLY if you read or write from it.
  # Records live in PostgreSQL rather than in files, so a password change can
  # drop every other open session in the same transaction (ADR-0024).
  session:
    name: cadran_session
    cookie_httponly: true
    cookie_samesite: lax
    # `true`, not `auto`: the runtime is HTTPS-only, and `auto` would silently
    # drop the Secure attribute if the application were ever served over plain
    # HTTP instead of failing visibly.
    cookie_secure: true
    cookie_lifetime: 0 # cookie dies with the browser session
    gc_maxlifetime: 1209600 # 14-day idle ceiling on the server side
    handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler

  #esi: true
  #fragments: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file

# The suite runs on mock_file storage, which never reaches a save handler. That
# would leave the session table — and therefore revocation on a password change
# — asserted by inspection only, so this environment exists to run the handler
# the application actually ships. Used by the session-handler integration tests.
when@sessiondb:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.native
