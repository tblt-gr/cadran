# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'
  default_locale: fr
  translator:
    default_path: '%kernel.project_dir%/translations'
    fallbacks:
      - fr

  # The session will be started ONLY if you read or write from it.
  # Storage stays on the native file handler, under a path that survives
  # cache:clear so a deploy does not sign everyone out. Moving it to
  # PdoSessionHandler in PostgreSQL is recorded as deferred in ADR-0015.
  session:
    name: cadran_session
    cookie_httponly: true
    cookie_samesite: lax
    # `true`, not `auto`: the runtime is HTTPS-only, and `auto` would silently
    # drop the Secure attribute if the application were ever served over plain
    # HTTP instead of failing visibly.
    cookie_secure: true
    cookie_lifetime: 0 # cookie dies with the browser session
    gc_maxlifetime: 1209600 # 14-day idle ceiling on the server side
    save_path: '%kernel.project_dir%/var/sessions'

  #esi: true
  #fragments: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
