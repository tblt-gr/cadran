  /api/v1/accounts/{id}/valuation:
    get:
      operationId: readAccountValuation
      summary: Read the latest valid balance of an account on a business date
      description: >-
        Returns the latest active snapshot on or before the requested date,
        with its age, source and missing/stale quality. A missing valuation
        is `null` on both the source and display amounts: a zero would invent
        a figure the holder never recorded. Display rounding is applied by
        the backend from the asset's display precision; the source literal
        is kept exact.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The latest valid valuation on the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValuation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/balances:
    get:
      operationId: listAccountBalances
      summary: List the balance snapshots recorded on an account
      description: >-
        The history of observed balances, superseded rows included. What
        answers on one day is the valuation resource; this list is the trail.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
