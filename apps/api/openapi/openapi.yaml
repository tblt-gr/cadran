openapi: 3.1.0
info:
  title: Cadran Budget API
  version: 0.1.0
  description: Versioned HTTP contract for the Cadran Budget modular monolith.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/status:
    get:
      operationId: getFoundationStatus
      summary: Check that the API foundation is available
      tags:
        - Foundation
      # The foundation probe is deliberately public; it exposes no workspace data.
      security: []
      responses:
        '200':
          description: The API foundation is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the current session
      description: >-
        Public. Reports whether the request carries an authenticated, active
        session and whether first-run password setup is still pending. Also
        plants the `csrf_token` cookie when the request lacks a valid one.
      tags:
        - Session
      security: []
      responses:
        '200':
          description: The session state for the calling browser.
          headers:
            Set-Cookie:
              description: >-
                `csrf_token=<signed token>; Path=/; SameSite=Strict` (plus
                `Secure` over HTTPS). Echo it in `X-CSRF-TOKEN` on every mutation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: openSession
      summary: Open a session with email and password
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie from a prior safe response, and its
        Origin must be this server. Failed attempts are rate-limited per email
        and source address.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: The session cookie is set. Fetch GET /api/v1/session for details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: closeSession
      summary: Close the current session
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie, with an Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is invalidated. A no-op when already anonymous.
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session/password:
    put:
      operationId: defineInitialPassword
      summary: Define the owner password on first run
      description: >-
        Public and one-time. Accepted only while the provisioned owner has no
        password; afterwards it answers 409. A same-origin browser mutation: it
        must send the X-CSRF-TOKEN header matching the csrf_token cookie, with an
        Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinePasswordRequest'
      responses:
        '204':
          description: The password is stored. The owner can now open a session.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read the workspace audit trail
      description: >-
        Requires an authenticated session. Returns the calling workspace's
        audit events, newest first. The workspace is resolved server-side from
        the session; there is no way to ask for another one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as `nextCursor` by the previous page. Omit it
            to read the newest events.
          schema:
            type: string
      responses:
        '200':
          description: One page of the workspace audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events/{id}:
    get:
      operationId: readAuditEvent
      summary: Read one audit event of the calling workspace
      description: >-
        Requires an authenticated session. The workspace is resolved server-side
        from the session and combined with the identifier, so an event that
        belongs to another workspace answers 404 exactly like an unknown one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of an event of the calling workspace.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: Read the system asset reference
      description: >-
        Requires an authenticated session. Returns the currencies and
        crypto-assets every financial figure is denominated in, with the
        precisions and rounding rule each one is read against. The reference is
        global and read-only: it belongs to no workspace and every session
        reads the same rows.
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the asset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets/{code}:
    get:
      operationId: readAsset
      summary: Read one asset of the system reference
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        asset".
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Asset code, such as `EUR` or `BTC`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]{1,11}$'
      responses:
        '200':
          description: The requested asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cadran_session
      description: >-
        Same-origin session cookie issued by POST /api/v1/session. HttpOnly, so
        the browser attaches it automatically and no script can read it.
  responses:
    Unauthorized:
      description: The request carries no authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The endpoint requires an application/json request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body or a query parameter is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: The email or password is incorrect. Identical for an unknown email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        On sign-in, either the credentials were valid but the account is
        disabled (`type: about:blank`), or the CSRF / Origin check failed
        (`type: /problems/csrf-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceForbidden:
      description: The session is attached to no workspace, so there is nothing to read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        No such object in the calling workspace. Identical whether the
        identifier is unknown or belongs to another workspace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfFailure:
      description: 'The CSRF token or Origin check failed (`type: /problems/csrf-token`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >-
        Too many failed sign-in attempts for this email and source address.
        Identical whether or not the email exists. Retry after the window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The owner password has already been defined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The password does not satisfy the account password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Double-submit CSRF token: the value of the `csrf_token` cookie from a
        prior safe response. Rejected with 403 if missing, altered, or expired.
      schema:
        type: string
  schemas:
    FoundationStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - apiVersion
      properties:
        status:
          type: string
          const: ready
        apiVersion:
          type: string
          const: v1
    SessionState:
      type: object
      additionalProperties: false
      required:
        - provisioned
        - authenticated
        - setupRequired
        - user
        - workspace
      properties:
        provisioned:
          type: boolean
          description: True once an owner account exists on this server.
        authenticated:
          type: boolean
          description: True when an active, authenticated session is attached.
        setupRequired:
          type: boolean
          description: True when the provisioned owner has no password yet.
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        workspace:
          oneOf:
            - $ref: '#/components/schemas/SessionWorkspace'
            - type: 'null'
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    SessionWorkspace:
      type: object
      additionalProperties: false
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    DefinePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          description: Cursor for the following page, or null on the last page.
          oneOf:
            - type: string
            - type: 'null'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorId
        - eventType
        - entityType
        - entityId
        - before
        - after
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          description: >-
            The user who performed the operation, or null when it had no
            authenticated actor - console provisioning and the first-run
            password flow.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        eventType:
          type: string
          examples:
            - session.opened
        entityType:
          type: string
          examples:
            - user
        entityId:
          type: string
          format: uuid
        before:
          $ref: '#/components/schemas/AuditDiffSide'
        after:
          $ref: '#/components/schemas/AuditDiffSide'
    AuditDiffSide:
      description: >-
        Bounded structured attributes, or null when the event has no such side.
        Sensitive attribute values are stored redacted, never in clear.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: 'null'
        - type: 'null'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of assets the reference holds.
          type: integer
          minimum: 0
    Asset:
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - displayName
        - storagePrecision
        - displayPrecision
        - roundingMode
        - displayStep
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
        kind:
          type: string
          enum:
            - FIAT
            - CRYPTO
        displayName:
          type: string
        storagePrecision:
          description: >-
            Decimal places a *submitted* figure of this asset may carry. A
            value beyond it is refused before persistence, never rounded in
            silence. It does not cap a derived figure: a conversion or a split
            keeps the full 24 decimals of the storage type.
          type: integer
          minimum: 0
          maximum: 24
        displayPrecision:
          description: >-
            Decimal places an interface or export shows. Never greater than
            `storagePrecision`, which JSON Schema cannot express here: showing
            more decimals than are stored would invent digits. A non-zero value
            smaller than the last shown decimal is displayed as such, never as
            a rounded zero.
          type: integer
          minimum: 0
          maximum: 24
        roundingMode:
          description: Rule the presentation boundary applies when it shows fewer decimals than are stored.
          type: string
          enum:
            - HALF_UP
            - HALF_EVEN
            - DOWN
        displayStep:
          $ref: '#/components/schemas/DecimalAmount'
    DecimalAmount:
      description: >-
        A financial decimal. Every amount, quantity, price and rate travels as
        a canonical decimal string paired with its asset code; a native JSON
        number is forbidden, because parsing one would put a binary float back
        into a financial value.
      type: object
      additionalProperties: false
      required:
        - value
        - assetCode
      properties:
        value:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '230.5688'
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
