              schema:
                $ref: '#/components/schemas/AccountBalanceSnapshotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: recordAccountBalance
      summary: Record a manual observed balance on an account
      description: >-
        Stores a dated manual snapshot in the account's own unit. The source
        literal is kept exactly as submitted. A second active snapshot of the
        same day and source is refused unless the current version is presented,
        in which case the previous row is superseded and kept on the trail.
        The author comes from the session.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
