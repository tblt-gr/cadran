  /api/v1/account-groups:
    get:
      operationId: listAccountGroups
      summary: List the calling workspace account groups
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Archived rows are
        omitted unless explicitly requested. Published shares stay null with an
        explicit reason until valuations exist; they are never `0%`.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: parentEligible
          in: query
          required: false
          description: Return only active groups below the maximum tree depth.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of account groups from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccountGroup
      summary: Create an account group in the calling workspace
      description: >-
        Creates a workspace-owned exclusive group. The parent, when present,
        must be active and belong to the calling workspace. The mutation
        requires the same-origin CSRF token.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountGroupRequest'
      responses:
        '201':
          description: The group was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '409':
          description: An active sibling already uses the normalized label.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group label, parent or bounds are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/account-groups/{id}:
    put:
      operationId: updateAccountGroup
      summary: Update an active account group
      description: >-
        Replaces editable group fields using optimistic versioning. Reparenting
        is allowed when it does not create a cycle or cross a workspace.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountGroupRequest'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The label conflicts or the submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group fields are invalid or the tree would cycle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/account-groups/{id}/archive:
    post:
      operationId: archiveAccountGroup
      summary: Archive an unused account group
      description: >-
        Archives a group that has no children and is not referenced by an
        account. Archived groups are read-only.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAccountGroupRequest'
      responses:
        '200':
          description: The archived group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group is already archived, has children or is referenced.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List the calling workspace financial accounts
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Closed and
        archived accounts are omitted unless explicitly requested.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeClosed
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: kind
          in: query
          required: false
          description: Restrict results to one account kind.
          schema:
            $ref: '#/components/schemas/AccountKind'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: One page of accounts from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccount
      summary: Create a financial account in the calling workspace
      description: >-
        Creates an account with its denomination, kind, lifecycle dates,
        valuation mode and inclusion policies. An optional exclusive group and
        extra tags may be set at creation; omitting the group (`null`) leaves
        the account ungrouped. The asset code must exist in the
        read-only system reference. An optional `productCode` backs the account
        with a catalogue product; the submitted kind and valuation mode are then
        checked against what that product declares. The mutation requires the
        same-origin CSRF token.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '409':
          description: >-
            An active account already uses the normalized label
            (`type: /problems/account-label-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The denomination, kind, product reference, valuation mode, masked
            identifier or lifecycle dates are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}:
    put:
      operationId: updateAccount
      summary: Update an active financial account
      description: >-
        Replaces the editable account fields using optimistic versioning, and
        closes or reopens the account through `closedOn`. The denomination is
        absent from the body: changing it would reinterpret every figure already
        recorded against the account. An account already used by history cannot
        change kind or product, and an archived account is read-only.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Either an active account already uses the normalized label
            (`type: /problems/account-label-taken`), or the submitted version is
            stale (`type: /problems/stale-version`). The two ask for opposite
            recoveries, so a client branches on the type rather than the status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The account fields are invalid, an immutable rule was violated, or
            the account is archived and read-only
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
  /api/v1/accounts/{id}/archive:
    post:
      operationId: archiveAccount
      summary: Archive a financial account
      description: >-
        Takes the account out of the working set without deleting it, so
        history and later valuations keep a row to point at. Archiving frees the
        account label for a new active account. An already archived account is
        rejected rather than archived twice.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAccountRequest'
      responses:
        '200':
          description: The archived account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
