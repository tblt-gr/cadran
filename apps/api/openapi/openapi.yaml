openapi: 3.1.0
info:
  title: Cadran Budget API
  version: 0.1.0
  description: Versioned HTTP contract for the Cadran Budget modular monolith.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/status:
    get:
      operationId: getFoundationStatus
      summary: Check that the API foundation is available
      tags:
        - Foundation
      # The foundation probe is deliberately public; it exposes no workspace data.
      security: []
      responses:
        '200':
          description: The API foundation is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the current session
      description: >-
        Public. Reports whether the request carries an authenticated, active
        session and whether first-run password setup is still pending. Also
        plants the `csrf_token` cookie when the request lacks a valid one.
      tags:
        - Session
      security: []
      responses:
        '200':
          description: The session state for the calling browser.
          headers:
            Set-Cookie:
              description: >-
                `csrf_token=<signed token>; Path=/; SameSite=Strict` (plus
                `Secure` over HTTPS). Echo it in `X-CSRF-TOKEN` on every mutation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: openSession
      summary: Open a session with email and password
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie from a prior safe response, and its
        Origin must be this server. Failed attempts are rate-limited per email
        and source address.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: The session cookie is set. Fetch GET /api/v1/session for details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: closeSession
      summary: Close the current session
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie, with an Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is invalidated. A no-op when already anonymous.
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session/password:
    put:
      operationId: defineInitialPassword
      summary: Define the owner password on first run
      description: >-
        Public and one-time. Accepted only while the provisioned owner has no
        password; afterwards it answers 409. A same-origin browser mutation: it
        must send the X-CSRF-TOKEN header matching the csrf_token cookie, with an
        Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinePasswordRequest'
      responses:
        '204':
          description: The password is stored. The owner can now open a session.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read the workspace audit trail
      description: >-
        Requires an authenticated session. Returns the calling workspace's
        audit events, newest first. The workspace is resolved server-side from
        the session; there is no way to ask for another one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as `nextCursor` by the previous page. Omit it
            to read the newest events.
          schema:
            type: string
      responses:
        '200':
          description: One page of the workspace audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events/{id}:
    get:
      operationId: readAuditEvent
      summary: Read one audit event of the calling workspace
      description: >-
        Requires an authenticated session. The workspace is resolved server-side
        from the session and combined with the identifier, so an event that
        belongs to another workspace answers 404 exactly like an unknown one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of an event of the calling workspace.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: Read the system asset reference
      description: >-
        Requires an authenticated session. Returns the currencies and
        crypto-assets every financial figure is denominated in, with the
        precisions and rounding rule each one is read against. The reference is
        global and read-only: it belongs to no workspace and every session
        reads the same rows.
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the asset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets/{code}:
    get:
      operationId: readAsset
      summary: Read one asset of the system reference
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        asset".
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Asset code, such as `EUR` or `BTC`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]{1,11}$'
      responses:
        '200':
          description: The requested asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Read the system product catalogue on a business date
      description: >-
        Requires an authenticated session. Returns the financial product models
        the application ships with — Livret A, LDDS, LEP, PEA, CTO, life
        insurance — each resolved against the business date asked for. The
        catalogue is global and read-only: it belongs to no workspace, every
        session reads the same rows, and a regulatory value changes through a
        reviewed migration rather than through a request.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: One page of the product catalogue, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{code}:
    get:
      operationId: readProduct
      summary: Read one catalogue product on a business date
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        product".
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Product code, such as `FR_LIVRET_A`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The requested product, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List the calling workspace categories
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Archived rows are
        omitted unless explicitly requested.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: type
          in: query
          required: false
          description: Restrict results to income or expense categories.
          schema:
            $ref: '#/components/schemas/CategoryType'
        - name: search
          in: query
          required: false
          description: Case-insensitive contained label search, bounded to 80 characters.
          schema:
            type: string
            maxLength: 80
        - name: parentEligible
          in: query
          required: false
          description: Return only active categories below the maximum tree depth.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of categories from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCategory
      summary: Create a category in the calling workspace
      description: >-
        Creates an income or expense category. The parent, when present, must
        be active, belong to the calling workspace and carry the same type.
        The mutation requires the same-origin CSRF token.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: The category was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '409':
          description: An active sibling already uses the normalized label.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category type, parent, metadata or bounds are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}:
    put:
      operationId: updateCategory
      summary: Update an active category
      description: >-
        Replaces editable category fields using optimistic versioning. Parent
        moves and archival are separate impact-aware operations outside this
        endpoint. A category already used by history cannot change type.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The label conflicts or the submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category fields are invalid or an immutable rule was violated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/account-groups:
    get:
      operationId: listAccountGroups
      summary: List the calling workspace account groups
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Archived rows are
        omitted unless explicitly requested. Published shares stay null with an
        explicit reason until valuations exist; they are never `0%`.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: parentEligible
          in: query
          required: false
          description: Return only active groups below the maximum tree depth.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of account groups from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccountGroup
      summary: Create an account group in the calling workspace
      description: >-
        Creates a workspace-owned exclusive group. The parent, when present,
        must be active and belong to the calling workspace. The mutation
        requires the same-origin CSRF token.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountGroupRequest'
      responses:
        '201':
          description: The group was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '409':
          description: An active sibling already uses the normalized label.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group label, parent or bounds are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/account-groups/{id}:
    put:
      operationId: updateAccountGroup
      summary: Update an active account group
      description: >-
        Replaces editable group fields using optimistic versioning. Reparenting
        is allowed when it does not create a cycle or cross a workspace.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountGroupRequest'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The label conflicts or the submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group fields are invalid or the tree would cycle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/account-groups/{id}/archive:
    post:
      operationId: archiveAccountGroup
      summary: Archive an unused account group
      description: >-
        Archives a group that has no children and is not referenced by an
        account. Archived groups are read-only.
      tags:
        - Account groups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAccountGroupRequest'
      responses:
        '200':
          description: The archived group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The group is already archived, has children or is referenced.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List the calling workspace financial accounts
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Closed and
        archived accounts are omitted unless explicitly requested.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeClosed
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: kind
          in: query
          required: false
          description: Restrict results to one account kind.
          schema:
            $ref: '#/components/schemas/AccountKind'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: One page of accounts from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccount
      summary: Create a financial account in the calling workspace
      description: >-
        Creates an account with its denomination, kind, lifecycle dates,
        valuation mode and inclusion policies. An optional exclusive group and
        extra tags may be set at creation; omitting the group (`null`) leaves
        the account ungrouped. The asset code must exist in the
        read-only system reference. An optional `productCode` backs the account
        with a catalogue product; the submitted kind and valuation mode are then
        checked against what that product declares. The mutation requires the
        same-origin CSRF token.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '409':
          description: >-
            An active account already uses the normalized label
            (`type: /problems/account-label-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The denomination, kind, product reference, valuation mode, masked
            identifier or lifecycle dates are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}:
    put:
      operationId: updateAccount
      summary: Update an active financial account
      description: >-
        Replaces the editable account fields using optimistic versioning, and
        closes or reopens the account through `closedOn`. The denomination is
        absent from the body: changing it would reinterpret every figure already
        recorded against the account. An account already used by history cannot
        change kind or product, and an archived account is read-only.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Either an active account already uses the normalized label
            (`type: /problems/account-label-taken`), or the submitted version is
            stale (`type: /problems/stale-version`). The two ask for opposite
            recoveries, so a client branches on the type rather than the status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The account fields are invalid, an immutable rule was violated, or
            the account is archived and read-only
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
  /api/v1/accounts/{id}/archive:
    post:
      operationId: archiveAccount
      summary: Archive a financial account
      description: >-
        Takes the account out of the working set without deleting it, so
        history and later valuations keep a row to point at. Archiving frees the
        account label for a new active account. An already archived account is
        rejected rather than archived twice.
      tags:
