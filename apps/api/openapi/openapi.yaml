          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/valuation:
    get:
      operationId: readAccountValuation
      summary: Read the latest valid balance of an account on a business date
      description: >-
        Returns the latest active snapshot on or before the requested date,
        with its age, source and missing/stale quality. A missing valuation
        is `null` on both the source and display amounts: a zero would invent
        a figure the holder never recorded. Display rounding is applied by
        the backend from the asset's display precision; the source literal
        is kept exact.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The latest valid valuation on the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValuation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/balances:
    get:
      operationId: listAccountBalances
      summary: List the balance snapshots recorded on an account
      description: >-
        The history of observed balances, superseded rows included. What
        answers on one day is the valuation resource; this list is the trail.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: The snapshot history of the account, newest day first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceSnapshotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: recordAccountBalance
      summary: Record a manual observed balance on an account
      description: >-
        Stores a dated manual snapshot in the account's own unit. The source
        literal is kept exactly as submitted. A second active snapshot of the
        same day and source is refused unless the current version is presented,
        in which case the previous row is superseded and kept on the trail.
        The author comes from the session.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAccountBalanceRequest'
      responses:
        '201':
          description: The snapshot as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            An active snapshot already exists (`type: /problems/account-balance-conflict`)
            or the submitted version is stale (`type: /problems/stale-version`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The snapshot fields are invalid or the account is archived.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/AmountInputProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rules:
    get:
      operationId: readAccountRules
      summary: Read the rules in force for an account on a business date
      description: >-
        Resolves the ceilings, rates and terms that apply to one account of the
        calling workspace on the business date asked for. Almost nothing here
        is stored on the account: the rules are read on that date from the
        authority the account follows, so a regulatory revision reaches every
        account at once and a past statement stays re-readable against the
        rules that applied then.

        Each entry states the same rule as every authority sees it, side by
        side and never merged. `catalog` is what the system catalogue
        publishes, reached through the account's own product reference or
        through the provenance of the workspace model it follows. `inherited`
        is what that workspace model says, and is present only when a model
        sits between the account and the catalogue. `override` is what was
        recorded against this account alone, and it carries the claim that
        explains it — who recorded it, when, and why. `effectiveLayer` names
        the one that wins, so no client re-implements the precedence.

        A ceiling always states the figure it is measured against, because the
        amount alone decides nothing: 22 950 € checked against a total balance
        and the same amount checked against deposits excluding interest give
        opposite verdicts on the same passbook. A rate always resolves to a
        bracket scale, single-bracket for the products the catalogue ships
        today, so a client reads every rate the same way. A rule the account is
        expected to carry and that no layer covers on the date is listed in
        `unavailableRuleKinds` and is never returned as zero.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The rules in force for the account on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rule-overrides:
    get:
      operationId: listAccountRuleOverrides
      summary: List every rule override ever recorded on an account
      description: >-
        Withdrawn overrides included, and whatever business date is being
        looked at. This is the history of what the account claimed, by whom and
        why; what applies on one day is answered by the account's rules
        resource instead.

        A withdrawn override stays here on purpose. Deleting it would erase the
        provenance of a figure a past statement was produced against, which is
        the one thing an override must never do.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Every override recorded on the account, oldest period first per rule kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverridePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: recordAccountRuleOverride
      summary: Record a dated rule override against one account
      description: >-
        States locally what the account inherits wrongly: a rate its branch
        negotiated, a ceiling the plan was opened under. The claim is dated,
        explained and attributed; the author comes from the session and is
        never read from the body.

        An override may only state what the authority behind the account could
        itself have stated. No rate on a product that promises none, no ceiling
        on a product that tracks no balance, and no amount in a unit the
        account is not held in. An account that follows neither a product nor a
        model inherits no rule and accepts no override at all.

        Two standing overrides of the same kind may not cover the same day. An
        overlap is refused rather than reconciled, so "the ceiling this account
        claims on 12 March" always has one answer or none.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAccountRuleOverrideRequest'
      responses:
        '201':
          description: The override as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A standing override of the same kind already covers these dates
            (`type: /problems/account-rule-override-conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The override is malformed, states something the account's authority
            could not state, or the account is archived
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/AmountInputProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rule-overrides/{overrideId}/withdraw:
    post:
      operationId: withdrawAccountRuleOverride
      summary: Withdraw a rule override
      description: >-
        Withdrawing is not ending. Ending an override is a dated fact recorded
        in its `validTo`, and the account keeps resolving against it up to that
        day for ever after. Withdrawing says the claim should not have applied
        at all: it stops answering on every date, past ones included, and the
        inherited rule of each of those dates takes over again — the dated one,
        not whatever is in force today.

        The row is kept and stays readable, so the trail still shows what was
        claimed, by whom and why. Withdrawing a second time is refused rather
        than silently accepted.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: The override as withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The override was already withdrawn
            (`type: /problems/account-rule-override-conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The body carries a field, or the account is archived
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/reports/monthly:
    get:
      operationId: readMonthlyProjection
      summary: Read the monthly financial projection of the calling workspace
      description: >-
        Computes one month from booked, non-voided source transactions and
        dated account valuations. Pending rows move no total and are counted
        separately. Transfers and adjustments are excluded from income and
        expense; transfers into savings and portfolio accounts are reported as
        savings transfers. Every absent figure carries a specific reason.
      tags:
        - Reporting
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          required: true
          description: The bounded calendar month to compute.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The computed monthly projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyProjection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '422':
          description: >-
            The workspace exceeds a bounded aggregate limit
            (`type: /problems/monthly-projection-scope-too-large`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/reports/monthly/{kpi}/explain:
    get:
      operationId: explainMonthlyKpi
      summary: Explain one monthly projection KPI of the calling workspace
      description: >-
        Selects a metric from the exact monthly projection view and exposes its
        formula, bounded source identifiers, freshness and quality. No policy
        selector or version is exposed in this release.
      tags: [Reporting]
      security:
        - sessionCookie: []
      parameters:
        - name: kpi
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                cashIncome,
                nonCashBenefits,
                budgetExpenses,
                uncategorizedExpenses,
                budgetSurplus,
                savingsTransfers,
                cashSavingsRate,
                beginningNetWorth,
                endNetWorth,
                netWorthDelta,
              ]
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The exact calculation details for the addressed monthly KPI.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyKpiExplanation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkspaceForbidden' }
        '422':
          description: The workspace exceeds a bounded aggregate limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/net-worth:
    get:
      operationId: readNetWorth
      summary: Read the explainable net worth of the calling workspace
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. The total is the
        sum of the signed values of the accounts included in net worth and open
        on the requested day; a liability carries the negative sign while its
        stored amount stays positive. The total is null with a reason whenever
        it cannot be produced — a missing valuation, no eligible account, or
        eligible accounts denominated in more than one asset — and is never an
        invented `0`. The delta and the change rate fail independently: a real
        movement against a zero or negative base keeps its amount and publishes
        no rate. Every contributing account and every exclusive group weight
        travels with the figure so the result can be challenged.
      tags:
        - Net worth
      security:
        - sessionCookie: []
      parameters:
        - name: asOf
          in: query
          required: false
          description: Business day the aggregate is answered for. Defaults to today.
          schema:
            type: string
            format: date
        - name: comparedTo
          in: query
          required: false
          description: >-
            Earlier business day the delta is measured against. Defaults to the
            same day one month earlier, kept inside that month.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The net worth of the calling workspace on the requested day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '422':
          description: >-
            The workspace holds more accounts or more groups than one
            aggregate reads (`type: /problems/net-worth-scope-too-large`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/net-worth/history:
    get:
      operationId: readNetWorthHistory
      summary: Read the net-worth history curve of the calling workspace
      description: >-
        Requires an authenticated session. One point per month end, ending on
        the requested day itself so the curve finishes on the headline figure.
        Each point is recomputed from the valuations that were valid on its own
        day, so a figure recorded late lands on the day it describes. A month
        that cannot be computed keeps its place with a null total and a reason,
        never a fall to zero.
      tags:
        - Net worth
      security:
        - sessionCookie: []
      parameters:
        - name: asOf
          in: query
          required: false
          description: Business day the curve ends on. Defaults to today.
          schema:
            type: string
            format: date
        - name: months
          in: query
          required: false
          description: Number of points, the final one included.
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
      responses:
        '200':
          description: The net-worth curve of the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorthHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '422':
          description: >-
            The workspace holds more accounts or more groups than one
            aggregate reads (`type: /problems/net-worth-scope-too-large`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models:
    get:
      operationId: listProductModels
      summary: List the calling workspace product models
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. These are the
        models a workspace describes itself, beside the read-only system
        catalogue; archived models are omitted unless explicitly requested.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of product models from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createProductModel
      summary: Describe a product model in the calling workspace
      description: >-
        Records a model the workspace describes itself: a family, an envelope, a
        yield, a valuation mode, capabilities, and its own dated rule periods.
        Nothing here reads or writes the system catalogue. A rate period is a
        bracket scale with an explicit `MARGINAL` or `FLAT_BY_BRACKET` mode; a
        single rate is the one-bracket case of the same shape. The mutation
        requires the same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductModelRequest'
      responses:
        '201':
          description: The model was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name, family, envelope, yield, valuation mode, capabilities or a
            dated period is invalid. A rate scale that overlaps, leaves a gap,
            does not start at zero or leaves no open upper bracket is refused
            here and nothing is persisted.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/AmountInputProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/from-product:
    post:
      operationId: createProductModelFromProduct
      summary: Start a product model from a system catalogue product
      description: >-
        Copies a catalogue product into a workspace model. The copy is made by
        the server from the catalogue row, so a model claiming to come from a
        Livret A carries what the catalogue says a Livret A is. It takes the
        description and the dated periods with their effective dates, and drops
        every figure's publication and verification trace; from that moment the
        model no longer tracks the catalogue. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductModelFromProductRequest'
      responses:
        '201':
          description: The model was started from the catalogue product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name or valuation mode is invalid, or the product code does not
            exist in the system catalogue. An unknown and a malformed code
            answer alike.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}:
    get:
      operationId: readProductModel
      summary: Read one product model of the calling workspace
      description: >-
        Returns the model with every dated period it ever recorded, including
        when it is archived: an account created from a model must keep resolving
        against the description it was created with. An unknown identifier and
        one that belongs to another workspace answer alike.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested product model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/duplicate:
    post:
      operationId: duplicateProductModel
      summary: Duplicate a product model of the calling workspace
      description: >-
        Copies the description and the dated periods with their effective dates
        untouched, under a new identity and name, and nothing else: no account,
        balance, valuation or external identifier has ever belonged to a model.
        The copy records the model it started from and stops following it. An
        archived model cannot be duplicated. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateProductModelRequest'
      responses:
        '201':
          description: The model was duplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name is invalid, or the source model is archived and cannot
            start a new one (`type: /problems/product-model-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/rules:
    post:
      operationId: addProductModelRule
      summary: Record a dated period on a product model
      description: >-
        Editing a model is adding to it. Recording a period appends it and
        closes the open-ended period of the same kind it supersedes the day
        before it starts, so a past statement still resolves against the figures
        that covered it. Nothing already recorded is rewritten or removed, and
        there is no endpoint that edits or deletes a period. Optimistic
        versioning guards the write. The mutation requires the same-origin CSRF
        token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProductModelRuleRequest'
      responses:
        '200':
          description: The model with the recorded period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The submitted version is stale
            (`type: /problems/stale-version`). Reload the model and reapply.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The period is invalid, contradicts a recorded period of the same
            kind, or the model is archived and read-only
            (`type: /problems/product-model-archived`).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/AmountInputProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/archive:
    post:
      operationId: archiveProductModel
      summary: Archive a product model
      description: >-
        Takes the model out of the working set and frees its name, without
        deleting it: it stays readable by identifier with everything it ever
        said, so an account created from it keeps a reproducible reference. An
        already archived model is rejected. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveProductModelRequest'
      responses:
        '200':
          description: The archived model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The submitted version is stale (`type: /problems/stale-version`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'The model is already archived (`type: /problems/product-model-archived`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/recurrence-candidates:
    get:
      operationId: detectRecurrenceCandidates
      summary: Detect recurring transaction candidates in a bounded history window
      description: >-
        Read-only detection over the latest 24 months and at most 5000 eligible movements.
        Reaching the row cap returns `partial: true`; this operation never writes a recurrence,
        occurrence, dismissal or transaction.
      tags: [Transactions]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Qualitative recurring candidates not dismissed by the workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurrenceCandidatePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkspaceForbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/recurrence-candidates/dismiss:
    post:
      operationId: dismissRecurrenceCandidate
