        label:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        parentLabel:
          description: Label of the parent category, or null when the category is a root.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        icon:
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            - type: 'null'
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        defaultAnalyticAxes:
          $ref: '#/components/schemas/AnalyticAxes'
        budgetIncluded:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 32767
        depth:
          type: integer
          minimum: 1
          maximum: 8
        version:
          type: integer
          minimum: 1
        used:
          type: boolean
        typeEditable:
          description: Backend-owned eligibility for changing income/expense type.
          type: boolean
        typeEditReason:
          description: Why the type is immutable, or null when it can be changed.
          oneOf:
            - type: string
              enum:
                - ARCHIVED
                - USED
                - CHILD
                - HAS_CHILDREN
            - type: 'null'
        canAcceptChildren:
          description: True only for active categories below the maximum tree depth.
          type: boolean
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        replacement:
          description: Where this category is redirected, or null when it is not.
          oneOf:
            - $ref: '#/components/schemas/CategoryReplacement'
            - type: 'null'
    CategoryLifecycleOperation:
      type: string
      enum:
        - ARCHIVE
        - MERGE
        - MOVE
        - REPLACE
    CategoryImpactBlocker:
      description: Why the impact assessment refuses an operation.
      type: string
      enum:
        - ACTIVE_CHILDREN
        - ALREADY_REDIRECTED
        - CYCLE
        - DEPTH_EXCEEDED
        - REDIRECTION_TARGET
        - REPLACEMENT_CHAIN_TOO_LONG
        - REPLACEMENT_CYCLE
        - SIBLING_LABEL_CONFLICT
        - SOURCE_ARCHIVED
        - TARGET_ARCHIVED
        - TARGET_IS_DESCENDANT
        - TARGET_IS_SELF
        - TARGET_MISSING
        - TARGET_NOT_FOUND
        - TARGET_TYPE_MISMATCH
    CategoryReplacement:
      description: >-
        Where the classifications of a category are redirected. A merge carries
        no date and redirects the whole history; a replacement carries the day
        it takes effect and leaves the period before it untouched.
      type: object
      additionalProperties: false
      required:
        - kind
        - targetId
        - targetLabel
        - effectiveFrom
      properties:
        kind:
          type: string
          enum:
            - MERGE
            - REPLACEMENT
        targetId:
          type: string
          format: uuid
        targetLabel:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        effectiveFrom:
          description: Null for a merge, which redirects the whole history.
          oneOf:
            - type: string
              format: date
            - type: 'null'
    CategoryImpact:
      type: object
      additionalProperties: false
      required:
        - operation
        - categoryId
        - targetId
        - targetLabel
        - effectiveFrom
        - descendantCount
        - archivedDescendantCount
        - reparentedChildCount
        - incomingRedirectionCount
        - resultingDepth
        - maximumDepth
        - archivesSource
        - redirectsHistory
        - allowed
        - blockers
        - affectedClassifications
        - affectedClassificationsReason
      properties:
        operation:
          $ref: '#/components/schemas/CategoryLifecycleOperation'
        categoryId:
          type: string
          format: uuid
        targetId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        targetLabel:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        effectiveFrom:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        descendantCount:
          description: Categories below the source, archived ones included.
          type: integer
          minimum: 0
        archivedDescendantCount:
          type: integer
          minimum: 0
        reparentedChildCount:
          description: Direct children a merge would move under the target.
          type: integer
          minimum: 0
        incomingRedirectionCount:
          description: >-
            Redirections that name this category as their target. A merge carries
            them over to its own target; archiving is refused while any exists,
            because it names no successor to carry them to.
          type: integer
          minimum: 0
        resultingDepth:
          description: >-
            The deepest level the branch would reach afterwards. It may exceed
            `maximumDepth`, which is exactly what `DEPTH_EXCEEDED` reports.
          type: integer
          minimum: 1
        maximumDepth:
          type: integer
          minimum: 1
        archivesSource:
          type: boolean
        redirectsHistory:
          type: boolean
        allowed:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CategoryImpactBlocker'
        affectedClassifications:
          description: >-
            Historical classifications the operation would re-point, or null
            when that count cannot be established. Never an invented `0`.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        affectedClassificationsReason:
          description: >-
            Why `affectedClassifications` could not be counted, or null when the
            count is known.
          oneOf:
            - type: string
              enum:
                - TRANSACTIONS_UNAVAILABLE
            - type: 'null'
