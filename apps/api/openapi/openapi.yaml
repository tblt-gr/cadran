        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            An active snapshot already exists (`type: /problems/account-balance-conflict`)
            or the submitted version is stale (`type: /problems/stale-version`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The snapshot fields are invalid or the account is archived.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rules:
    get:
      operationId: readAccountRules
      summary: Read the rules in force for an account on a business date
      description: >-
        Resolves the ceilings, rates and terms that apply to one account of the
        calling workspace on the business date asked for. Almost nothing here
        is stored on the account: the rules are read on that date from the
        authority the account follows, so a regulatory revision reaches every
        account at once and a past statement stays re-readable against the
        rules that applied then.

        Each entry states the same rule as every authority sees it, side by
        side and never merged. `catalog` is what the system catalogue
        publishes, reached through the account's own product reference or
        through the provenance of the workspace model it follows. `inherited`
        is what that workspace model says, and is present only when a model
        sits between the account and the catalogue. `override` is what was
        recorded against this account alone, and it carries the claim that
        explains it — who recorded it, when, and why. `effectiveLayer` names
        the one that wins, so no client re-implements the precedence.

        A ceiling always states the figure it is measured against, because the
        amount alone decides nothing: 22 950 € checked against a total balance
        and the same amount checked against deposits excluding interest give
        opposite verdicts on the same passbook. A rate always resolves to a
        bracket scale, single-bracket for the products the catalogue ships
        today, so a client reads every rate the same way. A rule the account is
        expected to carry and that no layer covers on the date is listed in
        `unavailableRuleKinds` and is never returned as zero.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The rules in force for the account on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rule-overrides:
    get:
      operationId: listAccountRuleOverrides
      summary: List every rule override ever recorded on an account
      description: >-
        Withdrawn overrides included, and whatever business date is being
        looked at. This is the history of what the account claimed, by whom and
        why; what applies on one day is answered by the account's rules
        resource instead.

        A withdrawn override stays here on purpose. Deleting it would erase the
        provenance of a figure a past statement was produced against, which is
        the one thing an override must never do.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Every override recorded on the account, oldest period first per rule kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverridePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: recordAccountRuleOverride
      summary: Record a dated rule override against one account
      description: >-
        States locally what the account inherits wrongly: a rate its branch
        negotiated, a ceiling the plan was opened under. The claim is dated,
        explained and attributed; the author comes from the session and is
        never read from the body.

        An override may only state what the authority behind the account could
        itself have stated. No rate on a product that promises none, no ceiling
        on a product that tracks no balance, and no amount in a unit the
        account is not held in. An account that follows neither a product nor a
        model inherits no rule and accepts no override at all.

        Two standing overrides of the same kind may not cover the same day. An
        overlap is refused rather than reconciled, so "the ceiling this account
        claims on 12 March" always has one answer or none.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAccountRuleOverrideRequest'
      responses:
        '201':
          description: The override as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A standing override of the same kind already covers these dates
            (`type: /problems/account-rule-override-conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The override is malformed, states something the account's authority
            could not state, or the account is archived
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rule-overrides/{overrideId}/withdraw:
    post:
      operationId: withdrawAccountRuleOverride
      summary: Withdraw a rule override
      description: >-
        Withdrawing is not ending. Ending an override is a dated fact recorded
        in its `validTo`, and the account keeps resolving against it up to that
        day for ever after. Withdrawing says the claim should not have applied
        at all: it stops answering on every date, past ones included, and the
        inherited rule of each of those dates takes over again — the dated one,
        not whatever is in force today.

        The row is kept and stays readable, so the trail still shows what was
        claimed, by whom and why. Withdrawing a second time is refused rather
        than silently accepted.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: The override as withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRuleOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The override was already withdrawn
            (`type: /problems/account-rule-override-conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The body carries a field, or the account is archived
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models:
    get:
      operationId: listProductModels
      summary: List the calling workspace product models
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. These are the
        models a workspace describes itself, beside the read-only system
        catalogue; archived models are omitted unless explicitly requested.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of product models from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createProductModel
      summary: Describe a product model in the calling workspace
      description: >-
        Records a model the workspace describes itself: a family, an envelope, a
        yield, a valuation mode, capabilities, and its own dated rule periods.
        Nothing here reads or writes the system catalogue. A rate period is a
        bracket scale with an explicit `MARGINAL` or `FLAT_BY_BRACKET` mode; a
        single rate is the one-bracket case of the same shape. The mutation
        requires the same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductModelRequest'
      responses:
        '201':
          description: The model was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name, family, envelope, yield, valuation mode, capabilities or a
            dated period is invalid. A rate scale that overlaps, leaves a gap,
            does not start at zero or leaves no open upper bracket is refused
            here and nothing is persisted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/from-product:
    post:
      operationId: createProductModelFromProduct
      summary: Start a product model from a system catalogue product
      description: >-
        Copies a catalogue product into a workspace model. The copy is made by
        the server from the catalogue row, so a model claiming to come from a
        Livret A carries what the catalogue says a Livret A is. It takes the
        description and the dated periods with their effective dates, and drops
        every figure's publication and verification trace; from that moment the
        model no longer tracks the catalogue. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductModelFromProductRequest'
      responses:
        '201':
          description: The model was started from the catalogue product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name or valuation mode is invalid, or the product code does not
            exist in the system catalogue. An unknown and a malformed code
            answer alike.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}:
    get:
      operationId: readProductModel
      summary: Read one product model of the calling workspace
      description: >-
        Returns the model with every dated period it ever recorded, including
        when it is archived: an account created from a model must keep resolving
        against the description it was created with. An unknown identifier and
        one that belongs to another workspace answer alike.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested product model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/duplicate:
    post:
      operationId: duplicateProductModel
      summary: Duplicate a product model of the calling workspace
      description: >-
        Copies the description and the dated periods with their effective dates
        untouched, under a new identity and name, and nothing else: no account,
        balance, valuation or external identifier has ever belonged to a model.
        The copy records the model it started from and stops following it. An
        archived model cannot be duplicated. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateProductModelRequest'
      responses:
        '201':
          description: The model was duplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            An active model already uses the name
            (`type: /problems/product-model-name-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The name is invalid, or the source model is archived and cannot
            start a new one (`type: /problems/product-model-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/rules:
    post:
      operationId: addProductModelRule
      summary: Record a dated period on a product model
      description: >-
        Editing a model is adding to it. Recording a period appends it and
        closes the open-ended period of the same kind it supersedes the day
        before it starts, so a past statement still resolves against the figures
        that covered it. Nothing already recorded is rewritten or removed, and
        there is no endpoint that edits or deletes a period. Optimistic
        versioning guards the write. The mutation requires the same-origin CSRF
        token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProductModelRuleRequest'
      responses:
        '200':
          description: The model with the recorded period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The submitted version is stale
            (`type: /problems/stale-version`). Reload the model and reapply.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The period is invalid, contradicts a recorded period of the same
            kind, or the model is archived and read-only
            (`type: /problems/product-model-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-models/{id}/archive:
    post:
      operationId: archiveProductModel
      summary: Archive a product model
      description: >-
        Takes the model out of the working set and frees its name, without
        deleting it: it stays readable by identifier with everything it ever
        said, so an account created from it keeps a reproducible reference. An
        already archived model is rejected. The mutation requires the
        same-origin CSRF token.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveProductModelRequest'
      responses:
        '200':
          description: The archived model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProductModelMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The submitted version is stale (`type: /problems/stale-version`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/ProductModelPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'The model is already archived (`type: /problems/product-model-archived`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cadran_session
      description: >-
        Same-origin session cookie issued by POST /api/v1/session. HttpOnly, so
        the browser attaches it automatically and no script can read it.
  responses:
    Unauthorized:
      description: The request carries no authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The endpoint requires an application/json request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body or a query parameter is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: The email or password is incorrect. Identical for an unknown email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        On sign-in, either the credentials were valid but the account is
        disabled (`type: about:blank`), or the CSRF / Origin check failed
        (`type: /problems/csrf-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceForbidden:
      description: The session is attached to no workspace, so there is nothing to read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        No such object in the calling workspace. Identical whether the
        identifier is unknown or belongs to another workspace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfFailure:
      description: 'The CSRF token or Origin check failed (`type: /problems/csrf-token`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CategoryMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductModelMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The JSON request body exceeds the 16 KiB mutation limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductModelPayloadTooLarge:
      description: The JSON request body exceeds the 32 KiB mutation limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >-
        Too many failed sign-in attempts for this email and source address.
        Identical whether or not the email exists. Retry after the window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The owner password has already been defined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The password does not satisfy the account password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Double-submit CSRF token: the value of the `csrf_token` cookie from a
        prior safe response. Rejected with 403 if missing, altered, or expired.
      schema:
        type: string
    BusinessDate:
      name: asOf
      in: query
      required: false
      description: >-
        Business date the catalogue rules are resolved against, as an ISO 8601
        calendar day. Defaults to today. A rule is selected by this date and
        never by the current date, so reading a past statement shows the
        ceiling and rate that applied then.
      schema:
        type: string
        format: date
        examples:
          - '2026-09-02'
  schemas:
    FoundationStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - apiVersion
      properties:
        status:
          type: string
          const: ready
        apiVersion:
          type: string
          const: v1
    SessionState:
      type: object
      additionalProperties: false
      required:
        - provisioned
        - authenticated
        - setupRequired
        - user
        - workspace
      properties:
        provisioned:
          type: boolean
          description: True once an owner account exists on this server.
        authenticated:
          type: boolean
          description: True when an active, authenticated session is attached.
        setupRequired:
          type: boolean
          description: True when the provisioned owner has no password yet.
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        workspace:
          oneOf:
            - $ref: '#/components/schemas/SessionWorkspace'
            - type: 'null'
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    SessionWorkspace:
      type: object
      additionalProperties: false
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    DefinePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          description: Cursor for the following page, or null on the last page.
          oneOf:
            - type: string
            - type: 'null'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorId
        - eventType
        - entityType
        - entityId
        - before
        - after
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          description: >-
            The user who performed the operation, or null when it had no
            authenticated actor - console provisioning and the first-run
            password flow.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        eventType:
          type: string
          examples:
            - session.opened
        entityType:
          type: string
          examples:
            - user
        entityId:
          type: string
          format: uuid
        before:
          $ref: '#/components/schemas/AuditDiffSide'
        after:
          $ref: '#/components/schemas/AuditDiffSide'
    AuditDiffSide:
      description: >-
        Bounded structured attributes, or null when the event has no such side.
        Sensitive attribute values are stored redacted, never in clear.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: 'null'
        - type: 'null'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of assets the reference holds.
          type: integer
          minimum: 0
    Asset:
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - displayName
        - storagePrecision
        - displayPrecision
        - roundingMode
        - displayStep
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
        kind:
          type: string
          enum:
            - FIAT
            - CRYPTO
        displayName:
          type: string
        storagePrecision:
          description: >-
            Decimal places a *submitted* figure of this asset may carry. A
            value beyond it is refused before persistence, never rounded in
            silence. It does not cap a derived figure: a conversion or a split
            keeps the full 24 decimals of the storage type.
          type: integer
          minimum: 0
          maximum: 24
        displayPrecision:
          description: >-
            Decimal places an interface or export shows. Never greater than
            `storagePrecision`, which JSON Schema cannot express here: showing
            more decimals than are stored would invent digits. A non-zero value
            smaller than the last shown decimal is displayed as such, never as
            a rounded zero.
          type: integer
          minimum: 0
          maximum: 24
        roundingMode:
          description: Rule the presentation boundary applies when it shows fewer decimals than are stored.
          type: string
          enum:
            - HALF_UP
            - HALF_EVEN
            - DOWN
        displayStep:
          $ref: '#/components/schemas/DecimalAmount'
    ProductPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of products the catalogue holds.
          type: integer
          minimum: 0
    CeilingBasis:
      description: >-
        The figure a ceiling is compared against. Three of these four measures
        give a different verdict on the same account, so the amount alone
        decides nothing. A share savings plan is capped on the contributions
        paid into it, whatever the plan is worth, so a plan that grew past its
        ceiling through market value has broken no rule. A regulated passbook is
        capped on what was deposited, credited interest excluded, so a passbook
        carried past its ceiling by its own interest has broken no rule either.
        A combined ceiling is measured across the products sharing it and can be
        reached while no single account is.
      type: string
      enum:
        - NONE
        - BALANCE_EXCLUDING_INTEREST
        - TOTAL_BALANCE
        - CONTRIBUTIONS
        - COMBINED_CONTRIBUTIONS
    ProductCode:
      description: >-
        The stable identifier of a catalogue product. The catalogue is a global
        system reference with no workspace, so a code either exists for every
        workspace or for none.
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
      examples:
        - FR_LIVRET_A
    Product:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - jurisdiction
        - accountKind
        - wrapperKind
        - yieldKind
        - yieldGuaranteed
        - ceilingBasis
        - defaultGroupCode
        - capabilities
        - catalogVersion
        - archivedAt
        - asOf
        - rules
        - unavailableRuleKinds
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - FR_LIVRET_A
        displayName:
          type: string
        jurisdiction:
          description: ISO 3166-1 alpha-2 country code, or null for a model that belongs to no country.
          oneOf:
            - type: string
              pattern: '^[A-Z]{2}$'
            - type: 'null'
        accountKind:
          $ref: '#/components/schemas/AccountKind'
        wrapperKind:
          $ref: '#/components/schemas/ProductWrapperKind'
        yieldKind:
          $ref: '#/components/schemas/ProductYieldKind'
        yieldGuaranteed:
          description: >-
            Whether the rate the catalogue carries is owed to the holder. False
            for every market product, so no interface has to infer a promise
            from a product name.
          type: boolean
        ceilingBasis:
          $ref: '#/components/schemas/CeilingBasis'
        defaultGroupCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        capabilities:
          description: >-
            Explicit implemented behaviors enabled by this product. Consumers
            must use these values rather than infer behavior from the product
            code or display name.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductCapability'
        catalogVersion:
          type: integer
          minimum: 1
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        asOf:
          description: The business date the rules below were resolved against.
          type: string
          format: date
        rules:
          description: The rules covering `asOf`, at most one per rule kind.
          type: array
          items:
            $ref: '#/components/schemas/ProductRule'
        unavailableRuleKinds:
          description: >-
            Rule kinds this product is expected to carry and that no sourced
            period covers on `asOf`. An interface shows them as unavailable
            with their reason; it never shows them as zero.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
    ProductCapability:
      type: string
      enum:
        - SUPPORTS_BALANCE
        - SUPPORTS_TRANSACTIONS
        - SUPPORTS_INTEREST
        - SUPPORTS_HOLDINGS
        - SUPPORTS_TRADES
        - SUPPORTS_ARBITRAGE
        - SUPPORTS_CONTRIBUTIONS
        - SUPPORTS_FEES
        - SUPPORTS_TAX_TRACKING
        - SUPPORTS_LIABILITY
    ProductRuleKind:
      type: string
      enum:
        - DEPOSIT_CEILING
        - BALANCE_CEILING
        - CONTRIBUTION_CEILING
        - COMBINED_CONTRIBUTION_CEILING
        - ANNUAL_RATE
        - MIN_RATE
        - INTEREST_ACCRUAL_METHOD
        - ELIGIBILITY
        - TAX_REFERENCE
    ProductRule:
      description: >-
        One dated rule of one product, with the publication it was read from.
        Exactly one of `amount`, `percentage` and `text` is set, decided by the
        rule kind.
      type: object
      additionalProperties: false
      required:
        - kind
        - valueType
        - amount
        - percentage
        - text
        - validFrom
        - validTo
        - verification
        - verifiedOn
        - verifiedBy
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        percentage:
          description: >-
            A rate expressed in percent as the source published it: `1.7` reads
            1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
              examples:
                - '1.7'
            - type: 'null'
        text:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the source and to the translation
            catalogue.
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
              examples:
                - NO_REGULATORY_CONTRIBUTION_CEILING
            - type: 'null'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        verifiedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        verifiedBy:
          oneOf:
            - type: string
            - type: 'null'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    ProductRuleSource:
      description: The official publication the value was read from.
      type: object
      additionalProperties: false
      required:
        - publisher
        - title
        - url
        - publishedOn
        - retrievedOn
      properties:
        publisher:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publishedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        retrievedOn:
          description: The day a maintainer actually opened the publication.
          type: string
          format: date
    ProductWrapperKind:
      description: >-
        The regulatory or contractual envelope a product sits in. Shared by the
        system catalogue and the product models a workspace describes itself.
      type: string
      enum:
        - NONE
        - REGULATED_SAVINGS
        - TAX_WRAPPER
        - SECURITIES_ACCOUNT
        - LIFE_INSURANCE
        - RETIREMENT
        - EMPLOYEE_SAVINGS
    ProductYieldKind:
      description: >-
        Where a product's return comes from. `MARKET` and `MANUAL_VALUATION`
        carry no rate rule at all: what they earn comes from their assets and
        flows. A model of one of those kinds cannot record a rate period.
      type: string
      enum:
        - NONE
        - REGULATED_RATE
        - CONTRACTUAL_FIXED
        - CONTRACTUAL_VARIABLE
        - MARKET
        - MANUAL_VALUATION
    RuleValueType:
      description: >-
        How a rule's value is written down. A `PERCENTAGE` is expressed in
        percent — `1.7` reads 1.7 % — so no consumer ever multiplies a rate to
        display it.
      type: string
      enum:
        - AMOUNT
        - PERCENTAGE
        - TEXT
    ProductNature:
      description: >-
        Which side of the balance sheet a model sits on, derived from its
        family. Net worth adds one and subtracts the other, so the side is
        stated rather than guessed from a name.
      type: string
      enum:
        - ASSET
        - LIABILITY
    ProductModelOrigin:
      description: >-
        Where a workspace product model came from. A model copied from the
        catalogue can be held against the publication it was copied from; one
        typed by hand answers only for itself. A duplicate stops following its
        source the moment it is created.
      type: string
      enum:
        - DECLARED
        - SYSTEM_PRODUCT
        - WORKSPACE_MODEL
    ProductModelPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductModel'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ProductModel:
      description: >-
        A product model owned by one workspace, beside the read-only system
        catalogue. It carries its own dated rule periods and never a single
        current figure, so last year's statement resolves against last year's
        rate. It is only ever added to: there is no field edit and no period
        deletion.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - family
        - nature
        - wrapperKind
        - yieldKind
        - yieldGuaranteed
        - ceilingBasis
        - defaultGroupCode
        - valuationMode
        - capabilities
        - origin
        - basedOnProductCode
        - basedOnModelId
        - rules
        - editable
        - version
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        family:
          $ref: '#/components/schemas/AccountKind'
        nature:
          description: Stated by the server so no interface deduces it from a family name.
          $ref: '#/components/schemas/ProductNature'
        wrapperKind:
          $ref: '#/components/schemas/ProductWrapperKind'
        yieldKind:
          $ref: '#/components/schemas/ProductYieldKind'
        yieldGuaranteed:
          description: >-
            Whether a rate the model carries is owed to the holder. False for a
            revisable or market-driven yield, so no interface shows a rate as an
            acquired return.
          type: boolean
        ceilingBasis:
          $ref: '#/components/schemas/CeilingBasis'
        defaultGroupCode:
          oneOf:
            - type: string
              maxLength: 32
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        capabilities:
          description: >-
            The public activation contract. Clients never infer behaviour from
            a model name the holder chose.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductCapability'
        origin:
          $ref: '#/components/schemas/ProductModelOrigin'
        basedOnProductCode:
          description: >-
            The catalogue product this model was started from, kept for reading
            and never for resolving. Null unless `origin` is `SYSTEM_PRODUCT`.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        basedOnModelId:
          description: >-
            The model this one was duplicated from. Null unless `origin` is
            `WORKSPACE_MODEL`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        rules:
          description: >-
            Every dated period the model ever recorded, ordered by kind then by
            start date. Periods of the same kind never overlap.
          type: array
          items:
            $ref: '#/components/schemas/ProductModelRule'
        editable:
          description: False for an archived model, which is read-only.
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ProductModelRule:
      description: >-
        One dated period of a model. Exactly one value shape is set, decided by
        the rule kind: an `amount` for a ceiling, a bracket scale for a rate, a
        `text` token for a method or a term. A null `validTo` is in force with
        no known end and is never rendered as an expiry or a zero.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - valueType
        - amount
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            The slices a rate scale is made of, in order; empty for a ceiling or
            a term. They tile `[0, +∞[`: the first starts at zero, each starts
            where the previous ended, and the last runs without limit.
          type: array
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          type: string
          format: date
        validTo:
          oneOf:
            - type: string
              format: date
            - type: 'null'
    ProductModelRuleInput:
      description: >-
        One dated period as a client submits it. The body carries exactly these
        fields; the parser decides which value shape the kind requires and
        refuses the others. Decimals travel as canonical strings — a rate sent
        as a JSON number is refused rather than rounded.
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - amountAssetCode
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        amount:
          description: A ceiling amount as a canonical decimal string, or null for a non-ceiling kind.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        amountAssetCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]{1,11}$'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            One or more brackets for a rate kind, empty otherwise. A single rate
            is the one-bracket case running from zero without limit.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          type: string
          format: date
        validTo:
          oneOf:
            - type: string
              format: date
            - type: 'null'
