    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - assetCode
        - kind
        - productCode
        - productModelId
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - status
        - netWorthSign
        - used
        - editable
        - kindEditable
        - kindEditReason
        - version
        - archivedAt
        - primaryGroupId
        - tagGroupIds
        - share
        - valuation
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 80
        assetCode:
          description: >-
            The unit the account is denominated in, from the read-only system
            asset reference. It is fixed at creation: changing it would
            reinterpret every figure already recorded against the account.
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            The catalogue product this account was created from, or null for an
            account described by hand or from a workspace model. Only the
            reference is stored: ceilings, rates and methods stay in the
            catalogue and are read on the business date they are needed, so a
            regulatory revision is never frozen into an account.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            The reusable workspace product model this account was created
            from, or null for an account described by hand or from a
            catalogue product. An account carries at most one of `productCode`
            and `productModelId`. Only the reference is stored: any dated rule
            the model carries stays on the model and is read on the business
            date it is needed, so archiving the model never changes what an
            existing account resolves.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        institution:
          description: >-
            Free text naming where the account is held, such as the bank or the
            insurer. No reference of institutions ships with the application, so
            this is bounded rather than validated against a list.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          description: >-
            The visible tail of a banking or contract identifier, such as
            `4821`. Bounded to eight characters, which cannot hold a full
            identifier.
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          description: Only an account counted in net worth may back the emergency fund.
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          description: The day the account was closed, or null while it is open.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        status:
          $ref: '#/components/schemas/AccountStatus'
        netWorthSign:
          description: >-
            The sign this account contributes to net worth: `1` for an asset,
            `-1` for a liability. It carries no amount; a balance arrives with
            its own record and stays null until then. The sign is independent of
            `includeInNetWorth`: an excluded account still reports its nature, so
            an aggregation must read the inclusion flag before applying the sign.
          type: integer
          enum:
            - -1
            - 1
        used:
          type: boolean
        editable:
          description: False for an archived account, which is read-only.
          type: boolean
        kindEditable:
          description: Backend-owned eligibility for changing the account kind.
          type: boolean
        kindEditReason:
          description: Why the kind is immutable, or null when it can be changed.
          oneOf:
            - type: string
              enum:
                - ARCHIVED
                - USED
            - type: 'null'
        version:
          type: integer
          minimum: 1
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        primaryGroupId:
          description: >-
            Exclusive membership used by group weights. Null until the account
            is assigned. A tag is never this field.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tagGroupIds:
          description: >-
            Extra group labels that never enter an exclusive denominator.
            Each identifier is unique and distinct from `primaryGroupId`.
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
        share:
          $ref: '#/components/schemas/NetWorthShare'
        valuation:
          $ref: '#/components/schemas/AccountValuation'
    AccountValuation:
      type: object
      additionalProperties: false
      required:
        - accountId
        - requestedOn
        - asOf
        - amount
        - display
        - belowDisplayStep
        - source
        - ageDays
        - quality
        - reconciliationStatus
        - snapshotId
        - version
      properties:
        accountId:
          type: string
          format: uuid
        requestedOn:
          type: string
          format: date
        asOf:
          description: Date of the snapshot that answers, or null when missing.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        amount:
          description: Exact source figure. Null when no snapshot answers.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        display:
          description: >-
            Source figure rounded at the asset display boundary. Null when
            missing or when a non-zero source would display as zero.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        belowDisplayStep:
          type: boolean
        source:
          oneOf:
            - $ref: '#/components/schemas/BalanceSnapshotSource'
            - type: 'null'
        ageDays:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        quality:
          $ref: '#/components/schemas/ValuationQuality'
        reconciliationStatus:
          oneOf:
            - $ref: '#/components/schemas/ReconciliationStatus'
            - type: 'null'
        snapshotId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        version:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
    ValuationQuality:
      type: string
      enum:
        - CURRENT
        - STALE
        - MISSING
    BalanceSnapshotSource:
      type: string
      enum:
        - MANUAL
        - IMPORT
        - BANK_API
        - CALCULATED
    ReconciliationStatus:
      type: string
      enum:
        - UNRECONCILED
        - RECONCILED
    AccountBalanceSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - asOf
        - amount
        - source
        - reconciliationStatus
        - comment
        - active
        - version
        - recordedAt
        - supersededAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        source:
          $ref: '#/components/schemas/BalanceSnapshotSource'
        reconciliationStatus:
          $ref: '#/components/schemas/ReconciliationStatus'
        comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        recordedAt:
          type: string
          format: date-time
        supersededAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    AccountBalanceSnapshotPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalanceSnapshot'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    RecordAccountBalanceRequest:
      type: object
      additionalProperties: false
      required:
        - asOf
        - amount
        - amountAssetCode
        - comment
        - version
      properties:
        asOf:
          type: string
          format: date
        amount:
          type: string
          pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        amountAssetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
        version:
          description: Required when replacing the active snapshot of that day and source.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - assetCode
        - kind
        - productCode
        - productModelId
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - primaryGroupId
        - tagGroupIds
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          description: >-
            Must equal the `accountKind` or `family` the referenced product or
            model declares. That reference is the authority, so a tampered
            form cannot file a PEA as a plain savings account.
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            A catalogue product to create the account from, or null for an
            account described by hand or from a workspace model. Mutually
            exclusive with `productModelId`. An unknown product is refused by
            the use case and by a foreign key.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            A reusable workspace product model to create the account from, or
            null for an account described by hand or from a catalogue product.
            Mutually exclusive with `productCode`. The model must belong to
            the calling workspace; an unknown or foreign identifier is
            refused by the use case and by a foreign key. An archived model
            is refused by the use case only: the foreign key still accepts
            it, so an account already created from that model keeps resolving.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        primaryGroupId:
          description: >-
            Optional exclusive membership used by group weights. Null leaves
            the account ungrouped. A tag is never this field.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tagGroupIds:
          description: >-
            Extra group labels that never enter an exclusive denominator.
            Each identifier is unique and distinct from `primaryGroupId`.
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - kind
        - productCode
        - productModelId
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - version
        - primaryGroupId
        - tagGroupIds
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            Changing the product, the kind or the valuation mode sends the whole
            triple back through the catalogue. An account already used by
            history cannot change product at all. Mutually exclusive with
            `productModelId`.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            Changing the model, the kind or the valuation mode sends the whole
            triple back through the workspace's own models. An account
            already used by history cannot change model at all. Mutually
            exclusive with `productCode`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          description: A day on or after the opening date closes the account; null reopens it.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        version:
          type: integer
          minimum: 1
        primaryGroupId:
          description: >-
            Exclusive membership used by group weights, or null to leave the
            account ungrouped. An unknown or foreign group is refused.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tagGroupIds:
          description: Extra group labels that never enter an exclusive denominator.
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
    ArchiveAccountRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    AccountKind:
      description: >-
        What an account holds. Shared by the product catalogue and the accounts
        of a workspace, so a product-based account inherits exactly one of these
        kinds.
      type: string
      enum:
        - CURRENT
        - SAVINGS
        - PORTFOLIO
        - INSURANCE_CONTRACT
        - EMPLOYEE_BENEFIT
        - CASH
        - REAL_ASSET
        - LIABILITY
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
        - ARCHIVED
    AccountValuationMode:
      description: >-
        Where the value of the account comes from: recorded movements, dated
        valuations entered by hand, or portfolio positions. Only an account
        kind that holds positions accepts `PORTFOLIO`.
      type: string
      enum:
        - TRANSACTIONS
        - SNAPSHOTS
        - PORTFOLIO
    LiquidityLevel:
      type: string
      enum:
        - IMMEDIATE
        - SHORT_TERM
        - MEDIUM_TERM
        - LONG_TERM
        - ILLIQUID
    AccountRules:
      description: >-
        Everything in force for one account on one business date, split into
        the three questions that are answered differently: what caps it, what
        it earns, and under which terms.

        Each entry shows the same rule through every authority that states it,
        so a published figure and one the holder typed are never confused for
        one another.
      type: object
      additionalProperties: false
      required:
        - accountId
        - assetCode
        - productCode
        - productModelId
        - origin
        - asOf
        - ceilings
        - rates
        - terms
        - unavailableRuleKinds
        - yieldReading
      properties:
        accountId:
          type: string
          format: uuid
        assetCode:
          description: The unit the account is denominated in.
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        productCode:
          description: >-
            The system product behind these rules: the one the account
            references, or the one the workspace model it follows was copied
            from. Null when no catalogue product is in the chain at all.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            The workspace product model these rules were read from, or null
            unless `origin` is `WORKSPACE_MODEL`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        origin:
          $ref: '#/components/schemas/AccountRulesOrigin'
        asOf:
          description: >-
            The business date the rules were resolved on. Every value below
            answers for this date and for no other.
          type: string
          format: date
        ceilings:
          type: array
          items:
            $ref: '#/components/schemas/AccountCeilingRule'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/AccountRateRule'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AccountTermRule'
        unavailableRuleKinds:
          description: >-
            The rules this account is expected to carry and that no layer
            covers on this date. A gap is shown as unavailable and never as
            zero, which would read as "no ceiling" or "no interest" when the
            truth is that the value is unknown. A kind a local override answers
            for is not a gap. A catalogue figure for a kind the workspace
            model never carried is also a gap: the model stopped following
            the publication, and the catalogue layer is comparison only for
            kinds the model already states.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
        yieldReading:
          $ref: '#/components/schemas/AccountYieldReading'
    AccountYieldReading:
      description: >-
        The three readings a rate screen must keep apart: the contractual or
        regulated rate, an optional projection assumption, and observed
        performance. An assumption is never stored as a rate on a market
        product. Observed performance is not computed from a pair of
        valuations: inventing a return from two stocks would present a
        movement as a yield.
      type: object
      additionalProperties: false
      required:
        - contractual
        - assumption
        - assumptionReason
        - observed
        - observedReason
      properties:
        contractual:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - kind
                - guaranteed
              properties:
                kind:
                  $ref: '#/components/schemas/ProductRuleKind'
                guaranteed:
                  type: boolean
            - type: 'null'
        assumption:
          description: A projection rate is not recorded as a product rule.
          type: 'null'
        assumptionReason:
          type: string
          enum:
            - NOT_RECORDED
        observed:
          description: No return series is computed from account valuations.
          type: 'null'
        observedReason:
          type: string
          enum:
            - NO_RETURN_SERIES
    AccountRulesOrigin:
      description: >-
        Where the account reads the rules it inherits. An account that inherits
        no rule and an account whose rules could not be read are different
        answers, and neither of them means the account has no ceiling.
        `WORKSPACE_MODEL` rules carry no `verification` or `source`: nobody
        published them. Overrides are independent of this: an account keeps
        answering with the claims recorded against it whatever its origin.
      type: string
      enum:
        - NO_PRODUCT
        - SYSTEM_CATALOG
        - PRODUCT_WITHDRAWN
        - WORKSPACE_MODEL
    AccountRuleLayer:
      description: >-
        Which authority a resolved value came from. `CATALOG` is the system
        publication, `INHERITED` the workspace product model the account
        follows, `OVERRIDE` a value recorded against this account alone. A
        local claim wins over the model, which wins over the catalogue.
      type: string
      enum:
        - CATALOG
        - INHERITED
        - OVERRIDE
    AccountCeilingRule:
      description: >-
        One ceiling kind seen through every authority that states it, and which
        of them wins. At least one of `catalog`, `inherited` and `override` is
        present.
      type: object
      additionalProperties: false
      required:
        - kind
        - basis
        - countsCreditedInterest
        - spansSeveralAccounts
        - effectiveLayer
        - catalog
        - inherited
        - override
        - check
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        basis:
          $ref: '#/components/schemas/CeilingBasis'
        countsCreditedInterest:
          description: >-
            Whether interest credited by the institution counts towards the
            measure. When it does not, interest may carry the account past the
            amount without any rule being broken. It follows from the rule
            kind, so it is the same on every layer.
          type: boolean
        spansSeveralAccounts:
          description: >-
            Whether the ceiling is reached across the products sharing it, in
            which case reading this account alone cannot settle it.
          type: boolean
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
        check:
          $ref: '#/components/schemas/CeilingCheck'
    CeilingCheck:
      description: >-
        Comparison of a measured figure to the effective ceiling. EXCEEDED is
        a warning, never a refusal: a Livret Bleu, credited interest or an
        imported history may sit above the published amount. The scale, not
        this status, decides what the excess earns.
      type: object
      additionalProperties: false
      required:
        - status
        - warning
        - measured
        - excess
        - unsettledReason
      properties:
        status:
          type: string
          enum:
            - WITHIN
            - EXCEEDED
            - NOT_COMPARABLE
            - UNSETTLED
        warning:
          type: boolean
        measured:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        excess:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        unsettledReason:
          oneOf:
            - type: string
              enum:
                - MISSING_VALUATION
                - CONTRIBUTIONS_NOT_TRACKED
                - COMBINED_CEILING
            - type: 'null'
    AccountCeiling:
      description: One authority's ceiling for the account, with its provenance.
      type: object
      additionalProperties: false
      required:
        - measurable
        - amount
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        measurable:
          description: >-
            False when the ceiling is published in another unit than the
            account is denominated in. No conversion is applied and no verdict
            is produced; the ceiling is reported as not comparable. An override
            is always measurable: a local claim is recorded in the account's
            own unit.
          type: boolean
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    AccountRateRule:
      description: >-
        One rate kind seen through every authority that states it, and which of
        them wins. At least one of `catalog`, `inherited` and `override` is
        present.
      type: object
      additionalProperties: false
      required:
        - kind
        - effectiveLayer
        - catalog
        - inherited
        - override
        - applied
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
        applied:
          description: >-
            How the effective scale reads the latest recorded balance. Null
            when no valuation exists on the business date. A Livret Bleu
            above the Livret A figure shifts onto the next bracket; that is
            allowed, not a refusal.
          oneOf:
            - $ref: '#/components/schemas/AppliedRate'
            - type: 'null'
    AppliedRate:
      type: object
      additionalProperties: false
      required:
        - interest
        - effectivePercentage
        - reachedPercentage
        - reachedLowerBound
        - rateShiftsAboveFirstBracket
        - unsettledReason
      properties:
        interest:
          oneOf:
            - type: string
            - type: 'null'
        effectivePercentage:
          oneOf:
            - type: string
            - type: 'null'
        reachedPercentage:
          type: string
        reachedLowerBound:
          type: string
        rateShiftsAboveFirstBracket:
          type: boolean
        unsettledReason:
          oneOf:
            - type: string
              enum:
                - ZERO_BALANCE
                - NEGATIVE_BALANCE
            - type: 'null'
    AccountRate:
      description: >-
        One authority's rate for the account, always as a bracket scale. The
        products the catalogue ships today resolve to a single bracket running
        from zero without limit, so a tiered product arrives later as data
        rather than as a second way of reading a rate.
      type: object
      additionalProperties: false
      required:
        - guaranteed
        - application
        - brackets
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        guaranteed:
          description: >-
            Whether the rate is owed to the holder. A revisable rate is only
            the rate published today and is never an acquired return. A local
            claim is graded by the promise of the product behind it, never by
            its own say-so.
          type: boolean
        application:
          $ref: '#/components/schemas/RateApplication'
        brackets:
          description: >-
            The slices the scale is made of, in order. They tile the amounts
            they cover: the first starts at zero, each one starts where the
            previous ended, and the last runs without limit.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    RateApplication:
      description: >-
        How the brackets combine over an amount. `MARGINAL` remunerates each
        slice at the rate of the bracket covering it, while `FLAT_BY_BRACKET`
        applies the rate of the bracket reached to the whole amount. A scale of
        4 % up to 10 000 then 2 % above pays 500 on 15 000 under the first and
        300 under the second, so a scale is never read without its mode. A
        single-bracket scale gives the same result under both.
      type: string
      enum:
        - MARGINAL
        - FLAT_BY_BRACKET
    RateBracket:
      description: >-
        One slice of a rate scale. The lower bound is included and the upper
        bound excluded, so two adjacent brackets leave no amount uncovered and
        count none twice.
      type: object
      additionalProperties: false
      required:
        - percentage
        - lowerBound
        - upperBound
      properties:
        percentage:
          description: >-
            The rate expressed in percent as the source published it: `1.7`
            reads 1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '1.7'
        lowerBound:
          description: First amount the bracket covers, included.
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '0'
        upperBound:
          description: >-
            First amount the bracket no longer covers, or null when the slice
            runs without limit.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
    AccountTermRule:
      description: >-
        One term kind — how interest accrues, who is eligible, which tax regime
        applies — seen through every authority that states it. At least one of
        `catalog`, `inherited` and `override` is present.
      type: object
      additionalProperties: false
      required:
        - kind
        - effectiveLayer
        - catalog
        - inherited
        - override
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
    AccountTerm:
      description: >-
        One authority's rule for the account that states neither a ceiling nor
        a rate.
      type: object
      additionalProperties: false
      required:
        - token
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        token:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the publication it was read from and
            to the translation catalogue.
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - NO_REGULATORY_CONTRIBUTION_CEILING
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    DeclaredOrVerified:
      description: >-
        Null for a value nobody published — one read from a workspace product
        model, and one claimed by an account override. Grading the freshness of
        a figure the holder typed would fabricate a provenance it never had.
      oneOf:
        - $ref: '#/components/schemas/RuleVerification'
        - type: 'null'
    DeclaredOrSourced:
      description: >-
        Null for a value nobody published — one read from a workspace product
        model, and one claimed by an account override. There is no publication
        to name.
      oneOf:
        - $ref: '#/components/schemas/ProductRuleSource'
        - type: 'null'
    AccountRuleClaimOrNull:
      description: >-
        Who claimed this value and why, or null when nobody claimed it and it
        was inherited or published.
      oneOf:
        - $ref: '#/components/schemas/AccountRuleClaim'
        - type: 'null'
    AccountRuleClaim:
      description: >-
        The local claim behind an override, without repeating the value the
        rule already carries.
      type: object
      additionalProperties: false
      required:
        - overrideId
        - reason
        - authorId
        - authorDisplayName
        - recordedAt
      properties:
        overrideId:
          type: string
          format: uuid
        reason:
          description: >-
            Why this account diverges from what it inherits, in the holder's
            own words. It is required: an unexplained local figure sitting
            beside a published one is exactly the drift an override has to make
            visible instead of hiding.
          type: string
          minLength: 1
          maxLength: 200
        authorId:
          description: Who recorded the claim. It comes from the session, never from a request body.
          type: string
          format: uuid
        authorDisplayName:
          description: The author's display name, or null when the account no longer exists.
          oneOf:
            - type: string
            - type: 'null'
        recordedAt:
          type: string
          format: date-time
    AccountRuleOverridePage:
      type: object
      additionalProperties: false
      required:
        - overrides
      properties:
        overrides:
          description: >-
            Every override ever recorded on the account, withdrawn ones
            included, ordered by rule kind then by the day each period starts.
          type: array
          items:
            $ref: '#/components/schemas/AccountRuleOverride'
    AccountRuleOverride:
      description: >-
        One dated rule value recorded against a single account, in front of
        whatever that account inherits.
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - kind
        - valueType
        - amount
        - text
        - application
        - brackets
        - validFrom
        - validTo
        - standing
        - withdrawnAt
        - withdrawnBy
        - reason
        - authorId
        - authorDisplayName
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          description: >-
            Which of `amount`, `text` and `brackets` carries the value. It
            follows from the rule kind, so a client reads the one its kind
            declares instead of guessing.
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        application:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RateBracket'
            - type: 'null'
        validFrom:
          description: First day the claim applies.
          type: string
          format: date
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        standing:
          description: >-
            False once the override has been withdrawn. A withdrawn claim stops
            answering on every date, past ones included, and the inherited rule
            of each of those dates takes over again. It is kept here because
            the trail of what was claimed is the provenance an override exists
            to preserve.
          type: boolean
        withdrawnAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        withdrawnBy:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 200
        authorId:
          type: string
          format: uuid
        authorDisplayName:
          description: The author's display name, or null when the account no longer exists.
          oneOf:
            - type: string
            - type: 'null'
        recordedAt:
          type: string
          format: date-time
    RecordAccountRuleOverrideRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - amountAssetCode
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
        - reason
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        amount:
          description: >-
            The ceiling amount as a canonical decimal string, for a kind whose
            value is an amount, and null otherwise. It never travels as a JSON
            number, which a binary float would already have rounded.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        amountAssetCode:
          description: >-
            The unit the amount is denominated in. It must be the unit the
            account itself is held in: a local ceiling is checked against this
            account and nothing else, and no conversion ships with the
            application.
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]{1,11}$'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
              maxLength: 64
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            The slices of a rate scale, for a rate kind, and an empty list
            otherwise. A single rate is the one-bracket case of the same shape.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          description: First day the claim applies.
          type: string
          format: date
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        reason:
          description: Why this account diverges from what it inherits.
          type: string
          minLength: 1
          maxLength: 200
    EmptyRequest:
      description: >-
        A body carrying no field. It is still required and still narrowed, so a
        replayed form cannot smuggle one in and a client cannot believe a
        payload it sent was applied.
      type: object
      additionalProperties: false
    RuleValidFrom:
      description: First day this catalogue vouches for the value.
      type: string
      format: date
    RuleValidTo:
      description: >-
        Last day covered, inclusive, or null while no revision has closed the
        period. An open end is in force for every later business date; it is
        never an expiry.
      oneOf:
        - type: string
          format: date
        - type: 'null'
    RuleVerification:
      description: >-
        How much the value can be trusted today, independently of the business
        date it applies to. `STALE` means nobody has re-read the source across
        a full revision cycle.
      type: string
      enum:
        - VERIFIED
        - STALE
        - UNVERIFIED
    CategoryType:
      type: string
      enum:
        - EXPENSE
        - INCOME
    AnalyticAxes:
      type: array
      uniqueItems: true
      maxItems: 6
      items:
        type: string
        enum:
          - DISCRETIONARY
          - ESSENTIAL
          - FIXED
          - PERSONAL
          - PROFESSIONAL
          - VARIABLE
    MonthlyProjectionReason:
      description: Why a monthly figure is not calculable. A reason replaces the value.
      type: string
      enum:
        - MIXED_ASSETS
        - NO_ACCOUNT
        - ZERO_CASH_INCOME
        - MISSING_BENEFIT_SOURCE
        - MISSING_VALUATION
        - NO_ELIGIBLE_ACCOUNT
    MonthlyProjectionMetric:
      type: object
      additionalProperties: false
      required: [value, assetCode, reason]
      properties:
        value:
          type: [string, 'null']
          pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        assetCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        reason:
          oneOf:
            - $ref: '#/components/schemas/MonthlyProjectionReason'
            - type: 'null'
    MonthlyKpiExplanation:
      type: object
      additionalProperties: false
      required:
        - kpi
        - value
        - assetCode
        - reason
        - reasonExplanation
        - formula
        - scope
        - period
        - sourceTransactionIds
        - sourceTransactions
        - sourceAccountIds
        - freshness
        - quality
        - pendingCount
      properties:
        kpi:
          type: string
          enum:
            [
              cashIncome,
              nonCashBenefits,
              budgetExpenses,
              uncategorizedExpenses,
              budgetSurplus,
              savingsTransfers,
              cashSavingsRate,
              beginningNetWorth,
              endNetWorth,
              netWorthDelta,
              budgetComparison,
            ]
        value:
          type: [string, 'null']
          pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        assetCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        reason:
          type: [string, 'null']
          enum:
            [
              MIXED_ASSETS,
              NO_ACCOUNT,
              ZERO_CASH_INCOME,
              MISSING_BENEFIT_SOURCE,
              MISSING_VALUATION,
              NO_ELIGIBLE_ACCOUNT,
              MISSING_TARGET,
              null,
            ]
        reasonExplanation:
          type: [string, 'null']
          minLength: 1
        formula:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        period:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        sourceTransactionIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        sourceTransactions:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/MonthlyKpiSourceTransaction'
        sourceAccountIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        freshness:
          type: string
          enum: [COMPLETE, EMPTY, PENDING, CURRENT]
        quality:
          type: string
          enum: [CURRENT, STALE, MISSING, WITHIN_TARGET, ON_TARGET, OVER_TARGET, NON_CALCULABLE]
        pendingCount:
          type: integer
          minimum: 0
          maximum: 500
    MonthlyKpiSourceTransaction:
      type: object
      additionalProperties: false
      required: [id, bookedOn, label, amount, state]
      properties:
        id: { type: string, format: uuid }
        bookedOn: { type: string, format: date }
        label:
          type: string
          minLength: 1
          maxLength: 140
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        state:
          type: string
          enum: [PENDING, BOOKED, VOIDED, REJECTED]
    MonthlyAccountValue:
      type: object
      additionalProperties: false
      required: [value, assetCode, quality, ageDays, valuedOn]
      properties:
        value:
          type: [string, 'null']
          pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        assetCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        quality:
          $ref: '#/components/schemas/ValuationQuality'
        ageDays:
          type: [integer, 'null']
          minimum: 0
        valuedOn:
          type: [string, 'null']
          format: date
    MonthlyProjectionAccount:
      type: object
      additionalProperties: false
      required: [id, label, assetCode, kind, beginningValue, endValue, reconciliationStatus]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          $ref: '#/components/schemas/AccountKind'
        beginningValue:
          $ref: '#/components/schemas/MonthlyAccountValue'
        endValue:
          $ref: '#/components/schemas/MonthlyAccountValue'
        reconciliationStatus:
          type: string
          enum: [RECONCILED, UNRECONCILED]
    MonthlyProjection:
      type: object
      additionalProperties: false
      required:
        - month
        - periodStart
        - periodEnd
        - state
        - quality
        - pendingCount
        - cashIncome
        - nonCashBenefits
        - budgetExpenses
        - uncategorizedExpenses
        - budgetSurplus
        - savingsTransfers
        - cashSavingsRate
        - beginningNetWorth
        - endNetWorth
        - netWorthDelta
        - beginningNetWorthState
        - accounts
        - reconciliationStatus
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        state:
          type: string
          enum: [COMPLETE, EMPTY, PENDING]
        quality:
          $ref: '#/components/schemas/ValuationQuality'
        pendingCount:
          type: integer
          minimum: 0
        cashIncome:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        nonCashBenefits:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        budgetExpenses:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        uncategorizedExpenses:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        budgetSurplus:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        savingsTransfers:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        cashSavingsRate:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        beginningNetWorth:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        endNetWorth:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        netWorthDelta:
          $ref: '#/components/schemas/MonthlyProjectionMetric'
        beginningNetWorthState:
          type: string
          enum: [POSITIVE, ZERO, NEGATIVE, NON_CALCULABLE]
        accounts:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/MonthlyProjectionAccount'
        reconciliationStatus:
          type: string
          enum: [RECONCILED, UNRECONCILED, NO_ACCOUNTS]
    NetWorthReason:
      description: >-
        Why a net-worth figure, a delta or a change rate could not be produced.
        A reason replaces the figure and never accompanies one.
      type: string
      enum:
        - MISSING_VALUATION
        - NO_ELIGIBLE_ACCOUNT
        - MIXED_ASSETS
        - ZERO_BASE
        - NEGATIVE_BASE
    NetWorthAmount:
      description: >-
        One published figure: the exact source decimal with its asset, and the
        same figure rounded at the asset display boundary. A non-zero source
        that would display as zero is reported as below the step instead of
        becoming an invented nil.
      type: object
      additionalProperties: false
      required:
        - value
        - assetCode
        - display
        - belowDisplayStep
      properties:
        value:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        display:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        belowDisplayStep:
          type: boolean
    NetWorthDelta:
      description: >-
        How net worth moved between two business days. The amount and the rate
        carry their own reason, because they fail for different causes.
      type: object
      additionalProperties: false
      required:
        - comparedOn
        - previousTotal
        - previousReason
        - amount
        - amountReason
        - rate
        - ratePercent
        - ratePercentDisplay
        - rateReason
      properties:
        comparedOn:
          type: string
          format: date
        previousTotal:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        previousReason:
          oneOf:
            - $ref: '#/components/schemas/NetWorthReason'
            - type: 'null'
        amount:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        amountReason:
          oneOf:
            - $ref: '#/components/schemas/NetWorthReason'
            - type: 'null'
        rate:
          description: Signed ratio as a canonical decimal string, never a percentage.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        ratePercent:
          description: >-
            The same ratio expressed in percent by the backend, so no interface
            multiplies a decimal itself.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        ratePercentDisplay:
          description: >-
            The percent rounded at the presentation boundary, two decimals,
            HALF_UP. A change rate is almost never a terminating decimal, so
            the exact figure above stays available while this is what a screen
            shows; the interface rounds nothing itself.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        rateReason:
          oneOf:
            - $ref: '#/components/schemas/NetWorthReason'
            - type: 'null'
    NetWorthContribution:
      description: >-
        One contributing account. `amount` is the stored figure as it appears
        on a statement; `signedAmount` is what it adds to net worth.
      type: object
      additionalProperties: false
      required:
        - accountId
        - label
        - kind
        - netWorthSign
        - primaryGroupId
        - primaryGroupLabel
        - eligible
        - amount
        - signedAmount
        - quality
        - ageDays
        - valuedOn
        - share
      properties:
        accountId:
          type: string
          format: uuid
        label:
          type: string
        kind:
          $ref: '#/components/schemas/AccountKind'
        netWorthSign:
          type: integer
          enum:
            - -1
            - 1
        primaryGroupId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        primaryGroupLabel:
          oneOf:
            - type: string
            - type: 'null'
        eligible:
          description: Open on the requested day and included in net worth.
          type: boolean
        amount:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        signedAmount:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        quality:
          $ref: '#/components/schemas/ValuationQuality'
        ageDays:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        valuedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        share:
          $ref: '#/components/schemas/NetWorthShare'
    NetWorthAllocationEntry:
      description: >-
        The exclusive weight of one group: its own accounts and those of its
        descendants, counted once. A tag never enters this figure, so two
        groups of the same depth never claim the same account. They do not add
        up to the published total: an account with no primary group belongs to
        no bucket, and a group weighed against a small eligible base can exceed
        100 %.
      type: object
      additionalProperties: false
      required:
        - groupId
        - label
        - parentId
        - depth
        - value
        - share
      properties:
        groupId:
          type: string
          format: uuid
        label:
          type: string
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        depth:
          type: integer
          minimum: 1
          maximum: 8
        value:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        share:
          $ref: '#/components/schemas/NetWorthShare'
    NetWorth:
      type: object
      additionalProperties: false
      required:
        - asOf
        - total
        - reason
        - quality
        - stalestAgeDays
        - eligibleAccountCount
        - valuedAccountCount
        - missingValuationCount
        - staleValuationCount
        - delta
        - contributions
        - allocation
      properties:
        asOf:
          type: string
          format: date
        total:
          description: Null with a reason when the sum cannot be produced. Never `0`.
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/NetWorthReason'
            - type: 'null'
        quality:
          $ref: '#/components/schemas/ValuationQuality'
        stalestAgeDays:
          description: Age in days of the oldest valuation behind the figure.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        eligibleAccountCount:
          type: integer
          minimum: 0
        valuedAccountCount:
          type: integer
          minimum: 0
        missingValuationCount:
          type: integer
          minimum: 0
        staleValuationCount:
          type: integer
          minimum: 0
        delta:
          $ref: '#/components/schemas/NetWorthDelta'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/NetWorthContribution'
        allocation:
          type: array
          items:
            $ref: '#/components/schemas/NetWorthAllocationEntry'
    NetWorthPoint:
      type: object
      additionalProperties: false
      required:
        - on
        - total
        - reason
        - quality
      properties:
        on:
          type: string
          format: date
        total:
          oneOf:
            - $ref: '#/components/schemas/NetWorthAmount'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/NetWorthReason'
            - type: 'null'
        quality:
          $ref: '#/components/schemas/ValuationQuality'
    NetWorthHistory:
      type: object
      additionalProperties: false
      required:
        - asOf
        - granularity
        - points
      properties:
        asOf:
          type: string
          format: date
        granularity:
          type: string
          enum:
            - MONTH
        points:
          description: Oldest first. The last point is the requested day itself.
          type: array
          items:
            $ref: '#/components/schemas/NetWorthPoint'
    RecurrenceIntervalKind:
      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY]
    RecurrenceAmountLiteral:
      type: string
      pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      description: Exact canonical decimal transported as text; never a binary floating-point number.
    RecurrenceCandidate:
      type: object
      additionalProperties: false
      required:
        [
          fingerprint,
          accountId,
          counterparty,
          intervalKind,
          medianAmount,
          tolerance,
          occurrenceCount,
          firstSeenOn,
          lastSeenOn,
          confidence,
          confidenceReason,
        ]
      properties:
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        accountId: { type: string, format: uuid }
        counterparty: { type: string, minLength: 1, maxLength: 140 }
        intervalKind: { $ref: '#/components/schemas/RecurrenceIntervalKind' }
        medianAmount: { $ref: '#/components/schemas/DecimalAmount' }
        tolerance: { $ref: '#/components/schemas/DecimalAmount' }
        occurrenceCount: { type: integer, minimum: 3 }
        firstSeenOn: { type: string, format: date }
        lastSeenOn: { type: string, format: date }
        confidence:
          oneOf:
            - { type: string, enum: [HIGH, MEDIUM, LOW] }
            - { type: 'null' }
        confidenceReason:
          description: Present when qualitative confidence cannot be determined; never replaced with zero.
          oneOf:
            - { type: string, enum: [UNCLASSIFIED_GAP_SPREAD] }
            - { type: 'null' }
    RecurrenceCandidatePage:
      type: object
      additionalProperties: false
      required: [items, partial]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecurrenceCandidate' } }
        partial:
          type: boolean
          description: True when the detection stopped at its 5000-row bound.
    DismissRecurrenceCandidateRequest:
      type: object
      additionalProperties: false
      required: [fingerprint]
      properties:
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    CreateRecurrenceRequest:
      type: object
      additionalProperties: false
      required:
        [
          accountId,
          label,
          counterparty,
          expectedAmount,
          amountTolerance,
          intervalKind,
          dayOfPeriod,
          firstExpectedOn,
        ]
      properties:
        accountId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        counterparty:
          oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }]
        expectedAmount: { $ref: '#/components/schemas/RecurrenceAmountLiteral' }
        amountTolerance:
          allOf: [{ $ref: '#/components/schemas/RecurrenceAmountLiteral' }]
          description: Exact non-negative tolerance in the account asset.
        intervalKind: { $ref: '#/components/schemas/RecurrenceIntervalKind' }
        dayOfPeriod: { type: integer, minimum: 1, maximum: 31 }
        firstExpectedOn: { type: string, format: date }
    UpdateRecurrenceRequest:
      type: object
      additionalProperties: false
      required:
        [label, counterparty, expectedAmount, amountTolerance, intervalKind, dayOfPeriod, version]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        counterparty:
          oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }]
        expectedAmount: { $ref: '#/components/schemas/RecurrenceAmountLiteral' }
        amountTolerance:
          allOf: [{ $ref: '#/components/schemas/RecurrenceAmountLiteral' }]
          description: Exact non-negative tolerance in the recurrence asset.
        intervalKind: { $ref: '#/components/schemas/RecurrenceIntervalKind' }
        dayOfPeriod: { type: integer, minimum: 1, maximum: 31 }
        version: { type: integer, minimum: 1 }
    Recurrence:
      description: A forecast schedule. Its expected occurrences are not booked transactions or included in totals.
      type: object
      additionalProperties: false
      required:
        [
          id,
          accountId,
          label,
          counterparty,
          expectedAmount,
          amountTolerance,
          intervalKind,
          dayOfPeriod,
          nextExpectedOn,
          confirmedAt,
          version,
          createdAt,
          updatedAt,
          archivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        counterparty:
          oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }]
        expectedAmount: { $ref: '#/components/schemas/DecimalAmount' }
        amountTolerance: { $ref: '#/components/schemas/DecimalAmount' }
        intervalKind: { $ref: '#/components/schemas/RecurrenceIntervalKind' }
        dayOfPeriod: { type: integer, minimum: 1, maximum: 31 }
        nextExpectedOn: { type: string, format: date }
        confirmedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
    RecurrencePage:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Recurrence' } }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    RecurrenceOccurrence:
      description: A forecast snapshot; `LATE` is an effective read-time state and is never stored.
      type: object
      additionalProperties: false
      required:
        [
          id,
          recurrenceId,
          expectedOn,
          expectedAmount,
          amountTolerance,
          status,
          matchedTransactionId,
          matchedAt,
          periodClosed,
        ]
      properties:
        id: { type: string, format: uuid }
        recurrenceId: { type: string, format: uuid }
        expectedOn: { type: string, format: date }
        expectedAmount: { $ref: '#/components/schemas/DecimalAmount' }
        amountTolerance: { $ref: '#/components/schemas/DecimalAmount' }
        status: { type: string, enum: [EXPECTED, RECEIVED, LATE] }
        matchedTransactionId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        matchedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        periodClosed:
          description: >-
            The instalment falls in a closed month. It stays waiting: a
            recurrence never books into a closed period, and the movement that
            would settle it is refused like any other write.
          type: boolean
    RecurrenceOccurrencePage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          {
            type: array,
            maxItems: 1000,
            items: { $ref: '#/components/schemas/RecurrenceOccurrence' },
          }
        total: { type: integer, minimum: 0, maximum: 1000 }
    RecurrenceHorizonReport:
      type: object
      additionalProperties: false
      required: [recurrencesExamined, occurrencesGenerated, horizonEndsOn]
      properties:
        recurrencesExamined: { type: integer, minimum: 0, maximum: 1000 }
        occurrencesGenerated: { type: integer, minimum: 0 }
        horizonEndsOn: { type: string, format: date }
    TransactionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - hasMore
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          description: Cursor for the following page, or null on the last page.
          oneOf:
            - type: string
            - type: 'null'
        hasMore:
          type: boolean
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - amount
        - originalAmount
        - exchangeRate
        - nature
        - state
        - source
        - sourceRef
        - bookedOn
        - valueOn
        - authorizedOn
        - rawLabel
        - counterparty
        - note
        - paymentMethod
        - mcc
        - maskedCard
        - bankReference
        - splits
        - version
        - createdAt
        - updatedAt
        - voidedAt
        - transferId
        - refundOriginalId
        - refundOriginalLabel
        - refundedAmount
        - reviewReason
        - reconciliationCandidateIds
        - reconciledIntoId
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        originalAmount:
          description: Cross-asset figure carried beside the booked amount, or null.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        exchangeRate:
          oneOf:
            - type: string
              pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        nature:
          $ref: '#/components/schemas/TransactionNature'
        state:
          $ref: '#/components/schemas/TransactionState'
        source:
          $ref: '#/components/schemas/TransactionSource'
        sourceRef:
          description: >-
            The provider's own identifier for this movement, when it announced
            one. Unique per account where present.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
        bookedOn:
          type: string
          format: date
        valueOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        authorizedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        rawLabel:
          type: string
          minLength: 1
          maxLength: 140
          description: >-
            Original source wording. It can be corrected only for a manually entered
            transaction.
        counterparty:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        mcc:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        maskedCard:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        bankReference:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: 'null'
        splits:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TransactionSplit'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        voidedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        transferId:
          description: >-
            Read-only. Set when this transaction is a transfer leg or its
            fee; editing or voiding it then requires the transfer's own
            endpoint instead of this one.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        refundOriginalId:
          description: Read-only original transaction when this row is a linked refund.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        refundOriginalLabel:
          description: Read-only original label when this row is a linked refund.
          oneOf:
            - type: string
            - type: 'null'
        refundedAmount:
          description: Read-only sum of live linked refunds when this row is an original.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        reviewReason:
          description: >-
            Read-only. Why this pending movement waits for a human before it
            can be booked. A row carrying one is excluded from every aggregate
            until `POST /transactions/{id}/reconcile` resolves it.
          oneOf:
            - $ref: '#/components/schemas/TransactionReviewReason'
            - type: 'null'
        reconciliationCandidateIds:
          description: >-
            Read-only. The pending rows the matching rule could not choose
            between, as a suggestion for the reviewer; the resolution accepts
            any pending row of the account. No score is attached: the rule is
            deterministic, and a tie is resolved by a human, not by a
            threshold. Empty when nothing was close enough to suggest.
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        reconciledIntoId:
          description: >-
            Read-only. Set on a voided reviewed movement: the transaction a
            human confirmed it settles.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    TransactionReviewReason:
      type: string
      enum:
        - AMBIGUOUS_MATCH
        - NO_MATCH
    RefundableTransaction:
      type: object
      additionalProperties: false
      required: [originalId, originalAmount, refunded, refundable, proposedSplits]
      properties:
        originalId: { type: string, format: uuid }
        originalAmount: { $ref: '#/components/schemas/DecimalAmount' }
        refunded: { $ref: '#/components/schemas/DecimalAmount' }
        refundable: { $ref: '#/components/schemas/DecimalAmount' }
        proposedSplits:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [categoryId, amount]
            properties:
              categoryId: { type: string, format: uuid }
              amount: { $ref: '#/components/schemas/DecimalAmount' }
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [accountId, amount, bookedOn, rawLabel, counterparty, note]
      properties:
        accountId: { type: string, format: uuid }
        amount:
          description: Positive magnitude; the stored REFUND transaction reduces the linked expense.
          $ref: '#/components/schemas/DecimalAmount'
        bookedOn: { type: string, format: date }
        rawLabel: { type: string, minLength: 1, maxLength: 140 }
        counterparty:
          oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }]
        note:
          oneOf: [{ type: string, minLength: 1, maxLength: 500 }, { type: 'null' }]
        splits:
          description: Null accepts the exact server proposal; a list overrides it but must sum exactly.
          oneOf:
            - type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/TransactionSplitInput' }
            - type: 'null'
    RefundConflictProblem:
      description: >-
        Raised by the refund creation endpoint when the original is already
        fully refunded (`type: /problems/refund.already_settled`) or the
        requested amount exceeds what remains
        (`type: /problems/refund.exceeds_refundable`).
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - remaining
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        remaining:
          description: What remains refundable on the original, before this request.
          $ref: '#/components/schemas/DecimalAmount'
    RuleTextPredicate:
      type: object
      additionalProperties: false
      required: [source, operator, value, negated]
      properties:
        source: { type: string, enum: [RAW_LABEL, NORMALIZED_LABEL, COUNTERPARTY] }
        operator: { type: string, enum: [EQUALS, CONTAINS, REGEX] }
        value: { type: string, minLength: 1, maxLength: 120 }
        negated:
          type: boolean
          description: Inverts this predicate result before the group combinator is applied.
    RuleTextConditionGroup:
      description: >-
        Repeated text predicates combined globally. AND requires every predicate result; OR requires
        at least one. A positive counterparty predicate is false when the counterparty is absent,
        before optional predicate negation.
      type: object
      additionalProperties: false
      required: [combinator, predicates]
      properties:
        combinator: { type: string, enum: [AND, OR] }
        predicates:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/RuleTextPredicate' }
    RuleAmountCondition:
      type: object
      additionalProperties: false
      required: [min, max, assetCode]
      properties:
        min:
          oneOf:
            - { type: string, pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
            - { type: 'null' }
        max:
          oneOf:
            - { type: string, pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
            - { type: 'null' }
        assetCode: { type: string, pattern: '^[A-Z][A-Z0-9]{1,11}$' }
    CategorizationRuleConditions:
      description: MCC, amount and direction each combine conjunctively with the complete text group.
      type: object
      additionalProperties: false
      properties:
        text: { oneOf: [{ $ref: '#/components/schemas/RuleTextConditionGroup' }, { type: 'null' }] }
        mcc: { oneOf: [{ type: string, pattern: '^[0-9]{4}$' }, { type: 'null' }] }
        amount: { oneOf: [{ $ref: '#/components/schemas/RuleAmountCondition' }, { type: 'null' }] }
        direction: { oneOf: [{ type: string, enum: [IN, OUT] }, { type: 'null' }] }
      minProperties: 1
    CreateCategorizationRuleRequest:
      type: object
      additionalProperties: false
      required:
        [
          label,
          priority,
          accountScope,
          conditions,
          targetCategoryId,
          targetAxes,
          targetCounterparty,
          effectiveFrom,
          effectiveTo,
        ]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 1, maximum: 999 }
        accountScope:
          { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        conditions: { $ref: '#/components/schemas/CategorizationRuleConditions' }
        targetCategoryId: { type: string, format: uuid }
        targetAxes: { $ref: '#/components/schemas/AnalyticAxes' }
        targetCounterparty:
          { oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
    UpdateCategorizationRuleRequest:
      type: object
      additionalProperties: false
      required:
        [
          label,
          priority,
          accountScope,
          conditions,
          targetCategoryId,
          targetAxes,
          targetCounterparty,
          effectiveFrom,
          effectiveTo,
          active,
          version,
        ]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 1, maximum: 999 }
        accountScope:
          { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        conditions: { $ref: '#/components/schemas/CategorizationRuleConditions' }
        targetCategoryId: { type: string, format: uuid }
        targetAxes: { $ref: '#/components/schemas/AnalyticAxes' }
        targetCounterparty:
          { oneOf: [{ type: string, minLength: 1, maxLength: 80 }, { type: 'null' }] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    CategorizationRule:
      type: object
      additionalProperties: false
      required:
        [
          id,
          label,
          priority,
          accountScope,
          conditions,
          targetCategoryId,
          targetCategoryLabel,
          targetAxes,
          targetCounterparty,
          effectiveFrom,
          effectiveTo,
          active,
          deactivatedReason,
          appliedCount,
          version,
          createdAt,
          updatedAt,
          archivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 1, maximum: 999 }
        accountScope: { type: array, items: { type: string, format: uuid } }
        conditions: { $ref: '#/components/schemas/CategorizationRuleConditions' }
        targetCategoryId: { type: string, format: uuid }
        targetCategoryLabel: { type: string }
        targetAxes: { $ref: '#/components/schemas/AnalyticAxes' }
        targetCounterparty: { oneOf: [{ type: string }, { type: 'null' }] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        active: { type: boolean }
        deactivatedReason:
          {
            oneOf:
              [
                { type: string, enum: [USER, PATTERN_BUDGET_EXCEEDED, CATEGORY_ARCHIVED] },
                { type: 'null' },
              ],
          }
        appliedCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    CategorizationRulePage:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CategorizationRule' } }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    CategorizationPreviewRequest:
      type: object
      additionalProperties: false
      required: [ruleId, from, to]
      properties:
        ruleId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        from: { type: string, format: date }
        to: { type: string, format: date }
    CategorizationConflict:
      type: object
      additionalProperties: false
      required: [transactionId, ruleIds]
      properties:
        transactionId: { type: string, format: uuid }
        ruleIds: { type: array, minItems: 2, items: { type: string, format: uuid } }
    CategorizationSample:
      type: object
      additionalProperties: false
      required: [transactionId, bookedOn, currentCategoryId, targetCategoryId]
      properties:
        transactionId: { type: string, format: uuid }
        bookedOn: { type: string, format: date }
        currentCategoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        targetCategoryId: { type: string, format: uuid }
    CategorizationSkipped:
      type: object
      additionalProperties: false
      required: [transactionId, bookedOn, reason]
      properties:
        transactionId: { type: string, format: uuid }
        bookedOn: { type: string, format: date }
        reason: { type: string, const: MANUAL_CATEGORIZATION }
    CategorizationPreview:
      type: object
      additionalProperties: false
      required:
        [
          previewToken,
          matched,
          wouldChange,
          skippedManual,
          conflictCount,
          conflicts,
          conflictsTruncated,
          samples,
          skipped,
          deactivatedRuleIds,
        ]
      properties:
        previewToken: { type: string, pattern: '^[0-9a-f]{64}$' }
        matched: { type: integer, minimum: 0 }
        wouldChange: { type: integer, minimum: 0 }
        skippedManual: { type: integer, minimum: 0 }
        conflictCount: { type: integer, minimum: 0, maximum: 5000 }
        conflicts:
          {
            type: array,
            maxItems: 20,
            items: { $ref: '#/components/schemas/CategorizationConflict' },
          }
        conflictsTruncated: { type: boolean }
        samples:
          {
            type: array,
            maxItems: 20,
            items: { $ref: '#/components/schemas/CategorizationSample' },
          }
        skipped:
          {
            type: array,
            maxItems: 20,
            items: { $ref: '#/components/schemas/CategorizationSkipped' },
          }
        deactivatedRuleIds: { type: array, items: { type: string, format: uuid } }
    CategorizationApplyRequest:
      type: object
      additionalProperties: false
      required: [previewToken]
      properties:
        previewToken: { type: string, pattern: '^[0-9a-f]{64}$' }
    CategorizationApplyReport:
      type: object
      additionalProperties: false
      required: [changed, skippedManual, deactivatedRuleIds]
      properties:
        changed: { type: integer, minimum: 0 }
        skippedManual: { type: integer, minimum: 0 }
        deactivatedRuleIds: { type: array, items: { type: string, format: uuid } }
    TransactionSplit:
      type: object
      additionalProperties: false
      required:
        - id
        - categoryId
        - categoryLabel
        - categoryIcon
        - categoryColor
        - amount
        - analyticAxes
        - note
        - categorizationOrigin
        - categorizationRuleId
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryLabel:
          type: string
          minLength: 1
          maxLength: 80
        categoryIcon:
          description: >-
            Read-only display icon of the split category. Never accepted on write.
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            - type: 'null'
        categoryColor:
          description: >-
            Read-only display colour of the split category. Never accepted on write.
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        analyticAxes:
          $ref: '#/components/schemas/AnalyticAxes'
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 140
            - type: 'null'
        categorizationOrigin:
          type: string
          enum: [MANUAL, RULE]
        categorizationRuleId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    TransactionNature:
      type: string
      enum:
        - INCOME
        - EXPENSE
        - TRANSFER
        - REFUND
        - FEE
        - ADJUSTMENT
    StandaloneTransactionNature:
      type: string
      enum:
        - INCOME
        - EXPENSE
        - FEE
        - ADJUSTMENT
    TransactionState:
      type: string
      enum:
        - PENDING
        - BOOKED
        - VOIDED
        - REJECTED
    TransactionSource:
      type: string
      enum:
        - MANUAL
        - IMPORT
        - PROVIDER
    PaymentMethod:
      type: string
      enum:
        - CARD
        - TRANSFER
        - DIRECT_DEBIT
        - CHECK
        - CASH
        - OTHER
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - accountId
        - amount
        - nature
        - state
        - bookedOn
        - valueOn
        - authorizedOn
        - rawLabel
        - counterparty
        - note
        - paymentMethod
        - mcc
        - maskedCard
        - bankReference
        - categoryId
        - splits
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        nature:
          $ref: '#/components/schemas/StandaloneTransactionNature'
        state:
          type: string
          enum:
            - PENDING
            - BOOKED
        bookedOn:
          type: string
          format: date
        valueOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        authorizedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        rawLabel:
          type: string
          minLength: 1
          maxLength: 140
        counterparty:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        mcc:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        maskedCard:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        bankReference:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: 'null'
        categoryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        splits:
          description: >-
            An explicit multi-row allocation, replacing the categoryId
            shorthand. Null keeps the shorthand; an empty list is a
            deliberate, uncategorised transaction.
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/TransactionSplitInput'
            - type: 'null'
        source:
          description: IMPORT and PROVIDER requests require an Idempotency-Key header.
          type: string
          enum: [MANUAL, IMPORT, PROVIDER]
        sourceRef:
          description: >-
            The provider's own identifier for this movement. Optional; unique
            per account where present, and matched before any fuzzy rule.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
        reconcile:
          description: >-
            Optional, false by default. True submits this body as an incoming
            booked movement to reconcile against the account's pending rows
            instead of a new entry: it settles the single row it matches, or
            is created PENDING with a `reviewReason` when the match is absent
            or ambiguous. It never creates a booked duplicate.
          type: boolean
    ResolveAccountReconciliationRequest:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - snapshotVersion
        - periodStart
        - resolution
      properties:
        snapshotId:
          type: string
          format: uuid
        snapshotVersion:
          type: integer
          minimum: 1
        periodStart:
          type: string
          format: date
        resolution:
          $ref: '#/components/schemas/AccountReconciliationResolution'
    AccountReconciliationResolution:
      type: string
      enum:
        - MATCH
        - OVERRIDE
        - ADJUST
    AccountReconciliationReason:
      type: string
      description: >-
        Why no discrepancy could be produced. It replaces the figure and never
        accompanies one.
      enum:
        - MISSING_OPENING_BALANCE
        - STALE_CLOSING_BALANCE
        - MIXED_ASSETS
    AccountReconciliation:
      type: object
      additionalProperties: false
      required:
        - accountId
        - snapshotId
        - snapshotVersion
        - reconciliationStatus
        - periodStart
        - periodEnd
        - openingBalance
        - movementsTotal
        - closingBalance
        - discrepancy
        - nonCalculableReason
        - pendingCount
        - pendingTransactions
        - availableResolutions
      properties:
        accountId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        snapshotVersion:
          type: integer
        reconciliationStatus:
          type: string
          enum:
            - UNRECONCILED
            - RECONCILED
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        openingBalance:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        movementsTotal:
          description: Sum of the booked, live movements of the period; pending rows excluded.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        closingBalance:
          $ref: '#/components/schemas/DecimalAmount'
        discrepancy:
          description: >-
            closing - (opening + movements). Positive: the account holds more
            than the movements explain. Null when not calculable.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        nonCalculableReason:
          oneOf:
            - $ref: '#/components/schemas/AccountReconciliationReason'
            - type: 'null'
        pendingCount:
          type: integer
          minimum: 0
        pendingTransactions:
          description: The pending rows of the period, at most 100.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Transaction'
        availableResolutions:
          type: array
          items:
            $ref: '#/components/schemas/AccountReconciliationResolution'
    ReconcileTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - matchedTransactionId
      properties:
        version:
          type: integer
          minimum: 1
        matchedTransactionId:
          description: >-
            The pending transaction this reviewed movement settles: one of its
            recorded candidates, or any other pending row of the same account
            the reviewer judges to be the same movement. Null means the
            movement is genuinely new and books on its own.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    UpdateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - accountId
        - amount
        - nature
        - state
        - bookedOn
        - valueOn
        - authorizedOn
        - rawLabel
        - counterparty
        - note
        - paymentMethod
        - mcc
        - maskedCard
        - bankReference
        - categoryId
        - splits
        - version
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        nature:
          $ref: '#/components/schemas/StandaloneTransactionNature'
        state:
          type: string
          enum:
            - PENDING
            - BOOKED
            - REJECTED
        bookedOn:
          type: string
          format: date
        valueOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        authorizedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        rawLabel:
          type: string
          minLength: 1
          maxLength: 140
          description: >-
            Editable for manually entered transactions. Imported or provider-sourced
            transactions must echo their original source label unchanged.
        counterparty:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        mcc:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        maskedCard:
          oneOf:
            - type: string
              pattern: '^[0-9]{4}$'
            - type: 'null'
        bankReference:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: 'null'
        categoryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        splits:
          description: >-
            An explicit multi-row allocation, replacing the categoryId
            shorthand. Null keeps the shorthand; an empty list clears the
            allocation and returns the transaction to the "to categorise"
            queue.
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/TransactionSplitInput'
            - type: 'null'
        version:
          type: integer
          minimum: 1
    ReplaceTransactionSplitsRequest:
      type: object
      additionalProperties: false
      required:
        - splits
        - version
      properties:
        splits:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TransactionSplitInput'
        version:
          type: integer
          minimum: 1
    TransactionSplitInput:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - amount
        - analyticAxes
        - note
      properties:
        categoryId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        analyticAxes:
          description: >-
            Null inherits the picked category's default axes; an explicit
            list, even empty, overrides them. An override never rewrites the
            category itself.
          oneOf:
            - $ref: '#/components/schemas/AnalyticAxes'
            - type: 'null'
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 140
            - type: 'null'
    VoidTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    Transfer:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - target
        - fee
        - exchangeRate
        - version
        - createdAt
        - updatedAt
        - voidedAt
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/Transaction'
        target:
          $ref: '#/components/schemas/Transaction'
        fee:
          description: The separate FEE transaction on the source account, or null.
          oneOf:
            - $ref: '#/components/schemas/Transaction'
            - type: 'null'
        exchangeRate:
          description: Derived rate for a cross-asset transfer, or null for a same-asset one.
          oneOf:
            - type: string
              pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        voidedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required:
        - sourceAccountId
        - targetAccountId
        - sourceAmount
        - targetAmount
        - state
        - bookedOn
        - valueOn
        - label
        - note
        - fee
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        sourceAmount:
          description: A positive magnitude; the server negates it for the source leg.
          $ref: '#/components/schemas/DecimalAmount'
        targetAmount:
          description: >-
            A positive magnitude in the target account asset. Required when
            the two accounts do not share an asset; optional otherwise,
            where it defaults to the source magnitude.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        state:
          type: string
          enum:
            - PENDING
            - BOOKED
        bookedOn:
          type: string
          format: date
        valueOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        label:
          type: string
          minLength: 1
          maxLength: 140
          description: Becomes the raw label of both legs and the fee, unsuffixed in storage.
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        fee:
          description: >-
            A negative amount in the source account asset, producing a
            separate FEE transaction on the source account. Null when there
            is no fee.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
    UpdateTransferRequest:
      type: object
      additionalProperties: false
      required:
        - sourceAccountId
        - targetAccountId
        - state
        - bookedOn
        - valueOn
        - label
        - note
        - fee
        - version
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PENDING
            - BOOKED
        bookedOn:
          type: string
          format: date
        valueOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        label:
          type: string
          minLength: 1
          maxLength: 140
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        fee:
          description: Replaces, adds or removes the fee. Null means no fee.
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        version:
          type: integer
          minimum: 1
    VoidTransferRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    DecimalAmount:
      description: >-
        A financial decimal. Every amount, quantity, price and rate travels as
        a canonical decimal string paired with its asset code; a native JSON
        number is forbidden, because parsing one would put a binary float back
        into a financial value.
      type: object
      additionalProperties: false
      required:
        - value
        - assetCode
      properties:
        value:
          type: string
          pattern: '^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '230.5688'
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
    AmountInputProblem:
      description: >-
        An RFC 9457 problem raised by the shared exact-amount parser. The JSON
        pointer names the public request member that failed validation.
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - pointer
      properties:
        type:
          type: string
          format: uri-reference
          pattern: '^/problems/amount\.'
        title:
          type: string
        status:
          type: integer
          const: 422
        detail:
          type: string
        pointer:
          type: string
          pattern: '^/'
    TransactionBelongsToTransferProblem:
      description: >-
        Raised by the transaction update, void and split-replacement
        endpoints when the targeted transaction is a transfer leg or its
        fee: only the transfer's own endpoint may change it.
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - transferId
      properties:
        type:
          type: string
          format: uri-reference
          const: /problems/transaction-belongs-to-transfer
        title:
          type: string
        status:
          type: integer
          const: 422
        detail:
          type: string
        transferId:
          description: The transfer to use instead.
          type: string
          format: uuid
    PeriodClosingCondition:
      type: string
      enum:
        - UNRECONCILED_ACCOUNT
        - UNEXPLAINED_DISCREPANCY
        - PENDING_TRANSACTIONS
    PeriodClosingBlocker:
      description: One failing condition and how many items raise it. Never an amount or a label.
      type: object
      additionalProperties: false
      required:
        - condition
        - count
      properties:
        condition:
          $ref: '#/components/schemas/PeriodClosingCondition'
        count:
          type: integer
          minimum: 1
    PeriodClosure:
      type: object
      additionalProperties: false
      required:
        - id
        - period
        - closedAt
        - closedBy
        - reopenedAt
        - reopenReason
        - active
        - version
      properties:
        id:
          type: string
          format: uuid
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
          format: uuid
        reopenedAt:
          type:
            - string
            - 'null'
          format: date-time
        reopenReason:
          type:
            - string
            - 'null'
          maxLength: 200
        active:
          description: Only the active closure of a month refuses writes.
          type: boolean
        version:
          type: integer
          minimum: 1
    PeriodClosureList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PeriodClosure'
    PeriodStatus:
      type: object
      additionalProperties: false
      required:
        - period
        - closed
        - ended
        - closure
        - blockers
      properties:
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        closed:
          type: boolean
        ended:
          description: Whether the month is over in the workspace's own timezone. Only an ended month can be closed.
          type: boolean
        closure:
          oneOf:
            - $ref: '#/components/schemas/PeriodClosure'
            - type: 'null'
        blockers:
          description: Empty when the month is closed or when nothing blocks it.
          type: array
          items:
            $ref: '#/components/schemas/PeriodClosingBlocker'
    ClosePeriodRequest:
      type: object
      additionalProperties: false
      properties:
        overrides:
          description: >-
            Each confirmed condition with the reason for waiving it. A
            condition absent from the month's blockers is refused.
          type: object
          additionalProperties: false
          properties:
            UNRECONCILED_ACCOUNT:
              type: string
              minLength: 1
              maxLength: 200
            UNEXPLAINED_DISCREPANCY:
              type: string
              minLength: 1
              maxLength: 200
            PENDING_TRANSACTIONS:
              type: string
              minLength: 1
              maxLength: 200
    ReopenPeriodRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - reason
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
    PeriodClosingBlockedProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - blockers
      properties:
        type:
          type: string
          format: uri-reference
          const: /problems/period-closing-blocked
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/PeriodClosingBlocker'
