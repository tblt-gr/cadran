openapi: 3.1.0
info:
  title: Cadran Budget API
  version: 0.1.0
  description: Versioned HTTP contract for the Cadran Budget modular monolith.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/status:
    get:
      operationId: getFoundationStatus
      summary: Check that the API foundation is available
      tags:
        - Foundation
      # The foundation probe is deliberately public; it exposes no workspace data.
      security: []
      responses:
        '200':
          description: The API foundation is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the current session
      description: >-
        Public. Reports whether the request carries an authenticated, active
        session and whether first-run password setup is still pending. Also
        plants the `csrf_token` cookie when the request lacks a valid one.
      tags:
        - Session
      security: []
      responses:
        '200':
          description: The session state for the calling browser.
          headers:
            Set-Cookie:
              description: >-
                `csrf_token=<signed token>; Path=/; SameSite=Strict` (plus
                `Secure` over HTTPS). Echo it in `X-CSRF-TOKEN` on every mutation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: openSession
      summary: Open a session with email and password
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie from a prior safe response, and its
        Origin must be this server. Failed attempts are rate-limited per email
        and source address.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: The session cookie is set. Fetch GET /api/v1/session for details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: closeSession
      summary: Close the current session
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie, with an Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is invalidated. A no-op when already anonymous.
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session/password:
    put:
      operationId: defineInitialPassword
      summary: Define the owner password on first run
      description: >-
        Public and one-time. Accepted only while the provisioned owner has no
        password; afterwards it answers 409. A same-origin browser mutation: it
        must send the X-CSRF-TOKEN header matching the csrf_token cookie, with an
        Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinePasswordRequest'
      responses:
        '204':
          description: The password is stored. The owner can now open a session.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read the workspace audit trail
      description: >-
        Requires an authenticated session. Returns the calling workspace's
        audit events, newest first. The workspace is resolved server-side from
        the session; there is no way to ask for another one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as `nextCursor` by the previous page. Omit it
            to read the newest events.
          schema:
            type: string
      responses:
        '200':
          description: One page of the workspace audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events/{id}:
    get:
      operationId: readAuditEvent
      summary: Read one audit event of the calling workspace
      description: >-
        Requires an authenticated session. The workspace is resolved server-side
        from the session and combined with the identifier, so an event that
        belongs to another workspace answers 404 exactly like an unknown one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of an event of the calling workspace.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: Read the system asset reference
      description: >-
        Requires an authenticated session. Returns the currencies and
        crypto-assets every financial figure is denominated in, with the
        precisions and rounding rule each one is read against. The reference is
        global and read-only: it belongs to no workspace and every session
        reads the same rows.
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the asset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets/{code}:
    get:
      operationId: readAsset
      summary: Read one asset of the system reference
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        asset".
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Asset code, such as `EUR` or `BTC`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]{1,11}$'
      responses:
        '200':
          description: The requested asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Read the system product catalogue on a business date
      description: >-
        Requires an authenticated session. Returns the financial product models
        the application ships with — Livret A, LDDS, LEP, PEA, CTO, life
        insurance — each resolved against the business date asked for. The
        catalogue is global and read-only: it belongs to no workspace, every
        session reads the same rows, and a regulatory value changes through a
        reviewed migration rather than through a request.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: One page of the product catalogue, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{code}:
    get:
      operationId: readProduct
      summary: Read one catalogue product on a business date
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        product".
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Product code, such as `FR_LIVRET_A`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The requested product, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List the calling workspace categories
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Archived rows are
        omitted unless explicitly requested.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: type
          in: query
          required: false
          description: Restrict results to income or expense categories.
          schema:
            $ref: '#/components/schemas/CategoryType'
        - name: search
          in: query
          required: false
          description: Case-insensitive contained label search, bounded to 80 characters.
          schema:
            type: string
            maxLength: 80
        - name: parentEligible
          in: query
          required: false
          description: Return only active categories below the maximum tree depth.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of categories from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCategory
      summary: Create a category in the calling workspace
      description: >-
        Creates an income or expense category. The parent, when present, must
        be active, belong to the calling workspace and carry the same type.
        The mutation requires the same-origin CSRF token.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: The category was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '409':
          description: An active sibling already uses the normalized label.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category type, parent, metadata or bounds are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}:
    put:
      operationId: updateCategory
      summary: Update an active category
      description: >-
        Replaces editable category fields using optimistic versioning. Parent
        moves and archival are separate impact-aware operations outside this
        endpoint. A category already used by history cannot change type.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The label conflicts or the submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category fields are invalid or an immutable rule was violated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List the calling workspace financial accounts
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Closed and
        archived accounts are omitted unless explicitly requested.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeClosed
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: kind
          in: query
          required: false
          description: Restrict results to one account kind.
          schema:
            $ref: '#/components/schemas/AccountKind'
      responses:
        '200':
          description: One page of accounts from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccount
      summary: Create a financial account in the calling workspace
      description: >-
        Creates an account with its denomination, kind, lifecycle dates,
        valuation mode and inclusion policies. The asset code must exist in the
        read-only system reference. An optional `productCode` backs the account
        with a catalogue product; the submitted kind and valuation mode are then
        checked against what that product declares. The mutation requires the
        same-origin CSRF token.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '409':
          description: >-
            An active account already uses the normalized label
            (`type: /problems/account-label-taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The denomination, kind, product reference, valuation mode, masked
            identifier or lifecycle dates are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}:
    put:
      operationId: updateAccount
      summary: Update an active financial account
      description: >-
        Replaces the editable account fields using optimistic versioning, and
        closes or reopens the account through `closedOn`. The denomination is
        absent from the body: changing it would reinterpret every figure already
        recorded against the account. An account already used by history cannot
        change kind or product, and an archived account is read-only.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Either an active account already uses the normalized label
            (`type: /problems/account-label-taken`), or the submitted version is
            stale (`type: /problems/stale-version`). The two ask for opposite
            recoveries, so a client branches on the type rather than the status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The account fields are invalid, an immutable rule was violated, or
            the account is archived and read-only
            (`type: /problems/account-archived`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
  /api/v1/accounts/{id}/archive:
    post:
      operationId: archiveAccount
      summary: Archive a financial account
      description: >-
        Takes the account out of the working set without deleting it, so
        history and later valuations keep a row to point at. Archiving frees the
        account label for a new active account. An already archived account is
        rejected rather than archived twice.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAccountRequest'
      responses:
        '200':
          description: The archived account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The submitted version is stale (`type: /problems/stale-version`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'The account is already archived (`type: /problems/account-archived`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/rules:
    get:
      operationId: readAccountRules
      summary: Read the rules in force for an account on a business date
      description: >-
        Resolves the ceilings, rates and terms that apply to one account of the
        calling workspace on the business date asked for. Nothing here is
        stored on the account: the rules are read from the system catalogue on
        that date, so a regulatory revision reaches every account at once and a
        past statement stays re-readable against the rules that applied then.

        A ceiling always states the figure it is measured against, because the
        amount alone decides nothing: 22 950 € checked against a total balance
        and the same amount checked against deposits excluding interest give
        opposite verdicts on the same passbook. A rate always resolves to a
        bracket scale, single-bracket for the products the catalogue ships
        today, so a client reads every rate the same way. A rule the account is
        expected to carry and that no sourced period covers on the date is
        listed in `unavailableRuleKinds` and is never returned as zero.
      tags:
        - Accounts
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The rules in force for the account on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cadran_session
      description: >-
        Same-origin session cookie issued by POST /api/v1/session. HttpOnly, so
        the browser attaches it automatically and no script can read it.
  responses:
    Unauthorized:
      description: The request carries no authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The endpoint requires an application/json request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body or a query parameter is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: The email or password is incorrect. Identical for an unknown email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        On sign-in, either the credentials were valid but the account is
        disabled (`type: about:blank`), or the CSRF / Origin check failed
        (`type: /problems/csrf-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceForbidden:
      description: The session is attached to no workspace, so there is nothing to read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        No such object in the calling workspace. Identical whether the
        identifier is unknown or belongs to another workspace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfFailure:
      description: 'The CSRF token or Origin check failed (`type: /problems/csrf-token`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CategoryMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The JSON request body exceeds the 16 KiB mutation limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >-
        Too many failed sign-in attempts for this email and source address.
        Identical whether or not the email exists. Retry after the window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The owner password has already been defined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The password does not satisfy the account password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Double-submit CSRF token: the value of the `csrf_token` cookie from a
        prior safe response. Rejected with 403 if missing, altered, or expired.
      schema:
        type: string
    BusinessDate:
      name: asOf
      in: query
      required: false
      description: >-
        Business date the catalogue rules are resolved against, as an ISO 8601
        calendar day. Defaults to today. A rule is selected by this date and
        never by the current date, so reading a past statement shows the
        ceiling and rate that applied then.
      schema:
        type: string
        format: date
        examples:
          - '2026-09-02'
  schemas:
    FoundationStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - apiVersion
      properties:
        status:
          type: string
          const: ready
        apiVersion:
          type: string
          const: v1
    SessionState:
      type: object
      additionalProperties: false
      required:
        - provisioned
        - authenticated
        - setupRequired
        - user
        - workspace
      properties:
        provisioned:
          type: boolean
          description: True once an owner account exists on this server.
        authenticated:
          type: boolean
          description: True when an active, authenticated session is attached.
        setupRequired:
          type: boolean
          description: True when the provisioned owner has no password yet.
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        workspace:
          oneOf:
            - $ref: '#/components/schemas/SessionWorkspace'
            - type: 'null'
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    SessionWorkspace:
      type: object
      additionalProperties: false
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    DefinePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          description: Cursor for the following page, or null on the last page.
          oneOf:
            - type: string
            - type: 'null'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorId
        - eventType
        - entityType
        - entityId
        - before
        - after
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          description: >-
            The user who performed the operation, or null when it had no
            authenticated actor - console provisioning and the first-run
            password flow.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        eventType:
          type: string
          examples:
            - session.opened
        entityType:
          type: string
          examples:
            - user
        entityId:
          type: string
          format: uuid
        before:
          $ref: '#/components/schemas/AuditDiffSide'
        after:
          $ref: '#/components/schemas/AuditDiffSide'
    AuditDiffSide:
      description: >-
        Bounded structured attributes, or null when the event has no such side.
        Sensitive attribute values are stored redacted, never in clear.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: 'null'
        - type: 'null'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of assets the reference holds.
          type: integer
          minimum: 0
    Asset:
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - displayName
        - storagePrecision
        - displayPrecision
        - roundingMode
        - displayStep
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
        kind:
          type: string
          enum:
            - FIAT
            - CRYPTO
        displayName:
          type: string
        storagePrecision:
          description: >-
            Decimal places a *submitted* figure of this asset may carry. A
            value beyond it is refused before persistence, never rounded in
            silence. It does not cap a derived figure: a conversion or a split
            keeps the full 24 decimals of the storage type.
          type: integer
          minimum: 0
          maximum: 24
        displayPrecision:
          description: >-
            Decimal places an interface or export shows. Never greater than
            `storagePrecision`, which JSON Schema cannot express here: showing
            more decimals than are stored would invent digits. A non-zero value
            smaller than the last shown decimal is displayed as such, never as
            a rounded zero.
          type: integer
          minimum: 0
          maximum: 24
        roundingMode:
          description: Rule the presentation boundary applies when it shows fewer decimals than are stored.
          type: string
          enum:
            - HALF_UP
            - HALF_EVEN
            - DOWN
        displayStep:
          $ref: '#/components/schemas/DecimalAmount'
    ProductPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of products the catalogue holds.
          type: integer
          minimum: 0
    CeilingBasis:
      description: >-
        The figure a ceiling is compared against. Three of these four measures
        give a different verdict on the same account, so the amount alone
        decides nothing. A share savings plan is capped on the contributions
        paid into it, whatever the plan is worth, so a plan that grew past its
        ceiling through market value has broken no rule. A regulated passbook is
        capped on what was deposited, credited interest excluded, so a passbook
        carried past its ceiling by its own interest has broken no rule either.
        A combined ceiling is measured across the products sharing it and can be
        reached while no single account is.
      type: string
      enum:
        - NONE
        - BALANCE_EXCLUDING_INTEREST
        - TOTAL_BALANCE
        - CONTRIBUTIONS
        - COMBINED_CONTRIBUTIONS
    ProductCode:
      description: >-
        The stable identifier of a catalogue product. The catalogue is a global
        system reference with no workspace, so a code either exists for every
        workspace or for none.
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
      examples:
        - FR_LIVRET_A
    Product:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - jurisdiction
        - accountKind
        - wrapperKind
        - yieldKind
        - yieldGuaranteed
        - ceilingBasis
        - defaultGroupCode
        - capabilities
        - catalogVersion
        - archivedAt
        - asOf
        - rules
        - unavailableRuleKinds
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - FR_LIVRET_A
        displayName:
          type: string
        jurisdiction:
          description: ISO 3166-1 alpha-2 country code, or null for a model that belongs to no country.
          oneOf:
            - type: string
              pattern: '^[A-Z]{2}$'
            - type: 'null'
        accountKind:
          $ref: '#/components/schemas/AccountKind'
        wrapperKind:
          type: string
          enum:
            - NONE
            - REGULATED_SAVINGS
            - TAX_WRAPPER
            - SECURITIES_ACCOUNT
            - LIFE_INSURANCE
            - RETIREMENT
            - EMPLOYEE_SAVINGS
        yieldKind:
          description: >-
            Where the product's return comes from. `MARKET` and
            `MANUAL_VALUATION` products carry no rate rule at all: what they
            earn comes from their assets and flows, which the catalogue cannot
            know.
          type: string
          enum:
            - NONE
            - REGULATED_RATE
            - CONTRACTUAL_FIXED
            - CONTRACTUAL_VARIABLE
            - MARKET
            - MANUAL_VALUATION
        yieldGuaranteed:
          description: >-
            Whether the rate the catalogue carries is owed to the holder. False
            for every market product, so no interface has to infer a promise
            from a product name.
          type: boolean
        ceilingBasis:
          $ref: '#/components/schemas/CeilingBasis'
        defaultGroupCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        capabilities:
          description: >-
            Explicit implemented behaviors enabled by this product. Consumers
            must use these values rather than infer behavior from the product
            code or display name.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductCapability'
        catalogVersion:
          type: integer
          minimum: 1
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        asOf:
          description: The business date the rules below were resolved against.
          type: string
          format: date
        rules:
          description: The rules covering `asOf`, at most one per rule kind.
          type: array
          items:
            $ref: '#/components/schemas/ProductRule'
        unavailableRuleKinds:
          description: >-
            Rule kinds this product is expected to carry and that no sourced
            period covers on `asOf`. An interface shows them as unavailable
            with their reason; it never shows them as zero.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
    ProductCapability:
      type: string
      enum:
        - SUPPORTS_BALANCE
        - SUPPORTS_TRANSACTIONS
        - SUPPORTS_INTEREST
        - SUPPORTS_HOLDINGS
        - SUPPORTS_TRADES
        - SUPPORTS_ARBITRAGE
        - SUPPORTS_CONTRIBUTIONS
        - SUPPORTS_FEES
        - SUPPORTS_TAX_TRACKING
        - SUPPORTS_LIABILITY
    ProductRuleKind:
      type: string
      enum:
        - DEPOSIT_CEILING
        - BALANCE_CEILING
        - CONTRIBUTION_CEILING
        - COMBINED_CONTRIBUTION_CEILING
        - ANNUAL_RATE
        - MIN_RATE
        - INTEREST_ACCRUAL_METHOD
        - ELIGIBILITY
        - TAX_REFERENCE
    ProductRule:
      description: >-
        One dated rule of one product, with the publication it was read from.
        Exactly one of `amount`, `percentage` and `text` is set, decided by the
        rule kind.
      type: object
      additionalProperties: false
      required:
        - kind
        - valueType
        - amount
        - percentage
        - text
        - validFrom
        - validTo
        - verification
        - verifiedOn
        - verifiedBy
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          type: string
          enum:
            - AMOUNT
            - PERCENTAGE
            - TEXT
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        percentage:
          description: >-
            A rate expressed in percent as the source published it: `1.7` reads
            1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
              examples:
                - '1.7'
            - type: 'null'
        text:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the source and to the translation
            catalogue.
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
              examples:
                - NO_REGULATORY_CONTRIBUTION_CEILING
            - type: 'null'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        verifiedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        verifiedBy:
          oneOf:
            - type: string
            - type: 'null'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    ProductRuleSource:
      description: The official publication the value was read from.
      type: object
      additionalProperties: false
      required:
        - publisher
        - title
        - url
        - publishedOn
        - retrievedOn
      properties:
        publisher:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publishedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        retrievedOn:
          description: The day a maintainer actually opened the publication.
          type: string
          format: date
    CategoryPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
        - parentId
        - parentLabel
        - icon
        - color
        - defaultAnalyticAxes
        - budgetIncluded
        - sortOrder
        - depth
        - version
        - used
        - typeEditable
        - typeEditReason
        - canAcceptChildren
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/CategoryType'
        label:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        parentLabel:
          description: Label of the parent category, or null when the category is a root.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        icon:
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            - type: 'null'
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        defaultAnalyticAxes:
          $ref: '#/components/schemas/AnalyticAxes'
        budgetIncluded:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 32767
        depth:
          type: integer
          minimum: 1
          maximum: 8
        version:
          type: integer
          minimum: 1
        used:
          type: boolean
        typeEditable:
          description: Backend-owned eligibility for changing income/expense type.
          type: boolean
        typeEditReason:
          description: Why the type is immutable, or null when it can be changed.
          oneOf:
            - type: string
              enum:
                - ARCHIVED
                - USED
                - CHILD
                - HAS_CHILDREN
            - type: 'null'
        canAcceptChildren:
          description: True only for active categories below the maximum tree depth.
          type: boolean
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - label
        - parentId
        - icon
        - color
        - defaultAnalyticAxes
        - budgetIncluded
        - sortOrder
      properties:
        type:
          $ref: '#/components/schemas/CategoryType'
        label:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        icon:
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            - type: 'null'
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        defaultAnalyticAxes:
          $ref: '#/components/schemas/AnalyticAxes'
        budgetIncluded:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 32767
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - label
        - icon
        - color
        - defaultAnalyticAxes
        - budgetIncluded
        - sortOrder
        - version
      properties:
        type:
          $ref: '#/components/schemas/CategoryType'
        label:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            - type: 'null'
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        defaultAnalyticAxes:
          $ref: '#/components/schemas/AnalyticAxes'
        budgetIncluded:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 32767
        version:
          type: integer
          minimum: 1
    AccountPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - assetCode
        - kind
        - productCode
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - status
        - netWorthSign
        - used
        - editable
        - kindEditable
        - kindEditReason
        - version
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 80
        assetCode:
          description: >-
            The unit the account is denominated in, from the read-only system
            asset reference. It is fixed at creation: changing it would
            reinterpret every figure already recorded against the account.
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            The catalogue product this account was created from, or null for an
            account described by hand. Only the reference is stored: ceilings,
            rates and methods stay in the catalogue and are read on the business
            date they are needed, so a regulatory revision is never frozen into
            an account.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        institution:
          description: >-
            Free text naming where the account is held, such as the bank or the
            insurer. No reference of institutions ships with the application, so
            this is bounded rather than validated against a list.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          description: >-
            The visible tail of a banking or contract identifier, such as
            `4821`. Bounded to eight characters, which cannot hold a full
            identifier.
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          description: Only an account counted in net worth may back the emergency fund.
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          description: The day the account was closed, or null while it is open.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        status:
          $ref: '#/components/schemas/AccountStatus'
        netWorthSign:
          description: >-
            The sign this account contributes to net worth: `1` for an asset,
            `-1` for a liability. It carries no amount; a balance arrives with
            its own record and stays null until then. The sign is independent of
            `includeInNetWorth`: an excluded account still reports its nature, so
            an aggregation must read the inclusion flag before applying the sign.
          type: integer
          enum:
            - -1
            - 1
        used:
          type: boolean
        editable:
          description: False for an archived account, which is read-only.
          type: boolean
        kindEditable:
          description: Backend-owned eligibility for changing the account kind.
          type: boolean
        kindEditReason:
          description: Why the kind is immutable, or null when it can be changed.
          oneOf:
            - type: string
              enum:
                - ARCHIVED
                - USED
            - type: 'null'
        version:
          type: integer
          minimum: 1
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - assetCode
        - kind
        - productCode
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          description: >-
            Must equal the `accountKind` the referenced product declares. The
            catalogue is the authority, so a tampered form cannot file a PEA as
            a plain savings account.
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            A catalogue product to create the account from, or null for an
            account described by hand. An unknown product is refused by the use
            case and by a foreign key.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - kind
        - productCode
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - version
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            Changing the product, the kind or the valuation mode sends the whole
            triple back through the catalogue. An account already used by
            history cannot change product at all.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          description: A day on or after the opening date closes the account; null reopens it.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        version:
          type: integer
          minimum: 1
    ArchiveAccountRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    AccountKind:
      description: >-
        What an account holds. Shared by the product catalogue and the accounts
        of a workspace, so a product-based account inherits exactly one of these
        kinds.
      type: string
      enum:
        - CURRENT
        - SAVINGS
        - PORTFOLIO
        - INSURANCE_CONTRACT
        - EMPLOYEE_BENEFIT
        - CASH
        - REAL_ASSET
        - LIABILITY
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
        - ARCHIVED
    AccountValuationMode:
      description: >-
        Where the value of the account comes from: recorded movements, dated
        valuations entered by hand, or portfolio positions. Only an account
        kind that holds positions accepts `PORTFOLIO`.
      type: string
      enum:
        - TRANSACTIONS
        - SNAPSHOTS
        - PORTFOLIO
    LiquidityLevel:
      type: string
      enum:
        - IMMEDIATE
        - SHORT_TERM
        - MEDIUM_TERM
        - LONG_TERM
        - ILLIQUID
    AccountRules:
      description: >-
        Everything in force for one account on one business date, split into
        the three questions that are answered differently: what caps it, what
        it earns, and under which terms.
      type: object
      additionalProperties: false
      required:
        - accountId
        - assetCode
        - productCode
        - origin
        - asOf
        - ceilings
        - rates
        - terms
        - unavailableRuleKinds
      properties:
        accountId:
          type: string
          format: uuid
        assetCode:
          description: The unit the account is denominated in.
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        productCode:
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        origin:
          $ref: '#/components/schemas/AccountRulesOrigin'
        asOf:
          description: >-
            The business date the rules were resolved on. Every value below
            answers for this date and for no other.
          type: string
          format: date
        ceilings:
          type: array
          items:
            $ref: '#/components/schemas/AccountCeiling'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/AccountRate'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AccountTerm'
        unavailableRuleKinds:
          description: >-
            The rules this account is expected to carry and that no sourced
            period covers on this date. A gap is shown as unavailable and never
            as zero, which would read as "no ceiling" or "no interest" when the
            truth is that the value is unknown.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
    AccountRulesOrigin:
      description: >-
        Where the resolved rules came from. An account that inherits no rule
        and an account whose rules could not be read are different answers, and
        neither of them means the account has no ceiling.
      type: string
      enum:
        - NO_PRODUCT
        - SYSTEM_CATALOG
        - PRODUCT_WITHDRAWN
    AccountCeiling:
      description: A ceiling in force for the account, with the figure it caps.
      type: object
      additionalProperties: false
      required:
        - kind
        - basis
        - countsCreditedInterest
        - spansSeveralAccounts
        - measurable
        - amount
        - validFrom
        - validTo
        - verification
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        basis:
          $ref: '#/components/schemas/CeilingBasis'
        countsCreditedInterest:
          description: >-
            Whether interest credited by the institution counts towards the
            measure. When it does not, interest may carry the account past the
            amount without any rule being broken.
          type: boolean
        spansSeveralAccounts:
          description: >-
            Whether the ceiling is reached across the products sharing it, in
            which case reading this account alone cannot settle it.
          type: boolean
        measurable:
          description: >-
            False when the ceiling is published in another unit than the
            account is denominated in. No conversion is applied and no verdict
            is produced; the ceiling is reported as not comparable.
          type: boolean
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    AccountRate:
      description: >-
        A rate in force for the account, always as a bracket scale. The
        products the catalogue ships today resolve to a single bracket running
        from zero without limit, so a tiered product arrives later as data
        rather than as a second way of reading a rate.
      type: object
      additionalProperties: false
      required:
        - kind
        - guaranteed
        - application
        - brackets
        - validFrom
        - validTo
        - verification
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        guaranteed:
          description: >-
            Whether the rate is owed to the holder. A revisable rate is only
            the rate published today and is never an acquired return.
          type: boolean
        application:
          $ref: '#/components/schemas/RateApplication'
        brackets:
          description: >-
            The slices the scale is made of, in order. They tile the amounts
            they cover: the first starts at zero, each one starts where the
            previous ended, and the last runs without limit.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    RateApplication:
      description: >-
        How the brackets combine over an amount. The same two brackets pay a
        different interest depending on whether the reached one applies to
        everything or only to the slice it covers, so a scale is never read
        without it.
      type: string
      enum:
        - WHOLE_BALANCE
    RateBracket:
      description: >-
        One slice of a rate scale. The lower bound is included and the upper
        bound excluded, so two adjacent brackets leave no amount uncovered and
        count none twice.
      type: object
      additionalProperties: false
      required:
        - percentage
        - lowerBound
        - upperBound
      properties:
        percentage:
          description: >-
            The rate expressed in percent as the source published it: `1.7`
            reads 1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '1.7'
        lowerBound:
          description: First amount the bracket covers, included.
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '0'
        upperBound:
          description: >-
            First amount the bracket no longer covers, or null when the slice
            runs without limit.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
    AccountTerm:
      description: >-
        A rule of the account that states neither a ceiling nor a rate: how
        interest accrues, who is eligible, which tax regime applies.
      type: object
      additionalProperties: false
      required:
        - kind
        - token
        - validFrom
        - validTo
        - verification
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        token:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the publication it was read from and
            to the translation catalogue.
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - NO_REGULATORY_CONTRIBUTION_CEILING
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    RuleValidFrom:
      description: First day this catalogue vouches for the value.
      type: string
      format: date
    RuleValidTo:
      description: >-
        Last day covered, inclusive, or null while no revision has closed the
        period. An open end is in force for every later business date; it is
        never an expiry.
      oneOf:
        - type: string
          format: date
        - type: 'null'
    RuleVerification:
      description: >-
        How much the value can be trusted today, independently of the business
        date it applies to. `STALE` means nobody has re-read the source across
        a full revision cycle.
      type: string
      enum:
        - VERIFIED
        - STALE
        - UNVERIFIED
    CategoryType:
      type: string
      enum:
        - EXPENSE
        - INCOME
    AnalyticAxes:
      type: array
      uniqueItems: true
      maxItems: 6
      items:
        type: string
        enum:
          - DISCRETIONARY
          - ESSENTIAL
          - FIXED
          - PERSONAL
          - PROFESSIONAL
          - VARIABLE
    DecimalAmount:
      description: >-
        A financial decimal. Every amount, quantity, price and rate travels as
        a canonical decimal string paired with its asset code; a native JSON
        number is forbidden, because parsing one would put a binary float back
        into a financial value.
      type: object
      additionalProperties: false
      required:
        - value
        - assetCode
      properties:
        value:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '230.5688'
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
