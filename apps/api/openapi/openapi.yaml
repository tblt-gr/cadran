openapi: 3.1.0
info:
  title: Cadran Budget API
  version: 0.1.0
  description: Versioned HTTP contract for the Cadran Budget modular monolith.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/status:
    get:
      operationId: getFoundationStatus
      summary: Check that the API foundation is available
      tags:
        - Foundation
      # The foundation probe is deliberately public; it exposes no workspace data.
      security: []
      responses:
        '200':
          description: The API foundation is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the current session
      description: >-
        Public. Reports whether the request carries an authenticated, active
        session and whether first-run password setup is still pending. Also
        plants the `csrf_token` cookie when the request lacks a valid one.
      tags:
        - Session
      security: []
      responses:
        '200':
          description: The session state for the calling browser.
          headers:
            Set-Cookie:
              description: >-
                `csrf_token=<signed token>; Path=/; SameSite=Strict` (plus
                `Secure` over HTTPS). Echo it in `X-CSRF-TOKEN` on every mutation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: openSession
      summary: Open a session with email and password
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie from a prior safe response, and its
        Origin must be this server. Failed attempts are rate-limited per email
        and source address.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: The session cookie is set. Fetch GET /api/v1/session for details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: closeSession
      summary: Close the current session
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie, with an Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is invalidated. A no-op when already anonymous.
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/session/password:
    put:
      operationId: defineInitialPassword
      summary: Define the owner password on first run
      description: >-
        Public and one-time. Accepted only while the provisioned owner has no
        password; afterwards it answers 409. A same-origin browser mutation: it
        must send the X-CSRF-TOKEN header matching the csrf_token cookie, with an
        Origin of this server.
      tags:
        - Session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinePasswordRequest'
      responses:
        '204':
          description: The password is stored. The owner can now open a session.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/profile:
    get:
      operationId: getOwnerProfile
      summary: Read the signed-in owner's own account
      description: >-
        Requires an authenticated session. The account is resolved from the
        session; there is no way to ask for another one. It answers from the
        identity record alone, so the settings screen renders on an install
        that holds no account or transaction yet.
      tags:
        - Profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner account as its own owner sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '409':
          $ref: '#/components/responses/OwnerNotProvisioned'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateOwnerProfile
      summary: Edit the signed-in owner's display name
      description: >-
        A same-origin browser mutation: it must send the X-CSRF-TOKEN header
        matching the csrf_token cookie, with an Origin of this server. The
        display name is the only editable field; a body carrying any other key
        is refused rather than silently ignored.
      tags:
        - Profile
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The stored account, with the new display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileMutationForbidden'
        '409':
          $ref: '#/components/responses/OwnerNotProvisioned'
        '413':
          $ref: '#/components/responses/ProfilePayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDisplayName'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/profile/password:
    put:
      operationId: changeOwnerPassword
      summary: Change the signed-in owner's password
      description: >-
        Requires the current password in the same request, verified server-side
        and rate-limited on its own budget, independently of sign-in throttling.
        On success every other session is revoked and the calling session is
        issued a new identifier, so the acting browser stays signed in and a
        cookie captured earlier stops working. A same-origin browser mutation:
        it must send the X-CSRF-TOKEN header matching the csrf_token cookie,
        with an Origin of this server.
      tags:
        - Profile
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: >-
            The password is replaced. The response carries a new session cookie;
            refetch GET /api/v1/session.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileMutationForbidden'
        '409':
          $ref: '#/components/responses/OwnerNotProvisioned'
        '413':
          $ref: '#/components/responses/ProfilePayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PasswordChangeRefused'
        '429':
          $ref: '#/components/responses/PasswordChangeThrottled'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read the workspace audit trail
      description: >-
        Requires an authenticated session. Returns the calling workspace's
        audit events, newest first. The workspace is resolved server-side from
        the session; there is no way to ask for another one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as `nextCursor` by the previous page. Omit it
            to read the newest events.
          schema:
            type: string
      responses:
        '200':
          description: One page of the workspace audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit-events/{id}:
    get:
      operationId: readAuditEvent
      summary: Read one audit event of the calling workspace
      description: >-
        Requires an authenticated session. The workspace is resolved server-side
        from the session and combined with the identifier, so an event that
        belongs to another workspace answers 404 exactly like an unknown one.
      tags:
        - Audit
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of an event of the calling workspace.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: Read the system asset reference
      description: >-
        Requires an authenticated session. Returns the currencies and
        crypto-assets every financial figure is denominated in, with the
        precisions and rounding rule each one is read against. The reference is
        global and read-only: it belongs to no workspace and every session
        reads the same rows.
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the asset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/assets/{code}:
    get:
      operationId: readAsset
      summary: Read one asset of the system reference
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        asset".
      tags:
        - Reference
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Asset code, such as `EUR` or `BTC`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]{1,11}$'
      responses:
        '200':
          description: The requested asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Read the system product catalogue on a business date
      description: >-
        Requires an authenticated session. Returns the financial product models
        the application ships with — Livret A, LDDS, LEP, PEA, CTO, life
        insurance — each resolved against the business date asked for. The
        catalogue is global and read-only: it belongs to no workspace, every
        session reads the same rows, and a regulatory value changes through a
        reviewed migration rather than through a request.
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, between 1 and 1000. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          description: Page size, between 1 and 100. Defaults to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: One page of the product catalogue, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{code}:
    get:
      operationId: readProduct
      summary: Read one catalogue product on a business date
      description: >-
        Requires an authenticated session. An unknown code and a malformed one
        answer alike, so the endpoint keeps a single contract for "no such
        product".
      tags:
        - Catalog
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          description: Product code, such as `FR_LIVRET_A`.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: The requested product, resolved on the business date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List the calling workspace categories
      description: >-
        Requires an authenticated session. The workspace is resolved from the
        session and cannot be selected by a query parameter. Archived rows are
        omitted unless explicitly requested.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: type
          in: query
          required: false
          description: Restrict results to income or expense categories.
          schema:
            $ref: '#/components/schemas/CategoryType'
        - name: search
          in: query
          required: false
          description: Case-insensitive contained label search, bounded to 80 characters.
          schema:
            type: string
            maxLength: 80
        - name: parentEligible
          in: query
          required: false
          description: Return only active categories below the maximum tree depth.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of categories from the calling workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCategory
      summary: Create a category in the calling workspace
      description: >-
        Creates an income or expense category. The parent, when present, must
        be active, belong to the calling workspace and carry the same type.
        The mutation requires the same-origin CSRF token.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: The category was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '409':
          description: An active sibling already uses the normalized label.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category type, parent, metadata or bounds are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}:
    put:
      operationId: updateCategory
      summary: Update an active category
      description: >-
        Replaces editable category fields using optimistic versioning. Parent
        moves and archival are separate impact-aware operations outside this
        endpoint. A category already used by history cannot change type.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The label conflicts or the submitted version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The category fields are invalid or an immutable rule was violated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}/impact:
    get:
      operationId: previewCategoryImpact
      summary: Preview what a category lifecycle operation would change
      description: >-
        Answers what moving, merging, archiving or replacing a category would
        change, without changing anything. The same assessment gates the write,
        so a confirmation screen and the operation it leads to never disagree.
        `affectedClassifications` stays null with an explicit reason while no
        transaction history exists; it is never an invented `0`.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: operation
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CategoryLifecycleOperation'
        - name: targetId
          in: query
          required: false
          description: >-
            The new parent for `MOVE` (absent means the root), and the category
            receiving the history for `MERGE` and `REPLACE`. Rejected for
            `ARCHIVE`.
          schema:
            type: string
            format: uuid
        - name: effectiveFrom
          in: query
          required: false
          description: Required for `REPLACE` and rejected for every other operation.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The impact the operation would have.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImpact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}/move:
    post:
      operationId: moveCategory
      summary: Reparent a category and the branch below it
      description: >-
        Moves the category under another active category of the same type, or
        to the root when `parentId` is null, and rewrites the depth of every
        descendant in one transaction.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCategoryRequest'
      responses:
        '200':
          description: The moved category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryVersionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CategoryOperationRefused'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}/merge:
    post:
      operationId: mergeCategory
      summary: Fold a category into another one
      description: >-
        Moves the direct children under the target, records the redirection
        that makes the history of the source read as the target's, and archives
        the source. The three happen in one transaction or not at all.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCategoryRequest'
      responses:
        '200':
          description: The archived source category and its redirection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CategoryMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryVersionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CategoryOperationRefused'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Retire a category without deleting it
      description: >-
        Takes the category out of the choices offered for new classifications.
        A used category is never hard-deleted, and a category with active
        children is refused until its branch is retired first.
      tags:
        - Categories
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
