  /api/v1/accounts/{accountId}/reconciliation:
    get:
      operationId: readAccountReconciliation
      summary: Compare an observed closing balance to the movements of its period
      description: >-
        `discrepancy = closing - (opening + sum of booked movements)`, with the
        period ending on the snapshot day. The opening figure is the latest
        active snapshot on or before the day preceding `periodStart` (a period
        of at most 366 days), and movements are summed from the day after that
        opening snapshot, so nothing booked between the two is dropped. The
        response `periodStart` is that effective first day. Pending rows of the
        same window are listed and counted but never summed. When a side is missing the discrepancy is null and
        `nonCalculableReason` says why; it is never zero by default.
      tags:
        - Transactions
      security:
        - sessionCookie: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: snapshotId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodStart
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The comparison and the resolutions currently available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReconciliation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: resolveAccountReconciliation
      summary: Reconcile an observed closing balance
      description: >-
        `MATCH` requires a discrepancy of exactly zero (compared as decimals, so
        `1.10` equals `1.1`). `OVERRIDE` accepts a non-zero discrepancy as it
        stands and writes no transaction. `ADJUST` records one booked
        `ADJUSTMENT` movement equal to the discrepancy on the snapshot day,
        which is neither income nor expense, then reconciles. A non-calculable
        comparison refuses every resolution. The account is locked, so two
        concurrent requests never both adjust: the loser receives a 409.
      tags:
        - Transactions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAccountReconciliationRequest'
      responses:
        '200':
          description: The comparison after the resolution, with the snapshot reconciled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReconciliation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The snapshot version is stale (`type: /problems/stale-version`), the
            snapshot is already reconciled or the account is archived
            (`type: /problems/transaction-conflict`), or the idempotency key is
            reused or in flight.
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/transactions/{id}/reconcile:
    post:
      operationId: reconcileTransaction
      summary: Resolve a movement held for reconciliation review
      description: >-
        Applies the human decision on a pending movement carrying a
        `reviewReason`. A named match is any pending transaction of the same
        account: `reconciliationCandidateIds` is what the matching rule
        suggests, not a limit on what the reviewer may choose. The named row is
        booked carrying the reviewed movement's amount, date and external
        identifier — a row already carrying a different identifier is refused
        rather than losing one of the two — and the reviewed row is voided with
        a durable link back to it. A null match books the reviewed row itself and clears its
        `reviewReason`. Every row the resolution names is locked, so two
        reviewers cannot resolve the same ambiguity into two contradictory
        outcomes.
      tags:
        - Transactions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileTransactionRequest'
      responses:
        '200':
          description: >-
            The booked transaction: the settled candidate, or the reviewed
            movement itself when no match was named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The submitted version is stale (`type: /problems/stale-version`),
            the transaction is not held for review, or the named match is not a
            pending row of the same account
            (`type: /problems/transaction-conflict`).
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/transactions/{id}/duplicate:
    post:
      operationId: duplicateTransaction
      summary: Duplicate a transaction as a booked movement dated today
      description: >-
        Copies account, nature, amount, labels, counterparty, note, payment
        method and category. Drops external identity, provenance, bank
        reference and masked card. Transfer legs and refunds cannot be duplicated.
      tags:
        - Transactions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicated transaction, or its stored response replay.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A linked account or category changed concurrently, the key was
            reused with another request, or the first request is in flight.
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfterOneSecond'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A transfer leg or refund cannot be duplicated, or the Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/transfers:
    post:
      operationId: createTransfer
      summary: Move money between two accounts of the calling workspace atomically
      description: >-
        Creates both legs — source negative, target positive — and an
        optional fee, in one PostgreSQL transaction. sourceAmount and
        targetAmount are positive magnitudes; the server applies the signs.
        Same-asset transfers may omit targetAmount, defaulting it to the
        source magnitude; a cross-asset transfer must supply it, and the
        exchange rate is derived and stored on both legs. Neither leg carries
        income or expense, and neither accepts a split.
      tags:
        - Transfers
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: The transfer with both legs and the optional fee, or its stored response replay.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A source or target account changed concurrently, the key was reused
            with another request, or the first request is in flight.
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfterOneSecond'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The accounts, amounts, dates, state, label or fee are invalid.
            The source and target account must differ
            (`type: /problems/transfer.same_account`), and a same-asset pair
            with an explicit targetAmount must net exactly to zero
            (`type: /problems/transfer.amount_mismatch`), or the Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/AmountInputProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/transfers/{id}:
    get:
      operationId: getTransfer
      summary: Read one transfer of the calling workspace
      tags:
        - Transfers
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateTransfer
      summary: Replace the editable fields of a transfer atomically
      description: >-
        Optimistic versioning. The two accounts and both leg amounts are set
        once at creation and never change; an edit corrects the state,
        dates, label, note or fee of both legs together. Voiding and
        recreating the transfer is how an amount is corrected.
      tags:
        - Transfers
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransferRequest'
      responses:
        '200':
          description: The updated transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The submitted version is stale (`type: /problems/stale-version`)
            or the transfer is already voided (`type: /problems/transfer-conflict`).
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The edit is invalid or tried to change an immutable field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/transfers/{id}/void:
    post:
      operationId: voidTransfer
      summary: Void a transfer and its legs together, without deleting them
      description: >-
        Voids both legs and the fee, if any, in one PostgreSQL transaction.
        An already-voided transfer cannot be voided again.
      tags:
        - Transfers
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidTransferRequest'
      responses:
        '200':
          description: The voided transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TransactionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The submitted version is stale (`type: /problems/stale-version`)
            or the transfer is already voided (`type: /problems/transfer-conflict`).
            A write that touches a closed period is refused with one stable
            problem, whichever the use case (`type: /problems/period-closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/period-closures:
    get:
      operationId: listPeriodClosures
      summary: List the closures of one year, reopened ones included
      description: >-
        The history of the workspace's monthly closures, newest month first.
        A reopened closure stays listed with its reopening date and reason; a
        month closed again after reopening appears as a second row. Reading is
        never refused by a closure.
      tags:
        - Period closures
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2999
      responses:
        '200':
          description: The closures of the year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodClosureList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/periods/{period}:
    get:
      operationId: readPeriodStatus
      summary: Read one month, closed or not, with what would block closing it
      description: >-
        A closed month returns its active closure. An open month returns the
        conditions that currently block closing it, each with a count and
        never an amount or a label. The three conditions are checked across
        every non-archived account open during the month.
      tags:
        - Period closures
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PeriodMonth'
      responses:
        '200':
          description: The state of the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/periods/{period}/closure:
    put:
      operationId: closePeriod
      summary: Close a month that has ended
      description: >-
        Refused with `type: /problems/period-closing-blocked` and the list of
        failing conditions unless each one is confirmed in `overrides` with its
        own reason. There is deliberately no flag that waives everything, and
        only the workspace owner may confirm a condition. The confirmed
        conditions and reasons are audited; no amount or label is. Once
        closed, every ordinary write dated in the month is refused with
        `type: /problems/period-closed`.
      tags:
        - Period closures
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PeriodMonth'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePeriodRequest'
      responses:
        '201':
          description: The active closure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodClosure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Only the workspace owner may confirm a condition
            (`type: about:blank`), the CSRF / Origin check failed
            (`type: /problems/csrf-token`), or the session belongs to no
            workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            A condition blocks the closing and is not confirmed
            (`type: /problems/period-closing-blocked`, with `blockers`), or the
            month is already closed (`type: /problems/period-closure-conflict`).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/PeriodClosingBlockedProblem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            The month has not ended, a confirmation names an unknown condition
            or one that does not block, or a reason is empty or longer than 200
            characters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/periods/{period}/reopening:
    post:
      operationId: reopenPeriod
      summary: Reopen a closed month with a reason
      description: >-
        Owner only, checked on this request. Requires the current version of
        the closure and a reason, and writes an audit event in the same
        PostgreSQL transaction. The closure row is kept, stamped with when and
        why it was reopened.
      tags:
        - Period closures
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PeriodMonth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenPeriodRequest'
      responses:
        '200':
          description: The reopened closure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodClosure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Only the workspace owner may reopen a period, the CSRF / Origin
            check failed (`type: /problems/csrf-token`), or the session belongs
            to no workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The submitted version is stale (`type: /problems/stale-version`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TransactionPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The reason is empty or longer than 200 characters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cadran_session
      description: >-
        Same-origin session cookie issued by POST /api/v1/session. HttpOnly, so
        the browser attaches it automatically and no script can read it.
  responses:
    Unauthorized:
      description: The request carries no authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The endpoint requires an application/json request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body or a query parameter is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: The email or password is incorrect. Identical for an unknown email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        On sign-in, either the credentials were valid but the account is
        disabled (`type: about:blank`), or the CSRF / Origin check failed
        (`type: /problems/csrf-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceForbidden:
      description: The session is attached to no workspace, so there is nothing to read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        No such object in the calling workspace. Identical whether the
        identifier is unknown or belongs to another workspace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfFailure:
      description: 'The CSRF token or Origin check failed (`type: /problems/csrf-token`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CategoryMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CategoryOperationRefused:
      description: >-
        The impact assessment refuses the operation, or the request body is
        invalid. A refusal carries `type: /problems/category-operation-refused`
        and names every reason in `blockers`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CategoryOperationProblem'
    CategoryVersionConflict:
      description: The submitted version is stale or the label conflicts with an active sibling.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductModelMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TransactionMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TransactionPayloadTooLarge:
      description: The transaction JSON body exceeds 32 KiB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The JSON request body exceeds the 16 KiB mutation limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductModelPayloadTooLarge:
      description: The JSON request body exceeds the 32 KiB mutation limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OwnerNotProvisioned:
      description: >-
        The account behind the session no longer exists or has lost its
        password. The browser is signed out on its next session probe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProfileMutationForbidden:
      description: >-
        Either the CSRF / Origin check failed (`type: /problems/csrf-token`),
        or the authenticated session belongs to no workspace (`type: about:blank`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProfilePayloadTooLarge:
      description: The JSON request body exceeds the 4 KiB profile limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidDisplayName:
      description: >-
        The display name is empty, whitespace only, or longer than 100
        characters (`type: /problems/invalid-display-name`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeRefused:
      description: >-
        The change was refused. The `type` names which field caused it:
        `/problems/invalid-current-password`, `/problems/weak-password` when the
        new password is outside 12 to 128 characters, or
        `/problems/reused-password` when it equals the current one. Nothing is
        written in any of the three cases.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeThrottled:
      description: >-
        Too many current-password checks for this account. This budget is
        separate from sign-in throttling: exhausting it does not lock the owner
        out of signing in.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >-
        Too many failed sign-in attempts for this email and source address.
        Identical whether or not the email exists. Retry after the window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The owner password has already been defined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The password does not satisfy the account password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    IdempotencyReplayed:
      description: Present with the literal value `true` when the response is a completed idempotent replay.
      schema:
        type: string
        const: 'true'
    RetryAfterOneSecond:
      description: Present only for a retryable `/problems/idempotency.in_flight` response.
      schema:
        type: string
        const: '1'
  parameters:
    PeriodMonth:
      name: period
      in: path
      required: true
      description: A calendar month written `YYYY-MM`.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Double-submit CSRF token: the value of the `csrf_token` cookie from a
        prior safe response. Rejected with 403 if missing, altered, or expired.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Retries the same money-movement creation safely. Required when a
        transaction source is IMPORT or PROVIDER. A replayed successful
        response adds `Idempotency-Replayed: true`.
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: '^[A-Za-z0-9_.:-]+$'
    BusinessDate:
      name: asOf
      in: query
      required: false
      description: >-
        Business date the catalogue rules are resolved against, as an ISO 8601
        calendar day. Defaults to today. A rule is selected by this date and
        never by the current date, so reading a past statement shows the
        ceiling and rate that applied then.
      schema:
        type: string
        format: date
        examples:
          - '2026-09-02'
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    BudgetPeriodType:
      type: string
      enum: [MONTH, YEAR]
    BudgetPlanState:
      type: string
      enum: [DRAFT, ACTIVE, CLOSED]
    BudgetScopeType:
      type: string
      enum: [CATEGORY, GROUP, AXIS]
    BudgetValueType:
      type: string
      enum: [AMOUNT, RATIO]
    BudgetComparisonStatus:
      type: string
      enum: [WITHIN_TARGET, ON_TARGET, OVER_TARGET, NON_CALCULABLE]
    BudgetComparisonReason:
      type: string
      enum: [MISSING_TARGET, MIXED_ASSETS, NO_ACCOUNT, ZERO_CASH_INCOME]
    BudgetPeriod:
      type: string
      pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
    BudgetExactDecimal:
      type: string
      pattern: '^-?(0|[1-9]\d*)(\.\d{1,24})?$'
    BudgetPlan:
      type: object
      additionalProperties: false
      required: [id, periodType, period, assetCode, state, version]
      properties:
        id: { type: string, format: uuid }
        periodType: { $ref: '#/components/schemas/BudgetPeriodType' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        assetCode:
          type: string
          minLength: 2
          maxLength: 12
          pattern: '^[A-Z][A-Z0-9]+$'
        state: { $ref: '#/components/schemas/BudgetPlanState' }
        version: { type: integer, minimum: 1 }
    BudgetPlanPage:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetPlan' }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    BudgetTarget:
      type: object
      additionalProperties: false
      required: [id, planId, scopeType, scopeId, valueType, amount, ratio, version]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/BudgetScopeType' }
        scopeId: { type: string, minLength: 1, maxLength: 64 }
        valueType: { $ref: '#/components/schemas/BudgetValueType' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        ratio:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        version: { type: integer, minimum: 1 }
    BudgetTargetDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          scopeType,
          scopeId,
          scopeLabel,
          valueType,
          storedAmount,
          storedRatio,
          resolvedAmount,
          nonCalculableReason,
          overlapping,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/BudgetScopeType' }
        scopeId: { type: string, minLength: 1, maxLength: 64 }
        scopeLabel:
          type: string
          minLength: 1
          maxLength: 80
          description: Workspace-scoped category or group label, or a stable human-readable analytic axis label.
        valueType: { $ref: '#/components/schemas/BudgetValueType' }
        storedAmount:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        storedRatio:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        resolvedAmount:
          description: >-
            Response-only calculated decimal string. Ratio products preserve
            their natural scale up to 24 decimal places and are rounded
            HALF_UP to 24 places beyond that boundary; the result is never
            persisted.
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        nonCalculableReason:
          type: [string, 'null']
          enum: [MIXED_ASSETS, NO_ACCOUNT, ZERO_CASH_INCOME, null]
        overlapping: { type: boolean }
        version: { type: integer, minimum: 1 }
    BudgetPlanDetail:
      type: object
      additionalProperties: false
      required: [id, periodType, period, assetCode, state, version, targets]
      properties:
        id: { type: string, format: uuid }
        periodType: { $ref: '#/components/schemas/BudgetPeriodType' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        assetCode: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]+$' }
        state: { $ref: '#/components/schemas/BudgetPlanState' }
        version: { type: integer, minimum: 1 }
        targets:
          type: array
          items: { $ref: '#/components/schemas/BudgetTargetDetail' }
    BudgetComparison:
      type: object
      additionalProperties: false
      required:
        [
          targetId,
          scopeType,
          scopeId,
          scopeLabel,
          actual,
          actualReason,
          target,
          targetReason,
          variance,
          status,
          includedTransactions,
          pendingCount,
          overlapping,
          policy,
        ]
      properties:
        targetId: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/BudgetScopeType' }
        scopeId: { type: string, minLength: 1, maxLength: 64 }
        scopeLabel:
          type: string
          minLength: 1
          maxLength: 80
          description: Workspace-scoped category or group label, or a stable human-readable analytic axis label.
        actual:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        actualReason:
          oneOf:
            - $ref: '#/components/schemas/BudgetComparisonReason'
            - type: 'null'
        target:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        targetReason:
          oneOf:
            - $ref: '#/components/schemas/BudgetComparisonReason'
            - type: 'null'
        variance:
          description: Exact target minus actual amount; positive means budget remains.
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        status: { $ref: '#/components/schemas/BudgetComparisonStatus' }
        includedTransactions:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/BudgetComparisonTransaction' }
        pendingCount: { type: integer, minimum: 0, maximum: 500 }
        overlapping: { type: boolean }
        policy:
          type: string
          description: Human-readable built-in metric policy applied to this comparison; not a selectable or persisted identifier.
    BudgetComparisonTransaction:
      type: object
      additionalProperties: false
      required: [id, bookedOn, rawLabel, amount, assetCode]
      properties:
        id:
          type: string
          format: uuid
          description: Stable internal key for rendering; the interface presents the readable transaction fields instead.
        bookedOn: { type: string, format: date }
        rawLabel: { type: string, minLength: 1, maxLength: 140 }
        amount:
          description: Exact signed sum of this transaction's splits retained in the comparison scope.
          $ref: '#/components/schemas/BudgetExactDecimal'
        assetCode: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]+$' }
    BudgetComparisons:
      type: object
      additionalProperties: false
      required: [planId, period, assetCode, status, reason, comparisons]
      properties:
        planId: { type: string, format: uuid }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        assetCode: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]+$' }
        status: { type: string, enum: [AVAILABLE, NO_TARGETS] }
        reason:
          oneOf:
            - $ref: '#/components/schemas/BudgetComparisonReason'
            - type: 'null'
        comparisons:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BudgetComparison' }
    CreateBudgetPlanRequest:
      type: object
      additionalProperties: false
      required: [periodType, period, assetCode]
      properties:
        periodType: { $ref: '#/components/schemas/BudgetPeriodType' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        assetCode: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]+$' }
    UpdateBudgetPlanRequest:
      type: object
      additionalProperties: false
      required: [periodType, period, assetCode, version]
      properties:
        periodType: { $ref: '#/components/schemas/BudgetPeriodType' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        assetCode: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]+$' }
        version: { type: integer, minimum: 1 }
    CreateBudgetTargetRequest:
      type: object
      additionalProperties: false
      required: [scopeType, scopeId, valueType, amount, ratio]
      properties:
        scopeType: { $ref: '#/components/schemas/BudgetScopeType' }
        scopeId: { type: string, minLength: 1, maxLength: 64 }
        valueType: { $ref: '#/components/schemas/BudgetValueType' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        ratio:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
    UpdateBudgetTargetRequest:
      type: object
      additionalProperties: false
      required: [valueType, amount, ratio, version]
      properties:
        valueType: { $ref: '#/components/schemas/BudgetValueType' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        ratio:
          oneOf:
            - $ref: '#/components/schemas/BudgetExactDecimal'
            - type: 'null'
        version: { type: integer, minimum: 1 }
    FoundationStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - apiVersion
      properties:
        status:
          type: string
          const: ready
        apiVersion:
          type: string
          const: v1
    SessionState:
      type: object
      additionalProperties: false
      required:
        - provisioned
        - authenticated
        - setupRequired
        - user
        - workspace
      properties:
        provisioned:
          type: boolean
          description: True once an owner account exists on this server.
        authenticated:
          type: boolean
          description: True when an active, authenticated session is attached.
        setupRequired:
          type: boolean
          description: True when the provisioned owner has no password yet.
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        workspace:
          oneOf:
            - $ref: '#/components/schemas/SessionWorkspace'
            - type: 'null'
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    SessionWorkspace:
      type: object
      additionalProperties: false
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    DefinePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    OwnerProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: >-
            The firewall identifier. Read-only here: changing it would rewrite
            the subject of every open session.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Surrounding whitespace is trimmed before the length is measured, and
            the length counts Unicode code points.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: The password currently on the account, re-verified server-side.
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Must differ from the current password.
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          description: Cursor for the following page, or null on the last page.
          oneOf:
            - type: string
            - type: 'null'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorId
        - eventType
        - entityType
        - entityId
        - before
        - after
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          description: >-
            The user who performed the operation, or null when it had no
            authenticated actor - console provisioning and the first-run
            password flow.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        eventType:
          type: string
          examples:
            - session.opened
        entityType:
          type: string
          examples:
            - user
        entityId:
          type: string
          format: uuid
        before:
          $ref: '#/components/schemas/AuditDiffSide'
        after:
          $ref: '#/components/schemas/AuditDiffSide'
    AuditDiffSide:
      description: >-
        Bounded structured attributes, or null when the event has no such side.
        Sensitive attribute values are stored redacted, never in clear.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: 'null'
        - type: 'null'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of assets the reference holds.
          type: integer
          minimum: 0
    Asset:
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - displayName
        - storagePrecision
        - displayPrecision
        - roundingMode
        - displayStep
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
        kind:
          type: string
          enum:
            - FIAT
            - CRYPTO
        displayName:
          type: string
        storagePrecision:
          description: >-
            Decimal places a *submitted* figure of this asset may carry. A
            value beyond it is refused before persistence, never rounded in
            silence. It does not cap a derived figure: a conversion or a split
            keeps the full 24 decimals of the storage type.
          type: integer
          minimum: 0
          maximum: 24
        displayPrecision:
          description: >-
            Decimal places an interface or export shows. Never greater than
            `storagePrecision`, which JSON Schema cannot express here: showing
            more decimals than are stored would invent digits. A non-zero value
            smaller than the last shown decimal is displayed as such, never as
            a rounded zero.
          type: integer
          minimum: 0
          maximum: 24
        roundingMode:
          description: Rule the presentation boundary applies when it shows fewer decimals than are stored.
          type: string
          enum:
            - HALF_UP
            - HALF_EVEN
            - DOWN
        displayStep:
          $ref: '#/components/schemas/DecimalAmount'
    ProductPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          description: Number of products the catalogue holds.
          type: integer
          minimum: 0
    CeilingBasis:
      description: >-
        The figure a ceiling is compared against. Three of these four measures
        give a different verdict on the same account, so the amount alone
        decides nothing. A share savings plan is capped on the contributions
        paid into it, whatever the plan is worth, so a plan that grew past its
        ceiling through market value has broken no rule. A regulated passbook is
        capped on what was deposited, credited interest excluded, so a passbook
        carried past its ceiling by its own interest has broken no rule either.
        A combined ceiling is measured across the products sharing it and can be
        reached while no single account is.
      type: string
      enum:
        - NONE
        - BALANCE_EXCLUDING_INTEREST
        - TOTAL_BALANCE
        - CONTRIBUTIONS
        - COMBINED_CONTRIBUTIONS
    ProductCode:
      description: >-
        The stable identifier of a catalogue product. The catalogue is a global
        system reference with no workspace, so a code either exists for every
        workspace or for none.
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
      examples:
        - FR_LIVRET_A
    Product:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - jurisdiction
        - accountKind
        - wrapperKind
        - yieldKind
        - yieldGuaranteed
        - ceilingBasis
        - defaultGroupCode
        - capabilities
        - catalogVersion
        - archivedAt
        - asOf
        - rules
        - unavailableRuleKinds
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - FR_LIVRET_A
        displayName:
          type: string
        jurisdiction:
          description: ISO 3166-1 alpha-2 country code, or null for a model that belongs to no country.
          oneOf:
            - type: string
              pattern: '^[A-Z]{2}$'
            - type: 'null'
        accountKind:
          $ref: '#/components/schemas/AccountKind'
        wrapperKind:
          $ref: '#/components/schemas/ProductWrapperKind'
        yieldKind:
          $ref: '#/components/schemas/ProductYieldKind'
        yieldGuaranteed:
          description: >-
            Whether the rate the catalogue carries is owed to the holder. False
            for every market product, so no interface has to infer a promise
            from a product name.
          type: boolean
        ceilingBasis:
          $ref: '#/components/schemas/CeilingBasis'
        defaultGroupCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        capabilities:
          description: >-
            Explicit implemented behaviors enabled by this product. Consumers
            must use these values rather than infer behavior from the product
            code or display name.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductCapability'
        catalogVersion:
          type: integer
          minimum: 1
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        asOf:
          description: The business date the rules below were resolved against.
          type: string
          format: date
        rules:
          description: The rules covering `asOf`, at most one per rule kind.
          type: array
          items:
            $ref: '#/components/schemas/ProductRule'
        unavailableRuleKinds:
          description: >-
            Rule kinds this product is expected to carry and that no sourced
            period covers on `asOf`. An interface shows them as unavailable
            with their reason; it never shows them as zero.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
    ProductCapability:
      type: string
      enum:
        - SUPPORTS_BALANCE
        - SUPPORTS_TRANSACTIONS
        - SUPPORTS_INTEREST
        - SUPPORTS_HOLDINGS
        - SUPPORTS_TRADES
        - SUPPORTS_ARBITRAGE
        - SUPPORTS_CONTRIBUTIONS
        - SUPPORTS_FEES
        - SUPPORTS_TAX_TRACKING
        - SUPPORTS_LIABILITY
    ProductRuleKind:
      type: string
      enum:
        - DEPOSIT_CEILING
        - BALANCE_CEILING
        - CONTRIBUTION_CEILING
        - COMBINED_CONTRIBUTION_CEILING
        - ANNUAL_RATE
        - MIN_RATE
        - INTEREST_ACCRUAL_METHOD
        - ELIGIBILITY
        - TAX_REFERENCE
    ProductRule:
      description: >-
        One dated rule of one product, with the publication it was read from.
        Exactly one of `amount`, `percentage` and `text` is set, decided by the
        rule kind.
      type: object
      additionalProperties: false
      required:
        - kind
        - valueType
        - amount
        - percentage
        - text
        - validFrom
        - validTo
        - verification
        - verifiedOn
        - verifiedBy
        - source
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        percentage:
          description: >-
            A rate expressed in percent as the source published it: `1.7` reads
            1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          oneOf:
            - type: string
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
              examples:
                - '1.7'
            - type: 'null'
        text:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the source and to the translation
            catalogue.
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
              examples:
                - NO_REGULATORY_CONTRIBUTION_CEILING
            - type: 'null'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/RuleVerification'
        verifiedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        verifiedBy:
          oneOf:
            - type: string
            - type: 'null'
        source:
          $ref: '#/components/schemas/ProductRuleSource'
    ProductRuleSource:
      description: The official publication the value was read from.
      type: object
      additionalProperties: false
      required:
        - publisher
        - title
        - url
        - publishedOn
        - retrievedOn
      properties:
        publisher:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publishedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        retrievedOn:
          description: The day a maintainer actually opened the publication.
          type: string
          format: date
    ProductWrapperKind:
      description: >-
        The regulatory or contractual envelope a product sits in. Shared by the
        system catalogue and the product models a workspace describes itself.
      type: string
      enum:
        - NONE
        - REGULATED_SAVINGS
        - TAX_WRAPPER
        - SECURITIES_ACCOUNT
        - LIFE_INSURANCE
        - RETIREMENT
        - EMPLOYEE_SAVINGS
    ProductYieldKind:
      description: >-
        Where a product's return comes from. `MARKET` and `MANUAL_VALUATION`
        carry no rate rule at all: what they earn comes from their assets and
        flows. A model of one of those kinds cannot record a rate period.
      type: string
      enum:
        - NONE
        - REGULATED_RATE
        - CONTRACTUAL_FIXED
        - CONTRACTUAL_VARIABLE
        - MARKET
        - MANUAL_VALUATION
    RuleValueType:
      description: >-
        How a rule's value is written down. A `PERCENTAGE` is expressed in
        percent — `1.7` reads 1.7 % — so no consumer ever multiplies a rate to
        display it.
      type: string
      enum:
        - AMOUNT
        - PERCENTAGE
        - TEXT
    ProductNature:
      description: >-
        Which side of the balance sheet a model sits on, derived from its
        family. Net worth adds one and subtracts the other, so the side is
        stated rather than guessed from a name.
      type: string
      enum:
        - ASSET
        - LIABILITY
    ProductModelOrigin:
      description: >-
        Where a workspace product model came from. A model copied from the
        catalogue can be held against the publication it was copied from; one
        typed by hand answers only for itself. A duplicate stops following its
        source the moment it is created.
      type: string
      enum:
        - DECLARED
        - SYSTEM_PRODUCT
        - WORKSPACE_MODEL
    ProductModelPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - perPage
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductModel'
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ProductModel:
      description: >-
        A product model owned by one workspace, beside the read-only system
        catalogue. It carries its own dated rule periods and never a single
        current figure, so last year's statement resolves against last year's
        rate. It is only ever added to: there is no field edit and no period
        deletion.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - family
        - nature
        - wrapperKind
        - yieldKind
        - yieldGuaranteed
        - ceilingBasis
        - defaultGroupCode
        - valuationMode
        - capabilities
        - origin
        - basedOnProductCode
        - basedOnModelId
        - rules
        - editable
        - version
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        family:
          $ref: '#/components/schemas/AccountKind'
        nature:
          description: Stated by the server so no interface deduces it from a family name.
          $ref: '#/components/schemas/ProductNature'
        wrapperKind:
          $ref: '#/components/schemas/ProductWrapperKind'
        yieldKind:
          $ref: '#/components/schemas/ProductYieldKind'
        yieldGuaranteed:
          description: >-
            Whether a rate the model carries is owed to the holder. False for a
            revisable or market-driven yield, so no interface shows a rate as an
            acquired return.
          type: boolean
        ceilingBasis:
          $ref: '#/components/schemas/CeilingBasis'
        defaultGroupCode:
          oneOf:
            - type: string
              maxLength: 32
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        capabilities:
          description: >-
            The public activation contract. Clients never infer behaviour from
            a model name the holder chose.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductCapability'
        origin:
          $ref: '#/components/schemas/ProductModelOrigin'
        basedOnProductCode:
          description: >-
            The catalogue product this model was started from, kept for reading
            and never for resolving. Null unless `origin` is `SYSTEM_PRODUCT`.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        basedOnModelId:
          description: >-
            The model this one was duplicated from. Null unless `origin` is
            `WORKSPACE_MODEL`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        rules:
          description: >-
            Every dated period the model ever recorded, ordered by kind then by
            start date. Periods of the same kind never overlap.
          type: array
          items:
            $ref: '#/components/schemas/ProductModelRule'
        editable:
          description: False for an archived model, which is read-only.
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ProductModelRule:
      description: >-
        One dated period of a model. Exactly one value shape is set, decided by
        the rule kind: an `amount` for a ceiling, a bracket scale for a rate, a
        `text` token for a method or a term. A null `validTo` is in force with
        no known end and is never rendered as an expiry or a zero.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - valueType
        - amount
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            The slices a rate scale is made of, in order; empty for a ceiling or
            a term. They tile `[0, +∞[`: the first starts at zero, each starts
            where the previous ended, and the last runs without limit.
          type: array
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          type: string
          format: date
        validTo:
          oneOf:
            - type: string
              format: date
            - type: 'null'
    ProductModelRuleInput:
      description: >-
        One dated period as a client submits it. The body carries exactly these
        fields; the parser decides which value shape the kind requires and
        refuses the others. Decimals travel as canonical strings — a rate sent
        as a JSON number is refused rather than rounded.
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - amountAssetCode
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        amount:
          description: A ceiling amount as a canonical decimal string, or null for a non-ceiling kind.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        amountAssetCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]{1,11}$'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            One or more brackets for a rate kind, empty otherwise. A single rate
            is the one-bracket case running from zero without limit.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          type: string
          format: date
        validTo:
          oneOf:
            - type: string
              format: date
            - type: 'null'
