          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        kind:
          description: >-
            Must equal the `accountKind` or `family` the referenced product or
            model declares. That reference is the authority, so a tampered
            form cannot file a PEA as a plain savings account.
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            A catalogue product to create the account from, or null for an
            account described by hand or from a workspace model. Mutually
            exclusive with `productModelId`. An unknown product is refused by
            the use case and by a foreign key.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            A reusable workspace product model to create the account from, or
            null for an account described by hand or from a catalogue product.
            Mutually exclusive with `productCode`. The model must belong to
            the calling workspace; an unknown or foreign identifier is
            refused by the use case and by a foreign key. An archived model
            is refused by the use case only: the foreign key still accepts
            it, so an account already created from that model keeps resolving.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        primaryGroupId:
          description: >-
            Optional exclusive membership used by group weights. Null leaves
            the account ungrouped. A tag is never this field.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tagGroupIds:
          description: >-
            Extra group labels that never enter an exclusive denominator.
            Each identifier is unique and distinct from `primaryGroupId`.
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - kind
        - productCode
        - productModelId
        - institution
        - maskedIdentifier
        - valuationMode
        - liquidityLevel
        - includeInNetWorth
        - includeInEmergencyFund
        - openedOn
        - closedOn
        - version
        - primaryGroupId
        - tagGroupIds
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/AccountKind'
        productCode:
          description: >-
            Changing the product, the kind or the valuation mode sends the whole
            triple back through the catalogue. An account already used by
            history cannot change product at all. Mutually exclusive with
            `productModelId`.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            Changing the model, the kind or the valuation mode sends the whole
            triple back through the workspace's own models. An account
            already used by history cannot change model at all. Mutually
            exclusive with `productCode`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        institution:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        maskedIdentifier:
          oneOf:
            - type: string
              pattern: '^[A-Z0-9]{2,8}$'
            - type: 'null'
        valuationMode:
          $ref: '#/components/schemas/AccountValuationMode'
        liquidityLevel:
          $ref: '#/components/schemas/LiquidityLevel'
        includeInNetWorth:
          type: boolean
        includeInEmergencyFund:
          type: boolean
        openedOn:
          type: string
          format: date
        closedOn:
          description: A day on or after the opening date closes the account; null reopens it.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        version:
          type: integer
          minimum: 1
        primaryGroupId:
          description: >-
            Exclusive membership used by group weights, or null to leave the
            account ungrouped. An unknown or foreign group is refused.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tagGroupIds:
          description: Extra group labels that never enter an exclusive denominator.
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
    ArchiveAccountRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    AccountKind:
      description: >-
        What an account holds. Shared by the product catalogue and the accounts
        of a workspace, so a product-based account inherits exactly one of these
        kinds.
      type: string
      enum:
        - CURRENT
        - SAVINGS
        - PORTFOLIO
        - INSURANCE_CONTRACT
        - EMPLOYEE_BENEFIT
        - CASH
        - REAL_ASSET
        - LIABILITY
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
        - ARCHIVED
    AccountValuationMode:
      description: >-
        Where the value of the account comes from: recorded movements, dated
        valuations entered by hand, or portfolio positions. Only an account
        kind that holds positions accepts `PORTFOLIO`.
      type: string
      enum:
        - TRANSACTIONS
        - SNAPSHOTS
        - PORTFOLIO
    LiquidityLevel:
      type: string
      enum:
        - IMMEDIATE
        - SHORT_TERM
        - MEDIUM_TERM
        - LONG_TERM
        - ILLIQUID
    AccountRules:
      description: >-
        Everything in force for one account on one business date, split into
        the three questions that are answered differently: what caps it, what
        it earns, and under which terms.

        Each entry shows the same rule through every authority that states it,
        so a published figure and one the holder typed are never confused for
        one another.
      type: object
      additionalProperties: false
      required:
        - accountId
        - assetCode
        - productCode
        - productModelId
        - origin
        - asOf
        - ceilings
        - rates
        - terms
        - unavailableRuleKinds
      properties:
        accountId:
          type: string
          format: uuid
        assetCode:
          description: The unit the account is denominated in.
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
        productCode:
          description: >-
            The system product behind these rules: the one the account
            references, or the one the workspace model it follows was copied
            from. Null when no catalogue product is in the chain at all.
          oneOf:
            - $ref: '#/components/schemas/ProductCode'
            - type: 'null'
        productModelId:
          description: >-
            The workspace product model these rules were read from, or null
            unless `origin` is `WORKSPACE_MODEL`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        origin:
          $ref: '#/components/schemas/AccountRulesOrigin'
        asOf:
          description: >-
            The business date the rules were resolved on. Every value below
            answers for this date and for no other.
          type: string
          format: date
        ceilings:
          type: array
          items:
            $ref: '#/components/schemas/AccountCeilingRule'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/AccountRateRule'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AccountTermRule'
        unavailableRuleKinds:
          description: >-
            The rules this account is expected to carry and that no layer
            covers on this date. A gap is shown as unavailable and never as
            zero, which would read as "no ceiling" or "no interest" when the
            truth is that the value is unknown. A kind a local override answers
            for is not a gap. A catalogue figure for a kind the workspace
            model never carried is also a gap: the model stopped following
            the publication, and the catalogue layer is comparison only for
            kinds the model already states.
          type: array
          items:
            $ref: '#/components/schemas/ProductRuleKind'
    AccountRulesOrigin:
      description: >-
        Where the account reads the rules it inherits. An account that inherits
        no rule and an account whose rules could not be read are different
        answers, and neither of them means the account has no ceiling.
        `WORKSPACE_MODEL` rules carry no `verification` or `source`: nobody
        published them. Overrides are independent of this: an account keeps
        answering with the claims recorded against it whatever its origin.
      type: string
      enum:
        - NO_PRODUCT
        - SYSTEM_CATALOG
        - PRODUCT_WITHDRAWN
        - WORKSPACE_MODEL
    AccountRuleLayer:
      description: >-
        Which authority a resolved value came from. `CATALOG` is the system
        publication, `INHERITED` the workspace product model the account
        follows, `OVERRIDE` a value recorded against this account alone. A
        local claim wins over the model, which wins over the catalogue.
      type: string
      enum:
        - CATALOG
        - INHERITED
        - OVERRIDE
    AccountCeilingRule:
      description: >-
        One ceiling kind seen through every authority that states it, and which
        of them wins. At least one of `catalog`, `inherited` and `override` is
        present.
      type: object
      additionalProperties: false
      required:
        - kind
        - basis
        - countsCreditedInterest
        - spansSeveralAccounts
        - effectiveLayer
        - catalog
        - inherited
        - override
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        basis:
          $ref: '#/components/schemas/CeilingBasis'
        countsCreditedInterest:
          description: >-
            Whether interest credited by the institution counts towards the
            measure. When it does not, interest may carry the account past the
            amount without any rule being broken. It follows from the rule
            kind, so it is the same on every layer.
          type: boolean
        spansSeveralAccounts:
          description: >-
            Whether the ceiling is reached across the products sharing it, in
            which case reading this account alone cannot settle it.
          type: boolean
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountCeiling'
            - type: 'null'
    AccountCeiling:
      description: One authority's ceiling for the account, with its provenance.
      type: object
      additionalProperties: false
      required:
        - measurable
        - amount
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        measurable:
          description: >-
            False when the ceiling is published in another unit than the
            account is denominated in. No conversion is applied and no verdict
            is produced; the ceiling is reported as not comparable. An override
            is always measurable: a local claim is recorded in the account's
            own unit.
          type: boolean
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    AccountRateRule:
      description: >-
        One rate kind seen through every authority that states it, and which of
        them wins. At least one of `catalog`, `inherited` and `override` is
        present.
      type: object
      additionalProperties: false
      required:
        - kind
        - effectiveLayer
        - catalog
        - inherited
        - override
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountRate'
            - type: 'null'
    AccountRate:
      description: >-
        One authority's rate for the account, always as a bracket scale. The
        products the catalogue ships today resolve to a single bracket running
        from zero without limit, so a tiered product arrives later as data
        rather than as a second way of reading a rate.
      type: object
      additionalProperties: false
      required:
        - guaranteed
        - application
        - brackets
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        guaranteed:
          description: >-
            Whether the rate is owed to the holder. A revisable rate is only
            the rate published today and is never an acquired return. A local
            claim is graded by the promise of the product behind it, never by
            its own say-so.
          type: boolean
        application:
          $ref: '#/components/schemas/RateApplication'
        brackets:
          description: >-
            The slices the scale is made of, in order. They tile the amounts
            they cover: the first starts at zero, each one starts where the
            previous ended, and the last runs without limit.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    RateApplication:
      description: >-
        How the brackets combine over an amount. `MARGINAL` remunerates each
        slice at the rate of the bracket covering it, while `FLAT_BY_BRACKET`
        applies the rate of the bracket reached to the whole amount. A scale of
        4 % up to 10 000 then 2 % above pays 500 on 15 000 under the first and
        300 under the second, so a scale is never read without its mode. A
        single-bracket scale gives the same result under both.
      type: string
      enum:
        - MARGINAL
        - FLAT_BY_BRACKET
    RateBracket:
      description: >-
        One slice of a rate scale. The lower bound is included and the upper
        bound excluded, so two adjacent brackets leave no amount uncovered and
        count none twice.
      type: object
      additionalProperties: false
      required:
        - percentage
        - lowerBound
        - upperBound
      properties:
        percentage:
          description: >-
            The rate expressed in percent as the source published it: `1.7`
            reads 1.7 %. It travels as a canonical decimal string, so no client
            multiplies it and no binary float touches a rate.
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '1.7'
        lowerBound:
          description: First amount the bracket covers, included.
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '0'
        upperBound:
          description: >-
            First amount the bracket no longer covers, or null when the slice
            runs without limit.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
    AccountTermRule:
      description: >-
        One term kind — how interest accrues, who is eligible, which tax regime
        applies — seen through every authority that states it. At least one of
        `catalog`, `inherited` and `override` is present.
      type: object
      additionalProperties: false
      required:
        - kind
        - effectiveLayer
        - catalog
        - inherited
        - override
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        effectiveLayer:
          $ref: '#/components/schemas/AccountRuleLayer'
        catalog:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
        inherited:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
        override:
          oneOf:
            - $ref: '#/components/schemas/AccountTerm'
            - type: 'null'
    AccountTerm:
      description: >-
        One authority's rule for the account that states neither a ceiling nor
        a rate.
      type: object
      additionalProperties: false
      required:
        - token
        - validFrom
        - validTo
        - verification
        - source
        - claim
      properties:
        token:
          description: >-
            An uppercase token the interface translates, never a sentence:
            regulatory wording belongs to the publication it was read from and
            to the translation catalogue.
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          examples:
            - NO_REGULATORY_CONTRIBUTION_CEILING
        validFrom:
          $ref: '#/components/schemas/RuleValidFrom'
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        verification:
          $ref: '#/components/schemas/DeclaredOrVerified'
        source:
          $ref: '#/components/schemas/DeclaredOrSourced'
        claim:
          $ref: '#/components/schemas/AccountRuleClaimOrNull'
    DeclaredOrVerified:
      description: >-
        Null for a value nobody published — one read from a workspace product
        model, and one claimed by an account override. Grading the freshness of
        a figure the holder typed would fabricate a provenance it never had.
      oneOf:
        - $ref: '#/components/schemas/RuleVerification'
        - type: 'null'
    DeclaredOrSourced:
      description: >-
        Null for a value nobody published — one read from a workspace product
        model, and one claimed by an account override. There is no publication
        to name.
      oneOf:
        - $ref: '#/components/schemas/ProductRuleSource'
        - type: 'null'
    AccountRuleClaimOrNull:
      description: >-
        Who claimed this value and why, or null when nobody claimed it and it
        was inherited or published.
      oneOf:
        - $ref: '#/components/schemas/AccountRuleClaim'
        - type: 'null'
    AccountRuleClaim:
      description: >-
        The local claim behind an override, without repeating the value the
        rule already carries.
      type: object
      additionalProperties: false
      required:
        - overrideId
        - reason
        - authorId
        - recordedAt
      properties:
        overrideId:
          type: string
          format: uuid
        reason:
          description: >-
            Why this account diverges from what it inherits, in the holder's
            own words. It is required: an unexplained local figure sitting
            beside a published one is exactly the drift an override has to make
            visible instead of hiding.
          type: string
          minLength: 1
          maxLength: 200
        authorId:
          description: Who recorded the claim. It comes from the session, never from a request body.
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
    AccountRuleOverridePage:
      type: object
      additionalProperties: false
      required:
        - overrides
      properties:
        overrides:
          description: >-
            Every override ever recorded on the account, withdrawn ones
            included, ordered by rule kind then by the day each period starts.
          type: array
          items:
            $ref: '#/components/schemas/AccountRuleOverride'
    AccountRuleOverride:
      description: >-
        One dated rule value recorded against a single account, in front of
        whatever that account inherits.
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - kind
        - valueType
        - amount
        - text
        - application
        - brackets
        - validFrom
        - validTo
        - standing
        - withdrawnAt
        - withdrawnBy
        - reason
        - authorId
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        valueType:
          description: >-
            Which of `amount`, `text` and `brackets` carries the value. It
            follows from the rule kind, so a client reads the one its kind
            declares instead of guessing.
          $ref: '#/components/schemas/RuleValueType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
            - type: 'null'
        application:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RateBracket'
            - type: 'null'
        validFrom:
          description: First day the claim applies.
          type: string
          format: date
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        standing:
          description: >-
            False once the override has been withdrawn. A withdrawn claim stops
            answering on every date, past ones included, and the inherited rule
            of each of those dates takes over again. It is kept here because
            the trail of what was claimed is the provenance an override exists
            to preserve.
          type: boolean
        withdrawnAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        withdrawnBy:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 200
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
    RecordAccountRuleOverrideRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - amountAssetCode
        - text
        - rateApplication
        - brackets
        - validFrom
        - validTo
        - reason
      properties:
        kind:
          $ref: '#/components/schemas/ProductRuleKind'
        amount:
          description: >-
            The ceiling amount as a canonical decimal string, for a kind whose
            value is an amount, and null otherwise. It never travels as a JSON
            number, which a binary float would already have rounded.
          oneOf:
            - type: string
              pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
            - type: 'null'
        amountAssetCode:
          description: >-
            The unit the amount is denominated in. It must be the unit the
            account itself is held in: a local ceiling is checked against this
            account and nothing else, and no conversion ships with the
            application.
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]{1,11}$'
            - type: 'null'
        text:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
              maxLength: 64
            - type: 'null'
        rateApplication:
          oneOf:
            - $ref: '#/components/schemas/RateApplication'
            - type: 'null'
        brackets:
          description: >-
            The slices of a rate scale, for a rate kind, and an empty list
            otherwise. A single rate is the one-bracket case of the same shape.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RateBracket'
        validFrom:
          description: First day the claim applies.
          type: string
          format: date
        validTo:
          $ref: '#/components/schemas/RuleValidTo'
        reason:
          description: Why this account diverges from what it inherits.
          type: string
          minLength: 1
          maxLength: 200
    EmptyRequest:
      description: >-
        A body carrying no field. It is still required and still narrowed, so a
        replayed form cannot smuggle one in and a client cannot believe a
        payload it sent was applied.
      type: object
      additionalProperties: false
    RuleValidFrom:
      description: First day this catalogue vouches for the value.
      type: string
      format: date
    RuleValidTo:
      description: >-
        Last day covered, inclusive, or null while no revision has closed the
        period. An open end is in force for every later business date; it is
        never an expiry.
      oneOf:
        - type: string
          format: date
        - type: 'null'
    RuleVerification:
      description: >-
        How much the value can be trusted today, independently of the business
        date it applies to. `STALE` means nobody has re-read the source across
        a full revision cycle.
      type: string
      enum:
        - VERIFIED
        - STALE
        - UNVERIFIED
    CategoryType:
      type: string
      enum:
        - EXPENSE
        - INCOME
    AnalyticAxes:
      type: array
      uniqueItems: true
      maxItems: 6
      items:
        type: string
        enum:
          - DISCRETIONARY
          - ESSENTIAL
          - FIXED
          - PERSONAL
          - PROFESSIONAL
          - VARIABLE
    DecimalAmount:
      description: >-
        A financial decimal. Every amount, quantity, price and rate travels as
        a canonical decimal string paired with its asset code; a native JSON
        number is forbidden, because parsing one would put a binary float back
        into a financial value.
      type: object
      additionalProperties: false
      required:
        - value
        - assetCode
      properties:
        value:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
          examples:
            - '230.5688'
        assetCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,11}$'
          examples:
            - EUR
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
