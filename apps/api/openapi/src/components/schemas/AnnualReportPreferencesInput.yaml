type: object
additionalProperties: false
required:
  - columns
  - incompleteMonths
  - version
properties:
  columns:
    type: array
    uniqueItems: true
    maxItems: 40
    items:
      type: string
      maxLength: 80
  incompleteMonths:
    $ref: ./AnnualIncompleteMonths.yaml
  goalMarks:
    description: >-
      Omitted keeps the stored setting, or false when no preference has been
      saved.
    type: boolean
  version:
    description: The version the caller last read. A stale one is refused with 409.
    type: integer
    minimum: 0
