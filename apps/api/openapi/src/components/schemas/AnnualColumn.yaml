type: object
additionalProperties: false
required:
  - id
  - label
  - kind
  - assetCode
  - known
properties:
  id:
    type: string
  label:
    type: string
  kind:
    $ref: ./AnnualColumnKind.yaml
  assetCode:
    type:
      - string
      - 'null'
  known:
    description: >-
      False when the category, group or account of the column no longer resolves:
      its cells are then null and its label is a fallback.
    type: boolean
  institution:
    description: >-
      Institution of an account column, shown under its label; null for any
      other column.
    type:
      - string
      - 'null'
  parentLabel:
    description: >-
      Label of the immediate parent group of a sub-group column, shown beside
      its name (`label` is the sub-group name only); null for a root group and
      for any other column.
    type:
      - string
      - 'null'
