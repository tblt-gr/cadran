type: object
additionalProperties: false
required:
  - id
  - email
  - displayName
properties:
  id:
    type: string
    format: uuid
  email:
    type: string
    format: email
    description: >-
      The firewall identifier. Read-only here: changing it would rewrite the
      subject of every open session.
  displayName:
    type: string
    minLength: 1
    maxLength: 100
