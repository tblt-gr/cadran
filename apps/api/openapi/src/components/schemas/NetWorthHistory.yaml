type: object
additionalProperties: false
required:
  - asOf
  - granularity
  - points
  - period
  - firstDataMonth
  - truncated
  - delta
properties:
  asOf:
    type: string
    format: date
  granularity:
    type: string
    enum:
      - MONTH
  period:
    description: Resolved period, or null for a legacy months-only request.
    type:
      - string
      - 'null'
    enum:
      - ALL
      - LAST_12_MONTHS
      - YTD
      - null
  firstDataMonth:
    description: >-
      Earliest active source month within the calling workspace on or before
      asOf.
    type:
      - string
      - 'null'
    pattern: ^[0-9]{4}-[0-9]{2}$
  truncated:
    description: True when ALL was limited to the latest 60 months.
    type: boolean
  delta:
    $ref: ./NetWorthDelta.yaml
  points:
    description: Oldest first. The last point is the requested day itself.
    type: array
    minItems: 1
    maxItems: 60
    items:
      $ref: ./NetWorthPoint.yaml
