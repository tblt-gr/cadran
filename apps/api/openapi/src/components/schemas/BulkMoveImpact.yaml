type: object
additionalProperties: false
required:
  - accountId
  - label
  - assetCode
  - delta
  - from
  - to
properties:
  accountId:
    type: string
    format: uuid
  label:
    type: string
  assetCode:
    type: string
  delta:
    type: string
    description: >-
      Exact signed decimal: the change of the account balance once every
      eligible transaction has moved. `0` for a date change alone.
  from:
    type: string
    format: date
    description: The earliest day from which the balance changes.
  to:
    type:
      - string
      - 'null'
    format: date
    description: >-
      The latest affected day, set only for a date change alone, where the
      balance differs only between `from` and `to`.
