x-cadran-asset-scope: Amounts are in the asset of the goal (`assetCode` of the goal).
type: object
additionalProperties: false
required:
  - goalId
  - month
  - periodicity
  - direction
  - valueType
  - goalVersion
  - scheduleMode
  - provisional
  - metricPolicy
  - target
  - achieved
  - expected
  - gap
  - remaining
  - excess
  - status
  - progressRatio
  - progressRatioDisplay
  - pace
  - paceGap
  - reason
  - quality
  - months
properties:
  goalId:
    type: string
    format: uuid
  month:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  periodicity:
    type: string
    const: YEARLY
  direction:
    $ref: ./GoalDirection.yaml
  valueType:
    oneOf:
      - $ref: ./GoalValueType.yaml
      - type: 'null'
  goalVersion:
    type:
      - integer
      - 'null'
    minimum: 1
    maximum: 50
  scheduleMode:
    type:
      - string
      - 'null'
    enum:
      - LINEAR
      - CUSTOM
      - null
  provisional:
    type: boolean
  metricPolicy:
    $ref: ./GoalStatusMetricPolicy.yaml
  target:
    $ref: ./GoalStatusValue.yaml
  achieved:
    $ref: ./GoalStatusValue.yaml
  expected:
    $ref: ./GoalStatusValue.yaml
  gap:
    description: >-
      The achieved value against the target, signed so that a positive gap is in
      the goal's favour; null when the status is not calculable.
    $ref: ./GoalStatusValue.yaml
  remaining:
    $ref: ./GoalStatusValue.yaml
  excess:
    $ref: ./GoalStatusValue.yaml
  status:
    $ref: ./GoalEvaluationStatus.yaml
  progressRatio:
    $ref: ./GoalStatusValue.yaml
  progressRatioDisplay:
    $ref: ./GoalStatusValue.yaml
  pace:
    description: >-
      Where the achieved value stands against what the schedule expects by the
      read month, the tolerance never applying; null without a schedule or an
      achieved value.
    oneOf:
      - $ref: ./GoalEvaluationPace.yaml
      - type: 'null'
  paceGap:
    description: >-
      The achieved value against the expected one, signed so that a positive gap
      is in the goal's favour; null when either is.
    $ref: ./GoalStatusValue.yaml
  reason:
    $ref: ./GoalStatusReason.yaml
  quality:
    type: string
    enum:
      - COMPLETE
      - PROVISIONAL
      - PARTIAL
      - EMPTY
  months:
    description: Month-by-month detail required on the dedicated status endpoint.
    type: array
    maxItems: 12
    items:
      $ref: ./GoalStatusMonth.yaml
