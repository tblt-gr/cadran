type: object
additionalProperties: false
required:
  - id
  - label
  - periodicity
  - startPeriod
  - endPeriod
  - metric
  - direction
  - scope
  - assetCode
  - currentVersion
  - version
  - warnings
  - status
properties:
  id:
    type: string
    format: uuid
  label:
    type: string
    minLength: 1
    maxLength: 80
  periodicity:
    $ref: ./GoalPeriodicity.yaml
  startPeriod:
    $ref: ./GoalPeriod.yaml
  endPeriod:
    oneOf:
      - $ref: ./GoalPeriod.yaml
      - type: 'null'
  metric:
    $ref: ./GoalMetric.yaml
  direction:
    $ref: ./GoalDirection.yaml
  scope:
    $ref: ./GoalScope.yaml
  assetCode:
    type: string
    minLength: 2
    maxLength: 12
    pattern: ^[A-Z][A-Z0-9]+$
  currentVersion:
    $ref: ./GoalVersion.yaml
  version:
    type: integer
    minimum: 1
  warnings:
    type: array
    uniqueItems: true
    items:
      type: string
      enum:
        - REFERENCE_ARCHIVED
  status:
    oneOf:
      - $ref: ./GoalStatusSummary.yaml
      - type: 'null'
