description: >-
  Repeated text predicates combined globally. AND requires every predicate
  result; OR requires at least one. A positive counterparty predicate is false
  when the counterparty is absent, before optional predicate negation.
type: object
additionalProperties: false
required:
  - combinator
  - predicates
properties:
  combinator:
    type: string
    enum:
      - AND
      - OR
  predicates:
    type: array
    minItems: 1
    maxItems: 20
    items:
      $ref: ./RuleTextPredicate.yaml
