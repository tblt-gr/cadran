x-cadran-asset-scope: Amounts are in `reference.assetCode`.
type: object
additionalProperties: false
required:
  - asOf
  - liquidAssets
  - reference
  - targetMonths
  - target
  - requiredAmount
  - gap
  - coveredMonths
  - coveredMonthsDisplay
  - reason
  - quality
properties:
  asOf:
    type: string
    format: date
  liquidAssets:
    type: object
    additionalProperties: false
    required:
      - value
      - assetCode
      - reason
      - accounts
    properties:
      value:
        description: >-
          Sum of the signed valuations of the eligible accounts; null when any
          is missing or assets differ.
        type:
          - string
          - 'null'
      assetCode:
        type:
          - string
          - 'null'
      reason:
        type:
          - string
          - 'null'
        enum:
          - NO_ELIGIBLE_ACCOUNT
          - MISSING_VALUATION
          - MIXED_ASSETS
          - null
      accounts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - label
            - value
            - assetCode
            - valuedOn
            - stale
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
            value:
              type:
                - string
                - 'null'
            assetCode:
              type:
                - string
                - 'null'
            valuedOn:
              type:
                - string
                - 'null'
              format: date
            stale:
              description: >-
                The valuation is more than 31 days older than the as-of date; it
                is still counted.
              type: boolean
  reference:
    type: object
    additionalProperties: false
    required:
      - start
      - end
      - usedMonths
      - expectedMonths
      - excludedMonths
      - average
      - averageReason
      - assetCode
      - months
    properties:
      start:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      end:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      usedMonths:
        type: integer
        minimum: 0
        maximum: 24
      expectedMonths:
        type: integer
        minimum: 1
        maximum: 24
      excludedMonths:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - month
            - reason
          properties:
            month:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            reason:
              type: string
              enum:
                - NO_DATA
                - PROVISIONAL
                - FUTURE
                - NULL_VALUE
      average:
        type:
          - string
          - 'null'
      averageReason:
        type:
          - string
          - 'null'
        description: >-
          NO_REFERENCE_MONTH, MISSING_MONTH_VALUE, MIXED_ASSETS or
          MIXED_METRIC_POLICIES.
      assetCode:
        description: >-
          Asset of the essential expenses; the average, required amount and gap
          are expressed in it. Null when no month carries an amount.
        type:
          - string
          - 'null'
      months:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - month
            - value
          properties:
            month:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            value:
              type:
                - string
                - 'null'
  targetMonths:
    $ref: ./EmergencyFundTargetMonths.yaml
  target:
    type: object
    additionalProperties: false
    required:
      - mode
      - amount
      - ratio
      - impliedMonths
      - incomeAverage
    properties:
      mode:
        $ref: ./EmergencyFundTargetMode.yaml
      amount:
        oneOf:
          - $ref: ./GoalAmountInput.yaml
          - type: 'null'
      ratio:
        oneOf:
          - $ref: ./EmergencyFundTargetRatio.yaml
          - type: 'null'
      impliedMonths:
        description: >-
          Months of essential expenses the required amount stands for, one
          decimal; null when the average is unknown.
        type:
          - string
          - 'null'
      incomeAverage:
        description: >-
          Average monthly cash income over the twelve complete months before the
          as-of month, used by INCOME_RATIO.
        type:
          - string
          - 'null'
  requiredAmount:
    description: >-
      Target months x average, the fixed amount, or ratio x 12 x average monthly
      income, according to target.mode. Known whenever its inputs are.
    type:
      - string
      - 'null'
  gap:
    description: >-
      Liquid assets - required amount, in reference.assetCode; positive is a
      surplus, negative a shortfall. Null when either side is unknown or the two
      assets differ.
    type:
      - string
      - 'null'
  coveredMonths:
    type:
      - string
      - 'null'
  coveredMonthsDisplay:
    description: Covered months rounded HALF_UP to one decimal.
    type:
      - string
      - 'null'
  reason:
    description: >-
      Why covered months is null (NO_ELIGIBLE_ACCOUNT, MISSING_VALUATION,
      MIXED_ASSETS, NO_REFERENCE_MONTH, MISSING_MONTH_VALUE,
      MIXED_METRIC_POLICIES, ZERO_ESSENTIAL_EXPENSES,
      NEGATIVE_ESSENTIAL_EXPENSES, or NO_REFERENCE_INCOME for an income target),
      or STALE_VALUATION when it is computed from a stale valuation.
    type:
      - string
      - 'null'
  quality:
    type: string
    enum:
      - COMPLETE
      - PARTIAL
      - NOT_CALCULABLE
