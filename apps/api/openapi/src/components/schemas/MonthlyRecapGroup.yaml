description: >-
  One group of the recap at N: its roll-up (own accounts plus every descendant)
  and its direct total (accounts whose primary group is exactly this group),
  each with its share of eligible net worth. A secondary label never adds a
  second total for the same account.
type: object
additionalProperties: false
required:
  - color
  - groupId
  - label
  - parentId
  - depth
  - value
  - previousValue
  - share
  - directValue
  - directPreviousValue
  - directShare
  - hasChildren
properties:
  color:
    type: string
    pattern: ^#[0-9A-F]{6}$
  groupId:
    type: string
    format: uuid
  label:
    type: string
    minLength: 1
    maxLength: 80
  parentId:
    type:
      - string
      - 'null'
    format: uuid
  depth:
    type: integer
    minimum: 1
    maximum: 8
  value:
    oneOf:
      - $ref: ./NetWorthAmount.yaml
      - type: 'null'
  previousValue:
    description: The same roll-up at N-1; null when N-1 net worth is not calculable.
    oneOf:
      - $ref: ./NetWorthAmount.yaml
      - type: 'null'
  share:
    $ref: ./NetWorthShare.yaml
  directValue:
    description: >-
      The signed total at N of the accounts whose primary group is exactly this
      group, descendants excluded. Direct totals of all groups plus the
      ungrouped bucket equal eligible net worth. Null when not calculable.
    oneOf:
      - $ref: ./NetWorthAmount.yaml
      - type: 'null'
  directPreviousValue:
    description: The same direct total at N-1; null when N-1 is not calculable.
    oneOf:
      - $ref: ./NetWorthAmount.yaml
      - type: 'null'
  directShare:
    $ref: ./NetWorthShare.yaml
  hasChildren:
    description: True when the group has at least one active sub-group.
    type: boolean
