type: object
additionalProperties: false
required:
  - type
  - label
  - archived
properties:
  type:
    $ref: ./GoalScopeType.yaml
  id:
    type: string
    format: uuid
  axis:
    type: string
    enum:
      - DISCRETIONARY
      - ESSENTIAL
      - FIXED
      - PERSONAL
      - PROFESSIONAL
      - VARIABLE
  label:
    type: string
    minLength: 1
    maxLength: 100
  archived:
    type: boolean
