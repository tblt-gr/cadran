type: object
additionalProperties: false
required:
  - operationId
  - type
  - date
  - amount
properties:
  operationId:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - DEPOSIT
      - WITHDRAWAL
      - SECURITY_TRANSFER_IN
      - SECURITY_TRANSFER_OUT
  date:
    type: string
    format: date
  amount:
    description: >-
      Signed amount in the account asset; null for a security transfer, which
      has no value.
    type:
      - string
      - 'null'
    pattern: ^-?[0-9]+(?:\.[0-9]{1,24})?$
