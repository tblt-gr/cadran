type: object
additionalProperties: false
required:
  - items
  - nextCursor
  - hasMore
  - pageSize
properties:
  items:
    type: array
    items:
      $ref: ./Transaction.yaml
  nextCursor:
    description: Cursor for the following page, or null on the last page.
    oneOf:
      - type: string
      - type: 'null'
  hasMore:
    type: boolean
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
