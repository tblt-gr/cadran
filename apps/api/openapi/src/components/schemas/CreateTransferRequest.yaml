type: object
additionalProperties: false
required:
  - sourceAccountId
  - targetAccountId
  - sourceAmount
  - targetAmount
  - state
  - bookedOn
  - valueOn
  - label
  - note
  - fee
properties:
  sourceAccountId:
    type: string
    format: uuid
  targetAccountId:
    type: string
    format: uuid
  sourceAmount:
    description: A positive magnitude; the server negates it for the source leg.
    $ref: ./DecimalAmount.yaml
  targetAmount:
    description: >-
      A positive magnitude in the target account asset. Required when the two
      accounts do not share an asset; optional otherwise, where it defaults to
      the source magnitude.
    oneOf:
      - $ref: ./DecimalAmount.yaml
      - type: 'null'
  state:
    type: string
    enum:
      - PENDING
      - BOOKED
  bookedOn:
    type: string
    format: date
  valueOn:
    oneOf:
      - type: string
        format: date
      - type: 'null'
  label:
    type: string
    minLength: 1
    maxLength: 140
    description: Becomes the raw label of both legs and the fee, unsuffixed in storage.
  note:
    oneOf:
      - type: string
        minLength: 1
        maxLength: 500
      - type: 'null'
  fee:
    description: >-
      A negative amount in the source account asset, producing a separate FEE
      transaction on the source account. Null when there is no fee.
    oneOf:
      - $ref: ./DecimalAmount.yaml
      - type: 'null'
