type: object
additionalProperties: false
required:
  - id
  - name
  - isin
  - ticker
  - status
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
    maxLength: 120
  isin:
    oneOf:
      - type: string
        pattern: ^[A-Z]{2}[A-Z0-9]{9}[0-9]$
      - type: 'null'
  ticker:
    oneOf:
      - type: string
        pattern: ^[A-Z0-9][A-Z0-9.\-]{0,11}$
      - type: 'null'
  status:
    $ref: ./InstrumentStatus.yaml
