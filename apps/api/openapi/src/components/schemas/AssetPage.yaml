type: object
additionalProperties: false
required:
  - items
  - page
  - pageSize
  - total
properties:
  items:
    type: array
    items:
      $ref: ./Asset.yaml
  page:
    type: integer
    minimum: 1
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
  total:
    description: Number of assets the reference holds.
    type: integer
    minimum: 0
