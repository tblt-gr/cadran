type: object
additionalProperties: false
required:
  - kind
  - valuationId
  - date
  - totalValue
  - detail
  - flags
properties:
  kind:
    type: string
    enum:
      - VALUATION
      - OPENING
  valuationId:
    type:
      - string
      - 'null'
    format: uuid
  date:
    type: string
    format: date
  totalValue:
    type: string
    pattern: ^-?[0-9]+(?:\.[0-9]{1,24})?$
  detail:
    type:
      - string
      - 'null'
    enum:
      - TOTAL
      - POSITIONS
      - null
  flags:
    type: array
    items:
      type: string
      enum:
        - STALE_PRICES
        - CASH_DIFFERENCE
        - OBSERVED_TOTAL_DIFFERENCE
        - POSITIONS_CHANGED
        - NEGATIVE_SECURITIES_VALUE
