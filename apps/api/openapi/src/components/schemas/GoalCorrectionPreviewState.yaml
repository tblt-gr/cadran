x-cadran-asset-scope: Amounts are in the asset of the goal (`assetCode` of the goal).
type: object
additionalProperties: false
required:
  - goalVersion
  - expected
  - status
  - pace
properties:
  goalVersion:
    type:
      - integer
      - 'null'
    minimum: 1
    maximum: 50
  expected:
    $ref: ./GoalStatusValue.yaml
  status:
    $ref: ./GoalEvaluationStatus.yaml
  pace:
    description: >-
      The pace of a yearly amount goal; null for a monthly goal, without a
      schedule or without an achieved value.
    type:
      - string
      - 'null'
    enum:
      - AHEAD
      - BEHIND
      - ON_TRACK
      - OVER_PACE
      - null
