type: object
additionalProperties: false
required:
  - value
  - assetCode
  - reason
properties:
  value:
    type:
      - string
      - 'null'
    pattern: ^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
  assetCode:
    type:
      - string
      - 'null'
    pattern: ^[A-Z][A-Z0-9]{1,11}$
  reason:
    oneOf:
      - $ref: ./MonthlyProjectionReason.yaml
      - type: 'null'
