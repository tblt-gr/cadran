type: object
additionalProperties: false
required:
  - status
  - apiVersion
  - version
properties:
  status:
    type: string
    const: ready
  apiVersion:
    type: string
    const: v1
  version:
    type: string
    minLength: 1
    description: >-
      Release the running image was built from (for example `1.0.0`), or
      `unknown` when the build did not provide one.
