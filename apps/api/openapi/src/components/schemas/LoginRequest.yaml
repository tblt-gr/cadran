type: object
additionalProperties: false
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
  password:
    type: string
    format: password
  remember:
    type: boolean
    default: false
    description: >-
      Keep the session cookie for 14 days instead of until the browser closes.
      Meant for a personal device.
