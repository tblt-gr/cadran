type: object
additionalProperties: false
required:
  - items
  - page
  - pageSize
  - total
properties:
  items:
    type: array
    maxItems: 100
    items:
      $ref: ./GoalSummary.yaml
  page:
    type: integer
    minimum: 1
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
  total:
    type: integer
    minimum: 0
    description: Goals matching the filters across all pages.
