description: >-
  Why one account raises a closing condition. NO_BALANCE_IN_MONTH and
  BALANCE_NOT_RECONCILED belong to UNRECONCILED_ACCOUNT, DISCREPANCY to
  UNEXPLAINED_DISCREPANCY, NO_MONTH_END_VALUATION and VALUATION_NOT_CALCULATED
  to MISSING_PORTFOLIO_VALUATION.
type: string
enum:
  - NO_BALANCE_IN_MONTH
  - BALANCE_NOT_RECONCILED
  - DISCREPANCY
  - NO_MONTH_END_VALUATION
  - VALUATION_NOT_CALCULATED
