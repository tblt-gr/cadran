x-cadran-asset-scope: The asset is the `assetCode` of the report column the cell belongs to.
description: >-
  The whole selected detailed period for one column, over every month of every
  year of the range (not only the `COMPLETE` years the summary row is restricted
  to): total, average, median, minimum and maximum, respecting flow, stock and
  rate semantics and the selected `incompleteMonths` setting. `total` is null
  with `NOT_ADDITIVE` for a stock column, which has no sum. A column whose
  months mix policy versions or assets is null throughout, with
  `MIXED_METRIC_POLICIES` or `MIXED_ASSETS`.
type: object
additionalProperties: false
required:
  - total
  - totalReason
  - average
  - averageReason
  - median
  - medianReason
  - minimum
  - maximum
  - extremesReason
  - quality
properties:
  total:
    type:
      - string
      - 'null'
  totalReason:
    type:
      - string
      - 'null'
  average:
    type:
      - string
      - 'null'
  averageReason:
    type:
      - string
      - 'null'
  median:
    type:
      - string
      - 'null'
  medianReason:
    type:
      - string
      - 'null'
  minimum:
    oneOf:
      - $ref: ./MultiYearDetailedExtreme.yaml
      - type: 'null'
  maximum:
    oneOf:
      - $ref: ./MultiYearDetailedExtreme.yaml
      - type: 'null'
  extremesReason:
    type:
      - string
      - 'null'
  quality:
    $ref: ./AnnualAggregateQuality.yaml
