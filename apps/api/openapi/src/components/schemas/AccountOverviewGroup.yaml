description: >-
  The heading of one table: a primary group, or the ungrouped section when
  `groupId` is null (then label, colors and parent are null).
type: object
additionalProperties: false
required:
  - groupId
  - label
  - parentId
  - depth
  - color
  - resolvedColor
  - defaultColor
  - memberCount
  - total
  - totalReason
  - share
  - quality
  - orderVersion
  - archivedAt
  - parentLabel
properties:
  groupId:
    oneOf:
      - type: string
        format: uuid
      - type: 'null'
  label:
    type:
      - string
      - 'null'
  parentId:
    oneOf:
      - type: string
        format: uuid
      - type: 'null'
  depth:
    type: integer
    minimum: 0
    maximum: 8
  color:
    type:
      - string
      - 'null'
    pattern: ^#[0-9A-F]{6}$
  resolvedColor:
    type:
      - string
      - 'null'
    pattern: ^#[0-9A-F]{6}$
  defaultColor:
    type:
      - string
      - 'null'
    pattern: ^#[0-9A-F]{6}$
  parentLabel:
    description: >-
      Label of the immediate parent group in `PRIMARY` mode; always null in
      `PARENT` mode and for a root or the ungrouped section.
    type:
      - string
      - 'null'
  memberCount:
    description: >-
      Members visible under the lifecycle filters, the whole subtree in `PARENT`
      mode.
    type: integer
    minimum: 0
  total:
    oneOf:
      - $ref: ./NetWorthAmount.yaml
      - type: 'null'
  totalReason:
    oneOf:
      - $ref: ./NetWorthReason.yaml
      - type: 'null'
  share:
    $ref: ./NetWorthShare.yaml
  quality:
    description: Kept for compatibility; the interface no longer reads it.
    $ref: ./ValuationQuality.yaml
  orderVersion:
    description: >-
      Order version of this group (sum over the subtree in `PARENT` mode); moves
      send the row `groupOrderVersion` instead.
    type: integer
    minimum: 0
  archivedAt:
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
