description: >-
  An amount in the asset of the goal, or a ratio with its percent display for a
  rate.
oneOf:
  - type: object
    additionalProperties: false
    required:
      - value
      - assetCode
    properties:
      value:
        $ref: ./GoalStatusValue.yaml
      assetCode:
        type: string
        pattern: ^[A-Z0-9]{2,12}$
  - type: object
    additionalProperties: false
    required:
      - ratio
      - percentDisplay
    properties:
      ratio:
        $ref: ./GoalStatusValue.yaml
      percentDisplay:
        type: string
        pattern: ^-?\d+\.\d{2}$
