description: >-
  The money-weighted return of the period; the table shows periodRate, never the
  annualized rate.
type: object
additionalProperties: false
required:
  - annualizedRate
  - periodRate
  - shortPeriod
  - quality
  - reasons
properties:
  annualizedRate:
    $ref: ./PortfolioAnnualRate.yaml
  periodRate:
    $ref: ./PortfolioAnnualRate.yaml
  shortPeriod:
    type: boolean
  quality:
    $ref: ./PortfolioAnnualQuality.yaml
  reasons:
    type: array
    items:
      $ref: ./PortfolioPerformanceReason.yaml
