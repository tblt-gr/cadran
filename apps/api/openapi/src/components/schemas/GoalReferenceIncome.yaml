type: object
additionalProperties: false
required:
  - month
  - value
  - usableMonths
  - windowStart
  - windowEnd
  - reason
properties:
  month:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  value:
    oneOf:
      - type: string
        pattern: ^(0|[1-9]\d*)(\.\d{1,24})?$
      - type: 'null'
  usableMonths:
    type: integer
    minimum: 0
    maximum: 12
  windowStart:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  windowEnd:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  reason:
    type:
      - string
      - 'null'
    enum:
      - NO_REFERENCE_INCOME
      - null
