type: object
additionalProperties: false
required:
  - value
  - usableMonths
  - windowStart
  - windowEnd
properties:
  value:
    $ref: ./GoalStatusValue.yaml
  usableMonths:
    type: integer
    minimum: 0
    maximum: 12
  windowStart:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  windowEnd:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
