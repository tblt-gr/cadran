allOf:
  - $ref: ./PortfolioAnnualPeriodLine.yaml
  - type: object
    required:
      - month
      - status
      - endCash
      - modifiedDietzIndex
    properties:
      month:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      status:
        type: string
        enum:
          - CALCULATED
          - NOT_CALCULABLE
      endCash:
        $ref: ./PortfolioPerformanceAmount.yaml
      modifiedDietzIndex:
        description: >-
          100 x product of (1 + R) over the months chained so far, two decimals;
          null before the chain starts and from the first month without a
          Modified Dietz return.
        type:
          - string
          - 'null'
        pattern: ^-?[0-9]+\.[0-9]{2}$
