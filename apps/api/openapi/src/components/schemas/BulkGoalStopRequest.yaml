type: object
additionalProperties: false
required:
  - items
properties:
  items:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        - goalId
        - expectedVersion
        - lastPeriod
      properties:
        goalId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        lastPeriod:
          $ref: ./GoalPeriod.yaml
