type: object
additionalProperties: false
required:
  - source
  - operator
  - value
  - negated
properties:
  source:
    type: string
    enum:
      - RAW_LABEL
      - NORMALIZED_LABEL
      - COUNTERPARTY
  operator:
    type: string
    enum:
      - EQUALS
      - CONTAINS
      - REGEX
  value:
    type: string
    minLength: 1
    maxLength: 120
  negated:
    type: boolean
    description: Inverts this predicate result before the group combinator is applied.
