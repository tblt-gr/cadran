type: object
additionalProperties: false
required:
  - min
  - max
  - assetCode
properties:
  min:
    oneOf:
      - type: string
        pattern: ^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      - type: 'null'
  max:
    oneOf:
      - type: string
        pattern: ^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      - type: 'null'
  assetCode:
    type: string
    pattern: ^[A-Z][A-Z0-9]{1,11}$
