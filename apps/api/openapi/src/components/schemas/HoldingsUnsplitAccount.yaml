    type: string
    format: uuid
  label:
    type: string
  reason:
    type: string
    enum:
      - TOTAL_VALUATION
      - PARTIAL_VALUATION
      - NO_VALUATION
  securitiesValue:
    $ref: ./HoldingsNullableDecimal.yaml
