type: object
additionalProperties: false
required:
  - id
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  isin:
    type:
      - string
      - 'null'
  ticker:
    type:
      - string
      - 'null'
  status:
    $ref: ./InstrumentStatus.yaml
  quantityPrecision:
    type: integer
    minimum: 0
    maximum: 12
  pricePrecision:
    type: integer
    minimum: 0
    maximum: 12
