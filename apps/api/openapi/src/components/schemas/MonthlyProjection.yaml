type: object
additionalProperties: false
required:
  - month
  - periodStart
  - periodEnd
  - state
  - quality
  - pendingCount
  - cashIncome
  - nonCashBenefits
  - benefitSpending
  - budgetExpenses
  - uncategorizedExpenses
  - budgetSurplus
  - savingsTransfers
  - cashSavingsRate
  - savingsInflows
  - savingsWithdrawals
  - netSavingsTransfers
  - netSavingsRate
  - beginningNetWorth
  - endNetWorth
  - netWorthDelta
  - beginningNetWorthState
  - accounts
  - reconciliationStatus
  - metricPolicy
  - includesUpcoming
  - upcomingCount
properties:
  includesUpcoming:
    type: boolean
    description: >-
      True when the caller asked for the planned (upcoming) transactions of the
      month to be counted.
  upcomingCount:
    type: integer
    minimum: 0
    description: >-
      Number of planned transactions counted in the figures; 0 unless
      `includesUpcoming`.
  month:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  periodStart:
    type: string
    format: date
  periodEnd:
    type: string
    format: date
  state:
    type: string
    enum:
      - COMPLETE
      - EMPTY
      - PENDING
  quality:
    description: >-
      Worst valuation quality across the same N−1 month-end and effective-N
      net-worth reads used by the published KPI figures.
    $ref: ./ValuationQuality.yaml
  pendingCount:
    type: integer
    minimum: 0
  cashIncome:
    $ref: ./MonthlyProjectionMetric.yaml
  nonCashBenefits:
    $ref: ./MonthlyProjectionMetric.yaml
  benefitSpending:
    $ref: ./MonthlyProjectionMetric.yaml
  metricPolicy:
    $ref: ./MetricPolicyReference.yaml
  budgetExpenses:
    $ref: ./MonthlyProjectionMetric.yaml
  uncategorizedExpenses:
    $ref: ./MonthlyProjectionMetric.yaml
  budgetSurplus:
    $ref: ./MonthlyProjectionMetric.yaml
  savingsTransfers:
    $ref: ./MonthlyProjectionMetric.yaml
  cashSavingsRate:
    $ref: ./MonthlyProjectionMetric.yaml
  savingsInflows:
    $ref: ./MonthlyProjectionMetric.yaml
  savingsWithdrawals:
    $ref: ./MonthlyProjectionMetric.yaml
  netSavingsTransfers:
    $ref: ./MonthlyProjectionMetric.yaml
  netSavingsRate:
    $ref: ./MonthlyProjectionMetric.yaml
  beginningNetWorth:
    $ref: ./MonthlyProjectionMetric.yaml
  endNetWorth:
    $ref: ./MonthlyProjectionMetric.yaml
  netWorthDelta:
    $ref: ./MonthlyProjectionMetric.yaml
  beginningNetWorthState:
    type: string
    enum:
      - POSITIVE
      - ZERO
      - NEGATIVE
      - NON_CALCULABLE
  accounts:
    type: array
    maxItems: 500
    items:
      $ref: ./MonthlyProjectionAccount.yaml
  reconciliationStatus:
    type: string
    enum:
      - RECONCILED
      - UNRECONCILED
      - NO_ACCOUNTS
