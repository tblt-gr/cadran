type: object
additionalProperties: false
required:
  - amount
  - amountAssetCode
  - comment
  - version
properties:
  amount:
    type: string
    pattern: ^(?!-0(?:\.0+)?$)-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
  amountAssetCode:
    type: string
    pattern: ^[A-Z][A-Z0-9]{1,11}$
  comment:
    oneOf:
      - type: string
        minLength: 1
        maxLength: 200
      - type: 'null'
  version:
    type: integer
    minimum: 1
