type: object
description: >-
  A system bucket (SECURITIES, CASH, UNSPECIFIED, OTHERS) carries its key as
  label, which the client translates. Instrument names, class, region and
  currency codes are carried as they are.
additionalProperties: false
required:
  - key
  - label
  - value
  - share
properties:
  key: &ref_0
    type: string
  label: *ref_0
  value: &ref_1
    type:
      - string
      - 'null'
    pattern: ^-?[0-9]+(?:\.[0-9]{1,24})?$
  share: *ref_1
