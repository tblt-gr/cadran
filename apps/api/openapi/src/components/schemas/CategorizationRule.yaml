type: object
additionalProperties: false
required:
  - id
  - label
  - priority
  - accountScope
  - conditions
  - targetCategoryId
  - targetCategoryLabel
  - targetAxes
  - targetCounterparty
  - effectiveFrom
  - effectiveTo
  - active
  - deactivatedReason
  - appliedCount
  - version
  - createdAt
  - updatedAt
  - archivedAt
properties:
  id:
    type: string
    format: uuid
  label:
    type: string
    minLength: 1
    maxLength: 80
  priority:
    type: integer
    minimum: 1
    maximum: 999
  accountScope:
    type: array
    items:
      type: string
      format: uuid
  conditions:
    $ref: ./CategorizationRuleConditions.yaml
  targetCategoryId:
    type: string
    format: uuid
  targetCategoryLabel:
    type: string
  targetAxes:
    $ref: ./AnalyticAxes.yaml
  targetCounterparty:
    oneOf:
      - type: string
      - type: 'null'
  effectiveFrom:
    type: string
    format: date
  effectiveTo:
    oneOf:
      - type: string
        format: date
      - type: 'null'
  active:
    type: boolean
  deactivatedReason:
    oneOf:
      - type: string
        enum:
          - USER
          - PATTERN_BUDGET_EXCEEDED
          - CATEGORY_ARCHIVED
      - type: 'null'
  appliedCount:
    type: integer
    minimum: 0
  version:
    type: integer
    minimum: 1
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  archivedAt:
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
