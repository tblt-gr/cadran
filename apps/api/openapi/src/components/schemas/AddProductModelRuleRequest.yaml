description: >-
  A dated period to record, plus the version of the model it is applied to. The
  field set is exact.
type: object
additionalProperties: false
required:
  - kind
  - amount
  - amountAssetCode
  - text
  - rateApplication
  - brackets
  - validFrom
  - validTo
  - version
properties:
  kind:
    $ref: ./ProductRuleKind.yaml
  amount:
    oneOf:
      - type: string
        pattern: ^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      - type: 'null'
  amountAssetCode:
    oneOf:
      - type: string
        pattern: ^[A-Z][A-Z0-9]{1,11}$
      - type: 'null'
  text:
    oneOf:
      - type: string
        pattern: ^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$
      - type: 'null'
  rateApplication:
    oneOf:
      - $ref: ./RateApplication.yaml
      - type: 'null'
  brackets:
    type: array
    maxItems: 20
    items:
      $ref: ./RateBracket.yaml
  validFrom:
    type: string
    format: date
  validTo:
    oneOf:
      - type: string
        format: date
      - type: 'null'
  version:
    type: integer
    minimum: 1
