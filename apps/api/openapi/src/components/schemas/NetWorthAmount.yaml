description: >-
  One published figure: the exact source decimal with its asset, and the same
  figure rounded at the asset display boundary. A non-zero source that would
  display as zero is reported as below the step instead of becoming an invented
  nil.
type: object
additionalProperties: false
required:
  - value
  - assetCode
  - display
  - belowDisplayStep
properties:
  value:
    type: string
    pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
  assetCode:
    type: string
    pattern: ^[A-Z][A-Z0-9]{1,11}$
  display:
    oneOf:
      - $ref: ./DecimalAmount.yaml
      - type: 'null'
  belowDisplayStep:
    type: boolean
