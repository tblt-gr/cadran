type: object
additionalProperties: false
required:
  - interest
  - effectivePercentage
  - reachedPercentage
  - reachedLowerBound
  - rateShiftsAboveFirstBracket
  - unsettledReason
properties:
  interest:
    oneOf:
      - type: string
      - type: 'null'
  effectivePercentage:
    oneOf:
      - type: string
      - type: 'null'
  reachedPercentage:
    type: string
  reachedLowerBound:
    type: string
  rateShiftsAboveFirstBracket:
    type: boolean
  unsettledReason:
    oneOf:
      - type: string
        enum:
          - ZERO_BALANCE
          - NEGATIVE_BALANCE
      - type: 'null'
