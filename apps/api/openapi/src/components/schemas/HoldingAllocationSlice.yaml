type: object
description: >-
  A system bucket (UNSPLIT, UNSPECIFIED) carries its key as label, which the
  client translates. Instrument names, account labels, class and region codes are
  carried as they are.
additionalProperties: false
required:
  - key
  - label
  - value
  - share
properties:
  key:
    type: string
  label:
    type: string
  value:
    $ref: ./HoldingsDecimal.yaml
  share:
    $ref: ./HoldingsNullableDecimal.yaml
