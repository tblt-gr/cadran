type: object
additionalProperties: false
required:
  - currentPassword
  - newPassword
properties:
  currentPassword:
    type: string
    format: password
    description: The password currently on the account, re-verified server-side.
  newPassword:
    type: string
    format: password
    minLength: 12
    maxLength: 128
    description: Must differ from the current password.
