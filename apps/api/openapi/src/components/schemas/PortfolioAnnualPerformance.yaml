type: object
additionalProperties: false
required:
  - accountId
  - assetCode
  - year
  - methodVersion
  - costPolicy
  - availableYears
  - months
  - yearTotal
  - inception
properties:
  accountId:
    type: string
    format: uuid
  assetCode:
    type: string
  year:
    type: integer
  methodVersion:
    type: string
    enum:
      - PERF-1
  costPolicy:
    type: string
    enum:
      - NET_OF_FEES_AND_TAXES
  availableYears:
    type: object
    additionalProperties: false
    required:
      - from
      - to
      - years
    properties:
      from:
        type: integer
      to:
        type: integer
      years:
        description: >-
          Years that contain at least one active operation, oldest first. A
          history with none keeps the current year.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
  months:
    type: array
    minItems: 12
    maxItems: 12
    items:
      $ref: ./PortfolioAnnualMonthLine.yaml
  yearTotal:
    $ref: ./PortfolioAnnualPeriodLine.yaml
  inception:
    $ref: ./PortfolioAnnualPeriodLine.yaml
