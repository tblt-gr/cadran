description: >-
  The change was refused. The `type` names which field caused it:
  `/problems/invalid-current-password`, `/problems/weak-password` when the new
  password is outside 12 to 128 characters, `/problems/common-password` when it
  is one of the most common passwords, or `/problems/reused-password` when it
  equals the current one. Nothing is written in any of the four cases.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
