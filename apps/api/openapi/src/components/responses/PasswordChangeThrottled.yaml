description: >-
  Too many current-password checks for this account. This budget is separate
  from sign-in throttling: exhausting it does not lock the owner out of signing
  in.
headers:
  Retry-After:
    description: Seconds to wait before retrying.
    schema:
      type: integer
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
