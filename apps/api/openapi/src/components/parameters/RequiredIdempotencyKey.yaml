name: Idempotency-Key
in: header
required: true
description: >-
  Retries the same write safely for seven days: the same key with the same body
  replays the first response without a second row, the same key with another
  body answers 409. A replayed successful response adds `Idempotency-Replayed:
  true`.
schema:
  type: string
  minLength: 16
  maxLength: 255
  pattern: ^[A-Za-z0-9_.:-]+$
