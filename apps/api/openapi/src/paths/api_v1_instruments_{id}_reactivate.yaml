post:
  operationId: reactivateInstrument
  summary: Reactivate an investment instrument
  description: Returns an inactive instrument to the active list and picker.
  tags:
    - Portfolio
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - $ref: ../components/parameters/InstrumentId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/InstrumentVersionRequest.yaml
  responses:
    '200':
      description: The active instrument.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Instrument.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/AccountMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: The version is stale or the instrument is already active.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/InstrumentProblem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: The request payload is invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/InstrumentProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
