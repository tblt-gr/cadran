get:
  operationId: listProducts
  summary: Read the system product catalogue on a business date
  description: >-
    Requires an authenticated session. Returns the financial product models the
    application ships with — Livret A, LDDS, LEP, PEA, CTO, life insurance —
    each resolved against the business date asked for. The catalogue is global
    and read-only: it belongs to no workspace, every session reads the same
    rows, and a regulatory value changes through a reviewed migration rather
    than through a request.
  tags:
    - Catalog
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/ListRevision.yaml
    - name: page
      in: query
      required: false
      description: Page number, between 1 and 1000. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    - name: pageSize
      in: query
      required: false
      description: Page size, between 1 and 100. Defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - $ref: ../components/parameters/BusinessDate.yaml
  responses:
    '200':
      description: One page of the product catalogue, resolved on the business date.
      headers:
        X-List-Revision:
          $ref: ../components/headers/ListRevision.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProductPage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '409':
      $ref: ../components/responses/ListRevisionStale.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
