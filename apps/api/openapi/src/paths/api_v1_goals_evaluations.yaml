get:
  operationId: listGoalEvaluations
  x-cadran-bounded: >-
    At most 120 months (30 years with the YEAR granularity) and 500 goals are
    evaluated from one load of the reporting months; the months never go past
    the current month.
  summary: Evaluate the goals applying to each month and year of a range
  description: >-
    Resolves, for every month (monthly goals) and calendar year (yearly goals)
    of the range up to the current month, the goal applying to each metric and
    scope, its target, the achieved value, the signed gap and a status computed
    by the server. Among overlapping goals of the same periodicity, metric and
    scope, the latest start wins, then the latest creation; the hidden ones are
    listed in `overrides`. `granularity` limits the work to the monthly items
    (`MONTH`, `years` empty), the yearly items (`YEAR`, `months` empty) or both
    (`BOTH`, the default). A range over 120 months (30 calendar years with
    `YEAR`), with `from` after `to`, or with an unknown granularity answers 400.
  tags:
    - Goals
  security:
    - sessionCookie: []
  parameters:
    - name: from
      in: query
      required: true
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
    - name: to
      in: query
      required: true
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
    - name: granularity
      in: query
      required: false
      schema:
        type: string
        enum:
          - MONTH
          - YEAR
          - BOTH
        default: BOTH
  responses:
    '200':
      description: >-
        One entry per month of the range up to the current month, and one per
        calendar year touched by it.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GoalEvaluations.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
