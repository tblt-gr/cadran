get:
  operationId: listAccounts
  summary: List the calling workspace financial accounts
  description: >-
    Requires an authenticated session. The workspace is resolved from the
    session and cannot be selected by a query parameter. Closed and archived
    accounts are omitted unless explicitly requested.
  tags:
    - Accounts
  security:
    - sessionCookie: []
  parameters:
    - name: includeArchived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: includeClosed
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: kind
      in: query
      required: false
      description: Restrict results to one account kind.
      schema:
        $ref: ../components/schemas/AccountKind.yaml
    - $ref: ../components/parameters/BusinessDate.yaml
  responses:
    '200':
      description: One page of accounts from the calling workspace.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountPage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: createAccount
  x-cadran-idempotency: >-
    Account labels are unique in the workspace: a replay answers 409 and creates
    nothing.
  summary: Create a financial account in the calling workspace
  description: >-
    Creates an account with its denomination, kind, lifecycle dates, valuation
    mode and inclusion policies. An optional exclusive group and extra tags may
    be set at creation; omitting the group (`null`) leaves the account
    ungrouped. The asset code must exist in the read-only system reference. An
    optional `productCode` backs the account with a catalogue product; the
    submitted kind and valuation mode are then checked against what that product
    declares. The mutation requires the same-origin CSRF token.
  tags:
    - Accounts
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateAccountRequest.yaml
  responses:
    '201':
      description: The account was created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Account.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/AccountMutationForbidden.yaml
    '409':
      description: >-
        An active account already uses the normalized label (`type:
        /problems/account-label-taken`).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The denomination, kind, product reference, valuation mode, masked
        identifier or lifecycle dates are invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
