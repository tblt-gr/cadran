post:
  operationId: archiveCategorizationRule
  summary: Archive a categorization rule optimistically
  tags:
    - Transactions
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/VersionRequest.yaml
  responses:
    '200':
      description: The archived rule.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CategorizationRule.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: The submitted version is stale.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: The archive request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
