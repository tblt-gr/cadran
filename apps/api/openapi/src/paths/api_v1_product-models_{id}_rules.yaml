post:
  operationId: addProductModelRule
  summary: Record a dated period on a product model
  description: >-
    Editing a model is adding to it. Recording a period appends it and closes
    the open-ended period of the same kind it supersedes the day before it
    starts, so a past statement still resolves against the figures that covered
    it. Nothing already recorded is rewritten or removed, and there is no
    endpoint that edits or deletes a period. Optimistic versioning guards the
    write. The mutation requires the same-origin CSRF token.
  tags:
    - Catalog
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AddProductModelRuleRequest.yaml
  responses:
    '200':
      description: The model with the recorded period.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProductModel.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/ProductModelMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: >-
        The submitted version is stale (`type: /problems/stale-version`). Reload
        the model and reapply.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/ProductModelPayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The period is invalid, contradicts a recorded period of the same kind,
        or the model is archived and read-only (`type:
        /problems/product-model-archived`).
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: ../components/schemas/Problem.yaml
              - $ref: ../components/schemas/AmountInputProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
