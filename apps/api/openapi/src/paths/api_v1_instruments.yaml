get:
  operationId: listInstruments
  summary: List the calling workspace investment instruments
  description: >-
    Lists active instruments by default. Search matches a contained name, ticker
    prefix or ISIN prefix without crossing the caller workspace.
  tags:
    - Portfolio
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/ListRevision.yaml
    - name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
          - all
        default: active
    - name: instrumentType
      in: query
      required: false
      description: Keeps only instruments of this type before pagination and counting.
      schema:
        $ref: ../components/schemas/InstrumentType.yaml
    - name: currencyCode
      in: query
      required: false
      description: >-
        Keeps only instruments quoted in this canonical uppercase asset code.
        The filter applies before paging.
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9]{1,11}$
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: One bounded page of workspace instruments.
      headers:
        X-List-Revision:
          $ref: ../components/headers/ListRevision.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InstrumentPage.yaml
    '400':
      description: The query, status or pagination is outside its bounds.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/InstrumentProblem.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '409':
      $ref: ../components/responses/ListRevisionStale.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: createInstrument
  summary: Create a reviewed manual investment instrument
  description: >-
    Creates a workspace instrument after validating its identifiers and FIAT
    currency. Similar ticker or name candidates require an explicit duplicate
    confirmation; an existing ISIN can never be overridden.
  tags:
    - Portfolio
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateInstrumentRequest.yaml
  responses:
    '201':
      description: The reviewed manual instrument was created.
      headers:
        Idempotency-Replayed:
          $ref: ../components/headers/IdempotencyReplayed.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Instrument.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/AccountMutationForbidden.yaml
    '409':
      description: >-
        The ISIN exists, similar candidates need confirmation, or the 500-row
        limit is reached.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/InstrumentProblem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: A field or identifier is invalid, missing or unsupported.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/InstrumentProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
