get:
  operationId: listCategorizationRules
  summary: List categorization rules in resolution order
  tags:
    - Transactions
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/ListRevision.yaml
    - name: includeArchived
      in: query
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    '200':
      description: Rules ordered by priority, creation time and identifier.
      headers:
        X-List-Revision:
          $ref: ../components/headers/ListRevision.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CategorizationRulePage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '409':
      $ref: ../components/responses/ListRevisionStale.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: createCategorizationRule
  summary: Create an active categorization rule
  tags:
    - Transactions
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateCategorizationRuleRequest.yaml
  responses:
    '201':
      description: The created rule.
      headers:
        Idempotency-Replayed:
          $ref: ../components/headers/IdempotencyReplayed.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CategorizationRule.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      description: >-
        The Idempotency-Key was reused with a different body, or the first
        request is still in flight.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: The rule, a reference, or a regular expression is invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
