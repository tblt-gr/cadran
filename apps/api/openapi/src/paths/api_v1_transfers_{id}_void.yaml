post:
  operationId: voidTransfer
  summary: Void a transfer and its legs together, without deleting them
  description: >-
    Voids both legs and the fee, if any, in one PostgreSQL transaction. An
    already-voided transfer cannot be voided again.
  tags:
    - Transfers
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/VoidTransferRequest.yaml
  responses:
    '200':
      description: The voided transfer.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Transfer.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/TransactionMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: >-
        The submitted version is stale (`type: /problems/stale-version`) or the
        transfer is already voided (`type: /problems/transfer-conflict`). A
        write that touches a closed period is refused with one stable problem,
        whichever the use case (`type: /problems/period-closed`).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/TransactionPayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The request is invalid. A write that would put a current, savings or cash
        account below zero is refused (`type:
        /problems/account-balance-insufficient`, with `accountId`, `field` and
        `firstNegativeOn`) and writes nothing.
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: ../components/schemas/Problem.yaml
              - $ref: ../components/schemas/AccountBalanceInsufficientProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
