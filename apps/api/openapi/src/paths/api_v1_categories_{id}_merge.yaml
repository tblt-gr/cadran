post:
  operationId: mergeCategory
  summary: Fold a category into another one
  description: >-
    Moves the direct children under the target, records the redirection that
    makes the history of the source read as the target's, and archives the
    source. The three happen in one transaction or not at all.
  tags:
    - Categories
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MergeCategoryRequest.yaml
  responses:
    '200':
      description: The archived source category and its redirection.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Category.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/CategoryMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/CategoryVersionConflict.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../components/responses/CategoryOperationRefused.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
