put:
  operationId: changeOwnerPassword
  x-cadran-idempotency: >-
    A replay is refused because the current password no longer matches once the
    first call succeeded; attempts are throttled.
  summary: Change the signed-in owner's password
  description: >-
    Requires the current password in the same request, verified server-side and
    rate-limited on its own budget, independently of sign-in throttling. On
    success every other session is revoked and the calling session is issued a
    new identifier, so the acting browser stays signed in and a cookie captured
    earlier stops working. A same-origin browser mutation: it must send the
    X-CSRF-TOKEN header matching the csrf_token cookie, with an Origin of this
    server.
  tags:
    - Profile
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '204':
      description: >-
        The password is replaced. The response carries a new session cookie;
        refetch GET /api/v1/session.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/ProfileMutationForbidden.yaml
    '409':
      $ref: ../components/responses/OwnerNotProvisioned.yaml
    '413':
      $ref: ../components/responses/ProfilePayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../components/responses/PasswordChangeRefused.yaml
    '429':
      $ref: ../components/responses/PasswordChangeThrottled.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
