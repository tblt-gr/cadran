post:
  operationId: bulkStopGoals
  x-cadran-idempotency: >-
    Every item carries expectedVersion. Stale replays fail atomically; deleted
    identifiers return generic 404.
  x-cadran-bounded: One to 100 distinct goal identifiers.
  tags:
    - Goals
  security:
    - sessionCookie: []
  summary: Atomically stop selected goals after their chosen last periods
  description: >-
    Authorizes all identifiers in the caller workspace, locks them in stable
    order and applies the whole selection in one transaction. A stale,
    inaccessible, invalid or closed-period conflict cancels every write. Stop
    preserves prior evaluations, follows each goal periodicity for lastPeriod,
    never extends an end and removes definitions beyond the new end. Delete
    removes the goal and its history and refuses goals covering any closed
    month. Accessible row errors identify goalId and field; inaccessible goals
    return indistinguishable 404 errors.
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BulkGoalStopRequest.yaml
  responses:
    '204':
      description: The complete selection was stopped.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: A stale version or closed-period conflict; no item was changed.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/GoalProblem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: Invalid batch or last period; no item was changed.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/GoalProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
