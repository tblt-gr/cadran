get:
  operationId: readMultiYearReport
  summary: Read the multi-year comparison report of the calling workspace
  description: >-
    One row per year of the range, oldest first, each cell equal to the matching
    aggregate of the annual report for the same year and incomplete-month
    setting. Values are nominal and carry no inflation adjustment. By default
    the displayed range ends in the current year and starts no earlier than 15
    years before it. `availableFrom` separately exposes the workspace's true
    first data year. An explicit range spans at most 15 years, oldest year at
    most the newest.
  tags:
    - Reporting
  security:
    - sessionCookie: []
  parameters:
    - name: from
      in: query
      required: false
      description: >-
        Oldest displayed year. Defaults to the later of the workspace's first
        data year and the 15-year lower bound.
      schema:
        type: integer
        minimum: 1900
    - name: to
      in: query
      required: false
      description: Newest year of the range. Defaults to the current workspace-local year.
      schema:
        type: integer
        minimum: 1900
    - name: incompleteMonths
      in: query
      required: false
      description: Overrides the saved incomplete-month setting for this request only.
      schema:
        $ref: ../components/schemas/AnnualIncompleteMonths.yaml
  responses:
    '200':
      description: The multi-year report.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MultiYearReport.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '422':
      description: >-
        `from > to` or a bound outside 1900..the current year (`type:
        /problems/invalid-year-range`), the range spans more than 15 years
        (`type: /problems/range-too-large`), or the workspace exceeds a bounded
        aggregate limit.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
