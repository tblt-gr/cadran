get:
  operationId: readNetWorth
  x-cadran-bounded: >-
    Contributions come from at most 500 accounts and allocation from at most 500
    groups; a larger workspace is refused.
  summary: Read the explainable net worth of the calling workspace
  description: >-
    Requires an authenticated session. The workspace is resolved from the
    session and cannot be selected by a query parameter. The total is the sum of
    the signed values of the accounts included in net worth and open on the
    requested day; a liability carries the negative sign while its stored amount
    stays positive. The total is null with a reason whenever it cannot be
    produced — a missing valuation, no eligible account, or eligible accounts
    denominated in more than one asset — and is never an invented `0`. The delta
    and the change rate fail independently: a real movement against a zero or
    negative base keeps its amount and publishes no rate. Every contributing
    account and every exclusive group weight travels with the figure so the
    result can be challenged.
  tags:
    - Net worth
  security:
    - sessionCookie: []
  parameters:
    - name: asOf
      in: query
      required: false
      description: Business day the aggregate is answered for. Defaults to today.
      schema:
        type: string
        format: date
    - name: comparedTo
      in: query
      required: false
      description: >-
        Earlier business day the delta is measured against. Defaults to the same
        day one month earlier, kept inside that month.
      schema:
        type: string
        format: date
  responses:
    '200':
      description: The net worth of the calling workspace on the requested day.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NetWorth.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '422':
      description: >-
        The workspace holds more accounts or more groups than one aggregate
        reads (`type: /problems/net-worth-scope-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
