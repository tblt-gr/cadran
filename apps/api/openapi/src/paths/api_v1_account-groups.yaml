get:
  operationId: listAccountGroups
  summary: List the calling workspace account groups
  description: >-
    Requires an authenticated session. The workspace is resolved from the
    session and cannot be selected by a query parameter. Archived rows are
    omitted unless explicitly requested. Published shares stay null with an
    explicit reason until valuations exist; they are never `0%`.
  tags:
    - Account groups
  security:
    - sessionCookie: []
  parameters:
    - name: includeArchived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: parentEligible
      in: query
      required: false
      description: Return only active groups below the maximum tree depth.
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: One page of account groups from the calling workspace.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountGroupPage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: createAccountGroup
  x-cadran-idempotency: 'Active sibling labels are unique: a replay answers 409 and creates nothing.'
  summary: Create an account group in the calling workspace
  description: >-
    Creates a workspace-owned exclusive group. The parent, when present, must be
    active and belong to the calling workspace. The mutation requires the
    same-origin CSRF token.
  tags:
    - Account groups
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateAccountGroupRequest.yaml
  responses:
    '201':
      description: The group was created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountGroup.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '409':
      description: An active sibling already uses the normalized label.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: The group label, parent, color or bounds are invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/AccountGroupInputProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
