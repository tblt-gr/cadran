get:
  operationId: listPortfolioValuations
  summary: List the valuations of a portfolio account
  description: >-
    Active valuations, newest first. A superseded or withdrawn valuation leaves
    the list and stays readable by identifier. A closed or archived account
    stays readable.
  tags:
    - Portfolio
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/ListRevision.yaml
    - $ref: ../components/parameters/PortfolioAccountId.yaml
    - name: from
      in: query
      required: false
      description: First valuation date kept, inclusive.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: false
      description: Last valuation date kept, inclusive.
      schema:
        type: string
        format: date
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
  responses:
    '200':
      description: One page of valuation summaries.
      headers:
        X-List-Revision:
          $ref: ../components/headers/ListRevision.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortfolioValuationPage.yaml
    '400':
      description: A filter or pagination value is invalid.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/PortfolioValuationProblem.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/ListRevisionStale.yaml
    '422':
      description: The account is not followed in portfolio mode.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/PortfolioValuationProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: recordPortfolioValuation
  summary: Record a portfolio valuation
  description: >-
    Freezes a dated observation of the account, as a total (`TOTAL`) or one
    price per held instrument (`POSITIONS`). Exact decimals, one active
    valuation per account and date: a second one needs the current `version` and
    supersedes the first. A complete valuation publishes its total to net worth;
    a partial one publishes nothing.
  tags:
    - Portfolio
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/PortfolioAccountId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PortfolioValuationRequest.yaml
  responses:
    '201':
      description: The recorded valuation.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortfolioValuation.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/AccountMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: >-
        A valuation exists for the date, the version is stale, the limit of 5
        000 active valuations is reached, the idempotency key conflicts or the
        period is closed (`type: /problems/period-closed`).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/PortfolioValuationProblem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The body breaks a valuation rule; `code` names it and `field` points at
        the offending member.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/PortfolioValuationProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
