patch:
  operationId: correctAccountBalance
  x-cadran-idempotency: A replay presents a stale version and answers 409.
  summary: Correct an observed balance in place
  description: >-
    Amends the figure or comment of one active manual snapshot where it stands:
    same identifier and date, no second row and nothing superseded. The change
    is recorded in the audit trail without the figure. The snapshot is
    unreconciled again. A withdrawn, imported or calculated snapshot is refused.
  tags:
    - Accounts
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CorrectAccountBalanceRequest.yaml
  responses:
    '200':
      description: The snapshot as corrected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountBalanceSnapshot.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/AccountMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: >-
        The snapshot is withdrawn, not manual, or its version is stale (`type:
        /problems/account-balance-conflict` or `/problems/stale-version`).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: The fields are invalid or the account is archived.
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: ../components/schemas/Problem.yaml
              - $ref: ../components/schemas/AmountInputProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
