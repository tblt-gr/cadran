put:
  operationId: defineInitialPassword
  x-cadran-idempotency: >-
    One-time operation: once the password is defined a replay answers 409 and
    changes nothing.
  summary: Define the owner password on first run
  description: >-
    Public and one-time. Accepted only while the provisioned owner has no
    password; afterwards it answers 409. A same-origin browser mutation: it must
    send the X-CSRF-TOKEN header matching the csrf_token cookie, with an Origin
    of this server.
  tags:
    - Session
  security: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/DefinePasswordRequest.yaml
  responses:
    '204':
      description: The password is stored. The owner can now open a session.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '403':
      $ref: ../components/responses/CsrfFailure.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      description: >-
        The password breaks the policy: `/problems/weak-password` when it is
        outside 12 to 128 characters, `/problems/common-password` when it is one
        of the most common passwords. Nothing is written.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
