put:
  operationId: updateAccountGroup
  summary: Update an active account group
  description: >-
    Replaces editable group fields using optimistic versioning. Reparenting is
    allowed when it does not create a cycle or cross a workspace.
  tags:
    - Account groups
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateAccountGroupRequest.yaml
  responses:
    '200':
      description: The updated group.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountGroup.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: The label conflicts or the submitted version is stale.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The group fields are invalid or the tree would cycle. Invalid color
        includes a color field error.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/AccountGroupInputProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
