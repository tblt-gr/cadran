get:
  operationId: listTransactions
  summary: Search the calling workspace transactions
  description: >-
    Requires an authenticated session. Newest booked day first, then identifier,
    stable across pages. Every filter combines as a conjunction; repeated
    members of a multi-valued filter combine as a disjunction. Voided and
    rejected rows are omitted unless explicitly requested. A filter value naming
    an account, category or cursor from another workspace never surfaces a row
    or its existence: it answers an empty page, not 404. A later page whose
    watermark no longer matches the workspace answers 409 rather than serving a
    possibly-inconsistent page.
  tags:
    - Transactions
  security:
    - sessionCookie: []
  parameters:
    - name: from
      in: query
      required: false
      description: Inclusive booked_on lower bound.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: false
      description: Inclusive booked_on upper bound.
      schema:
        type: string
        format: date
    - name: accountId
      in: query
      required: false
      description: Repeatable. Any of the accounts. At most 20 values.
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          format: uuid
    - name: state
      in: query
      required: false
      description: >-
        Repeatable. When present, replaces the default state scope entirely
        (PENDING and BOOKED, plus VOIDED only when includeVoided is set).
      schema:
        type: array
        items:
          $ref: ../components/schemas/TransactionState.yaml
    - name: nature
      in: query
      required: false
      description: Repeatable. Any of the natures.
      schema:
        type: array
        items:
          $ref: ../components/schemas/TransactionNature.yaml
    - name: categoryId
      in: query
      required: false
      description: >-
        Repeatable. The transaction has a split on any of them. At most 20
        values.
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          format: uuid
    - name: includeDescendants
      in: query
      required: false
      description: Extends categoryId to the category subtrees.
      schema:
        type: boolean
        default: false
    - name: axis
      in: query
      required: false
      description: Repeatable. The transaction has a split carrying any of them.
      schema:
        type: array
        items:
          type: string
          enum:
            - DISCRETIONARY
            - ESSENTIAL
            - FIXED
            - PERSONAL
            - PROFESSIONAL
            - VARIABLE
    - name: minAmount
      in: query
      required: false
      description: >-
        Absolute lower bound on the amount, in assetCode: the sign of a movement
        is ignored, so 10 matches both +10.00 and -10.00. Must be a non-negative
        decimal. Requires assetCode.
      schema:
        type: string
    - name: maxAmount
      in: query
      required: false
      description: >-
        Absolute upper bound on the amount, in assetCode: the sign of a movement
        is ignored, so 10 matches both +10.00 and -10.00. Must be a non-negative
        decimal. Requires assetCode.
      schema:
        type: string
    - name: assetCode
      in: query
      required: false
      description: The asset minAmount and maxAmount are expressed in.
      schema:
        type: string
    - name: source
      in: query
      required: false
      description: Repeatable. Any of the sources.
      schema:
        type: array
        items:
          $ref: ../components/schemas/TransactionSource.yaml
    - name: q
      in: query
      required: false
      description: >-
        Free text matched against the normalized label, the raw label and the
        counterparty, case-insensitively. A text that reads as an amount (10,
        -10,50 €) also matches the absolute amount of a transaction, in any
        asset.
      schema:
        type: string
        maxLength: 80
    - name: direction
      in: query
      required: false
      description: >-
        Keeps only money coming in (INFLOW, amount above zero) or going out
        (OUTFLOW, amount below zero). Absent means both.
      schema:
        $ref: ../components/schemas/TransactionDirection.yaml
    - name: categoryType
      in: query
      required: false
      description: >-
        Keeps the transactions with at least one split on a category of that
        type in the workspace, archived categories included. Combined with
        categoryId, only the categories of both filters remain. Any other value
        answers 400.
      schema:
        $ref: ../components/schemas/CategoryType.yaml
    - name: includeVoided
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: categorization
      in: query
      required: false
      description: >-
        `NONE` restricts the page to the transactions carrying no split at all —
        the "to categorise" queue.
      schema:
        type: string
        enum:
          - ANY
          - NONE
        default: ANY
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor encoding the last returned booked day and identifier, and
        a workspace change watermark.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    '200':
      description: One cursor page of transactions from the calling workspace.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TransactionPage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '409':
      description: >-
        The cursor names a workspace watermark that no longer matches (`type:
        /problems/transactions.cursor_stale`); reload from the first page.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  operationId: createTransaction
  summary: Record a signed movement on one account
  description: >-
    Creates a pending or booked transaction on an active account of the calling
    workspace. An inflow is positive and an outflow negative. The submitted
    decimal scale is stored beside the amount. The mutation requires the
    same-origin CSRF token.
  tags:
    - Transactions
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateTransactionRequest.yaml
  responses:
    '201':
      description: The transaction was created, or the stored response was replayed.
      headers:
        Idempotency-Replayed:
          $ref: ../components/headers/IdempotencyReplayed.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Transaction.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/TransactionMutationForbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: >-
        A linked account or category changed concurrently, the same key was
        reused with a different request (`type:
        /problems/idempotency.key_reused`), or its first request is still in
        flight (`type: /problems/idempotency.in_flight`). A write that touches a
        closed period is refused with one stable problem, whichever the use case
        (`type: /problems/period-closed`).
      headers:
        Retry-After:
          $ref: ../components/headers/RetryAfterOneSecond.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '413':
      $ref: ../components/responses/TransactionPayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '422':
      description: >-
        The amount, dates, nature, category or bounds are invalid, or the splits
        allocation leaves a remainder unallocated (`type:
        /problems/splits.sum_missing`), exceeds the amount (`type:
        /problems/splits.sum_exceeds`), carries more than twenty rows (`type:
        /problems/splits.too_many`) or repeats a category (`type:
        /problems/splits.duplicate_category`), or an Idempotency-Key is invalid
        or required by an IMPORT or PROVIDER source. An income, expense, refund
        or fee on an account followed in portfolio mode is refused (`type:
        /problems/portfolio-account-requires-operations`).
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: ../components/schemas/Problem.yaml
              - $ref: ../components/schemas/AmountInputProblem.yaml
              - $ref: ../components/schemas/PortfolioAccountRequiresOperationsProblem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
