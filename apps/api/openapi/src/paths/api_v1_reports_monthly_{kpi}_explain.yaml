get:
  operationId: explainMonthlyKpi
  summary: Explain one monthly projection KPI of the calling workspace
  description: >-
    Selects a metric from the exact monthly projection view and exposes its
    formula, bounded source identifiers, freshness, quality and the metric
    policy version that produced it.
  tags:
    - Reporting
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../components/parameters/IncludeUpcoming.yaml
    - name: kpi
      in: path
      required: true
      schema:
        type: string
        enum:
          - cashIncome
          - nonCashBenefits
          - benefitSpending
          - budgetExpenses
          - uncategorizedExpenses
          - budgetSurplus
          - savingsTransfers
          - cashSavingsRate
          - savingsInflows
          - savingsWithdrawals
          - netSavingsTransfers
          - netSavingsRate
          - beginningNetWorth
          - endNetWorth
          - netWorthDelta
    - name: month
      in: query
      required: true
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
  responses:
    '200':
      description: The exact calculation details for the addressed monthly KPI.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MonthlyKpiExplanation.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/WorkspaceForbidden.yaml
    '422':
      description: The workspace exceeds a bounded aggregate limit.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
