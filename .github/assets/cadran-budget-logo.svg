<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="160"
     viewBox="0 0 720 160"
     fill="none"
     role="img"
     aria-labelledby="logo-title logo-description">
  <title id="logo-title">Cadran Budget</title>
  <desc id="logo-description">Un cadran circulaire avec graduations et aiguille, suivi du nom Cadran Budget.</desc>

  <rect width="720" height="160" rx="16" fill="#0a0a0b"/>

  <g id="symbol" transform="translate(28 20) scale(3)" stroke="#d7dbe1" stroke-width="2">
    <circle cx="20" cy="20" r="15"/>
    <path d="M20 8v5M20 27v5M8 20h5M27 20h5M20 20l7-7" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2.5" fill="#d7dbe1" stroke="none"/>
  </g>

  <g id="wordmark"
     fill="#d7dbe1"
     font-family="Geist, Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
     font-size="58"
     letter-spacing="-1.6">
    <text x="176" y="99" font-weight="600">Cadran</text>
    <text x="408" y="99" font-weight="400">Budget</text>
  </g>
</svg>
