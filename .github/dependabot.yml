version: 2

# Keep vulnerability alerts enabled without opening automated version PRs.
# Automated security PRs are disabled in the repository settings.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

# Add Composer, Dockerfile and Docker Compose entries in Sprint 0, together with the manifests and
# directories they monitor. Dependabot rejects update blocks that point to non-existent manifests.
