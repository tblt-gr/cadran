name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` so a corrected PR title re-runs the Conventional-commit check.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: 0

jobs:
  commitlint:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  quality:
    name: Frontend and contract quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm quality
      - run: pnpm test
      - run: pnpm lint:infrastructure

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cadran
          POSTGRES_PASSWORD: cadran
          POSTGRES_DB: cadran
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadran -d cadran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # apps/api/.env is gitignored and absent in CI; mirror the app container's
      # entrypoint so the Symfony runtime does not try to read it.
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      # No APP_ENV: unset defaults to dev; PHPUnit forces test for `composer test`.
      APP_SECRET: ci-backend-only
      DATABASE_URL: postgresql://cadran:cadran@127.0.0.1:5432/cadran?serverVersion=18&charset=utf8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # This job alone keeps the checkout credentials: the migration
          # upgrade-path check diffs against the base branch, and the repository
          # is private, so fetching that ref without them is impossible. Every
          # other job still checks out without credentials.
          persist-credentials: true
      - name: Fetch the base branch for the upgrade-path check
        if: github.base_ref != ''
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:2.9.8
      - name: Install Composer dependencies
        run: composer install --working-dir=apps/api --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Coding standards
        run: composer lint --working-dir=apps/api
      - name: Composer dependencies
        run: composer deps --working-dir=apps/api
      - name: Static analysis and dead code
        run: composer analyse --working-dir=apps/api
      - name: Module boundaries and workspace scope
        run: sh scripts/test-architecture.sh
      - name: Migrations from empty, from the released schema and from the latest release tag
        env:
          MIGRATION_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: sh scripts/ci/check-migrations.sh
      - name: Upgrade refusals and rollback flow
        run: sh scripts/ci/check-upgrade-refusals.sh
      - name: Prepare the PHPUnit database
        run: |
          php apps/api/bin/console doctrine:database:create --env=test --if-not-exists --no-interaction
          php apps/api/bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
      - name: Tests
        run: composer test --working-dir=apps/api

  backup-restore:
    name: Encrypted backup and retention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests only pay for this check when they touch what it exercises.
      - name: Detect backup-related changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comparison_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --quiet "$comparison_base" "$HEAD_SHA" -- \
            docker/backup docker/postgres docker/tools scripts/backup.sh \
            scripts/ci/check-backup-restore.sh scripts/init-local.sh Makefile compose.yaml \
            apps/api/migrations .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Backup, retention and failure handling
        if: steps.scope.outputs.run == 'true'
        run: sh scripts/ci/check-backup-restore.sh

  openapi:
    name: OpenAPI and generated client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint the OpenAPI document
        run: pnpm openapi:lint
      - name: Regenerate the TypeScript client
        run: pnpm generate:api
      - name: Type-check the regenerated client against the contract
        run: pnpm --filter @cadran/api-client typecheck
      - name: Assert the client and its request assertions still bind to the contract
        run: pnpm --filter @cadran/api-client test

  build:
    name: Build both applications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_ENV: prod
      APP_SECRET: ci-build-only
      DATABASE_URL: postgresql://cadran:cadran@127.0.0.1:5432/cadran?serverVersion=18&charset=utf8
      DEFAULT_URI: https://localhost:8443
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:2.9.8
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the web application and API client
        run: pnpm build
      - name: Compile the API container for production
        run: |
          composer install --working-dir=apps/api --no-interaction --no-progress \
            --prefer-dist --no-dev --optimize-autoloader --no-scripts
          php apps/api/bin/console cache:clear

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.9.8
      - run: composer audit --working-dir=apps/api --locked --no-interaction

  audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high

  image-scan:
    name: Runtime image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway owner of this disposable stack, used to check the session cookie flags; never a real credential.
      E2E_OWNER_EMAIL: header-check-owner@example.test
      E2E_OWNER_PASSWORD: header-check-ci-passphrase-not-a-secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Prepare local runtime files
        run: sh scripts/init-local.sh
      - name: Build the deployed images
        run: docker compose --env-file .env.local build app db
      - name: Scan the application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cadran_app:local
          severity: CRITICAL,HIGH
          # The merge gate blocks on regressions a PR author can act on; unfixable
          # base-image CVEs are chased by the nightly image-scan-nightly workflow.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Scan the database image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cadran_db:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build the backup image
        run: make backup-image
      - name: Scan the backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cadran_backup:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the Dockerfiles for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: docker
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Install the tooling dependencies
        run: make install
      - name: Check the HTTP security headers and cookie flags on the running stack
        run: make check-http-headers

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so a gitleaks release cannot change the rules or the config schema without a diff.
          GITLEAKS_VERSION: 8.30.1

  markdown_changes:
    name: Detect Markdown changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.markdown.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed Markdown files
        id: markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            comparison_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          else
            comparison_base="$BEFORE_SHA"
          fi

          if git diff --quiet "$comparison_base" "$HEAD_SHA" -- '*.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  markdown:
    name: Markdown
    needs: markdown_changes
    if: needs.markdown_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint:docs

  e2e_changes:
    name: Detect application changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes under the application paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            comparison_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          else
            comparison_base="$BEFORE_SHA"
          fi

          # A new branch push has no previous commit: nothing to compare against, so run the suite.
          if [ -z "$comparison_base" ] || [ "$comparison_base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$comparison_base" "$HEAD_SHA" -- apps/ packages/ docker/ tests/e2e/ scripts/ compose.yaml Makefile pnpm-lock.yaml package.json .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Browser end-to-end
    needs: e2e_changes
    if: needs.e2e_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway owner of this disposable stack; never a real credential.
      E2E_OWNER_EMAIL: e2e-owner@example.test
      E2E_OWNER_PASSWORD: e2e-ci-passphrase-not-a-secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Prepare local runtime files
        run: sh scripts/init-local.sh
      - name: Install the tooling dependencies
        run: make install
      - name: Provision the e2e owner and the demo ledger
        run: make e2e-provision
      - name: Build the stack and run the Playwright suite
        run: |
          started=$(date +%s)
          status=0
          make e2e || status=$?
          elapsed=$(( $(date +%s) - started ))
          printf '### Browser end-to-end\n\n`make e2e` (stack build, migrations and Playwright): %d min %d s, exit code %d.\n' \
            "$((elapsed / 60))" "$((elapsed % 60))" "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: var/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI gate
    needs:
      - commitlint
      - quality
      - backend
      - backup-restore
      - openapi
      - build
      - composer-audit
      - audit
      - image-scan
      - secrets
      - markdown_changes
      - markdown
      - e2e_changes
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: always()
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
