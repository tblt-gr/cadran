name: cadran

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # Docker Desktop on WSL restarts containers before it can serve bind mounts from the Linux
  # distribution, so a container that bind-mounts a host file fails at every boot. This one-shot
  # service copies the host secret files into a named volume on each `docker compose up`; app and
  # db mount only named volumes and restart on their own.
  secrets:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: cadran_db:local
    container_name: ${CADRAN_STACK:-cadran}_secrets
    # Root without any capability: it owns the fresh volume and makes the copies world-readable
    # for www-data (33) and postgres (70). It has no network and exits once the copy is done.
    user: '0:0'
    entrypoint: ['/bin/sh', '-ceu']
    command:
      - |
        mkdir -p /target/app /target/db
        install -m 0444 /run/secrets/app_secret /target/app/app_secret
        install -m 0444 /run/secrets/db_password /target/app/db_password
        install -m 0444 /run/secrets/db_password /target/db/db_password
    secrets:
      - app_secret
      - db_password
    network_mode: none
    volumes:
      - type: volume
        source: secrets
        target: /target
    mem_limit: 32m
    pids_limit: 16
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        CADRAN_VERSION: ${CADRAN_VERSION:-unknown}
    image: cadran_app:local
    container_name: ${CADRAN_STACK:-cadran}_app
    user: '33:33'
    environment:
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-notice}
      CADRAN_SERVER_NAME: ${CADRAN_SERVER_NAME:-localhost}
      DEFAULT_URI: https://${CADRAN_SERVER_NAME:-localhost}:${CADRAN_HTTPS_PORT:-8443}
    ports:
      - name: https
        target: 8443
        published: ${CADRAN_HTTPS_PORT:-8443}
        host_ip: ${CADRAN_HTTPS_BIND:-127.0.0.1}
        protocol: tcp
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - edge
      - internal
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: app
    tmpfs:
      - /app/apps/api/var:uid=33,gid=33,mode=0700
      - /tmp:uid=33,gid=33,mode=1777
    mem_limit: ${CADRAN_APP_MEMORY:-512m}
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'php', '/usr/local/bin/healthcheck.php']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: cadran_db:local
    container_name: ${CADRAN_STACK:-cadran}_db
    user: '70:70'
    environment:
      POSTGRES_DB: cadran
      POSTGRES_USER: cadran
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      secrets:
        condition: service_completed_successfully
    networks:
      - internal
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: db
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70,mode=1777
    mem_limit: ${CADRAN_DB_MEMORY:-1g}
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --dbname=cadran --username=cadran']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

networks:
  edge:
    name: ${CADRAN_STACK:-cadran}_edge
  internal:
    name: ${CADRAN_STACK:-cadran}_internal
    internal: true

volumes:
  caddy_data:
    name: ${CADRAN_STACK:-cadran}_caddy_data
  caddy_config:
    name: ${CADRAN_STACK:-cadran}_caddy_config
  db_data:
    name: ${CADRAN_STACK:-cadran}_db_data
  secrets:
    name: ${CADRAN_STACK:-cadran}_secrets

secrets:
  app_secret:
    file: ${CADRAN_SECRETS_DIR:-./var/docker-secrets}/app_secret
  db_password:
    file: ${CADRAN_SECRETS_DIR:-./var/docker-secrets}/db_password
